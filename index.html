<title>Deen Companion</title>
<!-- Single-file app. Serverless peer-to-peer network (no Firebase, no backend). Set it up from Admin → Network. Open the admin area with #staff. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Amiri:wght@400;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Oswald:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182420; --forest:#123128; --forest-deep:#0B231D; --emerald:#1C5C48;
    --gold:#C79A4B; --gold-light:#E4C583; --parchment:#FBF6EA; --paper:#F2E9D4;
    --paper-line:#E4D6AF; --ruby:#8A2A34; --muted:#6E6555; --stage:#DED6C3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Manrope', sans-serif; background:var(--stage); color:var(--ink); min-height:100vh; }
  button{ transition:transform .12s ease; }
  button:active{ transform:scale(.95); }

  .switcher{ display:flex; justify-content:center; gap:8px; padding:18px 0 8px; }
  .switcher button{ border:1.5px solid var(--forest); background:transparent; color:var(--forest); font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; padding:9px 18px; border-radius:20px; cursor:pointer; }
  .switcher button.active{ background:var(--forest); color:#fff; }

  /* ---------- ANIMATIONS ---------- */
  @keyframes fadeSlideIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .screen-anim{ animation:fadeSlideIn .32s ease; }
  @keyframes cardIn{ from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  .card-in{ opacity:0; animation:cardIn .42s ease forwards; }
  .card-in:nth-child(1){animation-delay:.02s}
  .card-in:nth-child(2){animation-delay:.06s}
  .card-in:nth-child(3){animation-delay:.10s}
  .card-in:nth-child(4){animation-delay:.14s}
  .card-in:nth-child(5){animation-delay:.18s}
  .card-in:nth-child(6){animation-delay:.22s}
  .card-in:nth-child(n+7){animation-delay:.26s}
  @keyframes pulseLive{ 0%{box-shadow:0 0 0 0 rgba(220,38,38,.55);} 70%{box-shadow:0 0 0 9px rgba(220,38,38,0);} 100%{box-shadow:0 0 0 0 rgba(220,38,38,0);} }
  @keyframes msgIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @keyframes shimmer{ 0%{background-position:120% 50%} 100%{background-position:-20% 50%} }
  @keyframes splashPulse{ 0%,100%{transform:scale(1); opacity:.92;} 50%{transform:scale(1.1); opacity:1;} }
  @keyframes breathe{ 0%,100%{transform:scale(0.9); opacity:.5;} 50%{transform:scale(1.08); opacity:1;} }
  @keyframes floatDrift{ 0%,100%{transform:translateY(0) scale(1); opacity:.3;} 50%{transform:translateY(-9px) scale(1.3); opacity:.9;} }
  @keyframes iconPop{ 0%{transform:scale(1);} 45%{transform:scale(1.3);} 100%{transform:scale(1);} }
  @keyframes rowPulse{ 0%,100%{background-color:rgba(28,92,72,0.05);} 50%{background-color:rgba(28,92,72,0.13);} }
  @keyframes shimmerSweep{ from{left:-60%;} to{left:135%;} }
  @keyframes brandGlow{ 0%,100%{filter:drop-shadow(0 0 0px rgba(228,197,131,0));} 50%{filter:drop-shadow(0 0 5px rgba(228,197,131,0.85));} }
  .card-in{ position:relative; overflow:hidden; }
  .card-in::after{ content:''; position:absolute; top:0; left:-60%; width:35%; height:100%; pointer-events:none;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent); transform:skewX(-18deg);
    animation:shimmerSweep 1s ease forwards; animation-delay:inherit; z-index:2; }
  .row-pulse{ animation:rowPulse 2.6s ease-in-out infinite; border-radius:12px; }
  .navbtn.active svg{ animation:iconPop .38s ease; }
  .ring-glow{ position:absolute; inset:-16px; border-radius:50%; background:radial-gradient(circle, rgba(228,197,131,0.4), transparent 68%); animation:breathe 3.2s ease-in-out infinite; pointer-events:none; }
  .brand-icon{ animation:brandGlow 2.8s ease-in-out infinite; }
  .float-dot{ position:absolute; border-radius:50%; background:#E4C583; pointer-events:none; animation:floatDrift 3.6s ease-in-out infinite; }
  @keyframes patternDrift{ from{background-position:0 0, 0 0, 0 0;} to{background-position:0 0, 56px 56px, 0 0;} }
  .prayer-header-anim{ animation:patternDrift 6s linear infinite; }
  @keyframes avatarSpin{ to{ transform:rotate(360deg); } }
  .avatar-glow{ position:relative; display:inline-flex; flex-shrink:0; border-radius:50%; }
  .avatar-glow::before{
    content:''; position:absolute; inset:-4px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--gold-light), var(--emerald), var(--gold), var(--ruby), var(--gold-light));
    animation:avatarSpin 3s linear infinite;
    box-shadow:0 0 10px rgba(199,154,75,.45);
    z-index:0;
  }
  .avatar-glow > img, .avatar-glow > div{ position:relative; z-index:1; }

  /* ---------- PHONE APP ---------- */
  #view-app{ display:flex; justify-content:center; padding:10px 12px 40px; }
  .phone{
    width:390px; max-width:100%; height:800px; position:relative;
    background:var(--parchment); border-radius:30px; overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:0 30px 60px rgba(11,35,29,0.35); border:8px solid var(--ink);
    transition:background .2s ease, color .2s ease;
  }
  .phone.dark{ --parchment:#12211C; --paper:#1A2E27; --paper-line:#2A4038; --ink:#EFE9D8; --muted:#9FB0A6; }

  .splash{ position:absolute; inset:0; z-index:50; background:linear-gradient(160deg, var(--forest), var(--forest-deep) 70%, #081813);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    transition:opacity .45s ease, visibility .45s; }
  .splash.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .splash-icon{ animation:splashPulse 1.4s ease infinite; }
  .splash-title{ font-family:'Fraunces',serif; color:var(--gold-light); font-size:19px; letter-spacing:.4px; opacity:0; animation:fadeSlideIn .6s ease .2s forwards; }

  .screen{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .scroll{ flex:1; overflow-y:auto; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 16px 14px; background:var(--parchment); border-bottom:1px solid var(--paper-line); }
  .topbar h1{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:var(--forest); }
  .phone.dark .topbar h1{ color:var(--gold-light); }
  .iconbtn{ border:none; background:none; color:var(--ink); cursor:pointer; display:flex; padding:4px; }

  .banner-wrap{ position:relative; margin:12px 18px 0; border-radius:18px; overflow:hidden; }
  .banner-track{ display:flex; transition:transform .55s cubic-bezier(.4,0,.2,1); }
  .banner-slide{ min-width:100%; position:relative;
    background:linear-gradient(160deg, var(--forest) 0%, var(--forest-deep) 60%, #081813 100%); padding:30px 20px 34px; text-align:center; }
  .banner-slide .ar{ font-family:'Amiri',serif; font-size:27px; line-height:1.8; direction:rtl;
    background:linear-gradient(180deg, var(--gold-light), var(--gold) 70%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .banner-slide .rule{ width:44px; height:2px; background:var(--gold); margin:12px auto 10px; border-radius:2px; }
  .banner-slide .sub{ color:#D9CFB6; font-size:12.5px; }
  .banner-dots{ position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:center; gap:6px; z-index:2; }
  .banner-dot{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.35); border:none; cursor:pointer; padding:0; transition:.25s; }
  .banner-dot.active{ width:16px; border-radius:4px; background:var(--gold-light); }

  .progress-bar{ height:3px; background:var(--paper-line); flex-shrink:0; }
  .progress-fill{ height:100%; width:0%; background:var(--gold); transition:width .08s linear; }

  .brandline{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px 0; }
  .brand{ display:flex; align-items:center; gap:8px; font-family:'Fraunces',serif; font-weight:600; font-size:18px; color:var(--forest); }
  .phone.dark .brand{ color:var(--gold-light); }

  .search-wrap{ padding:12px 18px 0; }
  .search-box{ display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--paper-line); border-radius:12px; padding:9px 12px; }
  .search-box input{ border:none; background:none; outline:none; font-family:'Manrope',sans-serif; font-size:13px; color:var(--ink); flex:1; }
  .search-results{ padding:6px 18px 4px; }

  /* ---------- ADMIN PANEL ---------- */

  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }

  /* ===== Whole-app animation layer ===== */
  @keyframes itemIn{ from{opacity:0; transform:translateY(16px) scale(.985);} to{opacity:1; transform:none;} }
  .anim-item{ animation:itemIn .5s cubic-bezier(.2,.7,.2,1) backwards; animation-delay:calc(var(--i,0) * 55ms + 40ms); }
  @keyframes slideFromRight{ from{opacity:0; transform:translateX(34px);} to{opacity:1; transform:none;} }
  @keyframes slideFromLeft{ from{opacity:0; transform:translateX(-34px);} to{opacity:1; transform:none;} }
  .screen-fwd{ animation:slideFromRight .34s cubic-bezier(.2,.7,.2,1) backwards; }
  .screen-back{ animation:slideFromLeft .34s cubic-bezier(.2,.7,.2,1) backwards; }
  @keyframes rip{ to{ transform:scale(1); opacity:0; } }
  .ripple{ position:absolute; border-radius:50%; background:currentColor; opacity:.22; transform:scale(0); animation:rip .6s ease-out forwards; pointer-events:none; }
  @keyframes btnSheen{ 0%,62%{ left:-70%; } 100%{ left:140%; } }
  .btn-primary{ position:relative; overflow:hidden; }
  .btn-primary::after{ content:''; position:absolute; top:0; left:-70%; width:40%; height:100%; pointer-events:none;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.32), transparent); transform:skewX(-20deg); animation:btnSheen 4.8s ease-in-out infinite; }
  @keyframes icoFloat{ 0%,100%{ transform:translateY(0) rotate(0); } 50%{ transform:translateY(-3px) rotate(4deg); } }
  .catcard .ci{ animation:icoFloat 3.8s ease-in-out infinite; }
  .catcard:nth-child(2n) .ci{ animation-delay:-1.2s; }
  .catcard:nth-child(3n) .ci{ animation-delay:-2.4s; }
  .catcard:hover .ci{ animation-duration:1.4s; }
  .trow .thumb, .arow .thumb{ transition:transform .3s ease; }
  .trow:hover .thumb, .arow:hover .thumb{ transform:scale(1.06) rotate(-2deg); }
  .arow, .trow, .gcard{ transition:transform .2s ease, box-shadow .2s ease; }
  .arow:hover, .gcard:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(18,49,40,.10); }
  @keyframes tapPop{ 0%{ transform:scale(1); } 40%{ transform:scale(1.13); } 100%{ transform:scale(1); } }
  .tap-pop{ animation:tapPop .3s ease; }
  @keyframes tasbihRing{ 0%{ box-shadow:0 12px 30px rgba(18,49,40,.3), 0 0 0 0 rgba(228,197,131,.6); } 100%{ box-shadow:0 12px 30px rgba(18,49,40,.3), 0 0 0 26px rgba(228,197,131,0); } }
  .tasbih-btn.tap-pop{ animation:tapPop .3s ease, tasbihRing .5s ease-out; }
  @keyframes qiblaPulse{ 0%,100%{ box-shadow:0 0 0 5px rgba(31,163,91,.22), 0 0 22px rgba(31,163,91,.5); } 50%{ box-shadow:0 0 0 12px rgba(31,163,91,.12), 0 0 40px rgba(31,163,91,.75); } }
  #qibla-dial.qibla-ok{ animation:qiblaPulse 1.3s ease-in-out infinite; }
  @keyframes kaabaGlow{ 0%,100%{ filter:drop-shadow(0 0 2px rgba(228,197,131,.4)); } 50%{ filter:drop-shadow(0 0 9px rgba(228,197,131,.95)); } }
  #qibla-kaaba{ animation:kaabaGlow 2.2s ease-in-out infinite; }
  @keyframes noteIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  #qibla-note{ animation:noteIn .35s ease; }
  .navbtn span{ transition:transform .25s ease, color .25s ease; }
  .navbtn.active span{ transform:translateY(-1px); }
  .field input:focus, .field select:focus, .field textarea:focus, select:focus{ box-shadow:0 0 0 3px rgba(28,92,72,.18); transition:box-shadow .2s; }
  @media (prefers-reduced-motion: reduce){
    .anim-item, .screen-fwd, .screen-back, .btn-primary::after, .catcard .ci, #qibla-kaaba{ animation:none !important; }
  }

  /* ===== Qaza tools ===== */
  .qz-hero{ background:linear-gradient(150deg,#0B231D,#1C5C48); color:#fff; border-radius:20px; padding:18px; margin-bottom:12px; position:relative; overflow:hidden; box-shadow:0 10px 24px rgba(18,49,40,.25); }
  .qz-hero::before{ content:''; position:absolute; right:-40px; top:-40px; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle, rgba(228,197,131,.35), transparent 70%); animation:breathe 4s ease-in-out infinite; pointer-events:none; }

/* ===== Animated logo screen (splash) ===== */
.sp2{ position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.sp2-stars i{ position:absolute; width:var(--s,2px); height:var(--s,2px); border-radius:50%; background:#F3DFAA; opacity:0; box-shadow:0 0 6px rgba(243,223,170,.8); animation:spTwinkle var(--d,3s) ease-in-out infinite; }
@keyframes spTwinkle{ 0%,100%{ opacity:0; transform:scale(.6); } 50%{ opacity:.95; transform:scale(1.25); } }
.sp2-bism{ position:absolute; top:calc(54px + env(safe-area-inset-top)); font-family:'Noto Naskh Arabic',serif; font-size:21px; color:var(--gold-light); opacity:0; text-shadow:0 0 14px rgba(228,197,131,.45); animation:spBism 1.4s ease .3s forwards; }
@keyframes spBism{ from{ opacity:0; transform:translateY(-8px); } to{ opacity:.92; transform:none; } }
.sp2-logo{ position:relative; width:176px; height:176px; display:flex; align-items:center; justify-content:center; }
.sp2-glow{ position:absolute; inset:-34px; border-radius:50%; background:radial-gradient(circle, rgba(228,197,131,.55), rgba(228,197,131,.12) 45%, transparent 70%); opacity:0; transform:scale(.4); animation:spGlowIn 1.2s cubic-bezier(.2,.7,.2,1) .2s forwards, spBreathe 3.2s ease-in-out 1.4s infinite; }
@keyframes spGlowIn{ to{ opacity:1; transform:scale(1); } }
@keyframes spBreathe{ 0%,100%{ transform:scale(1); opacity:.85; } 50%{ transform:scale(1.12); opacity:1; } }
.sp2-geo{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; animation:spSpin 38s linear 1.9s infinite; }
.sp2-geo *{ fill:none; stroke:rgba(228,197,131,.7); stroke-width:1.2; stroke-dasharray:100; stroke-dashoffset:100; animation:spDraw 1.7s cubic-bezier(.4,0,.2,1) .4s forwards; }
.sp2-geo .g1{ stroke:rgba(228,197,131,.35); animation-delay:.3s; }
.sp2-geo .g2{ animation-delay:.6s; } .sp2-geo .g2.b{ animation-delay:.8s; }
.sp2-geo .g3{ stroke:rgba(228,197,131,.45); animation-delay:1s; }
@keyframes spDraw{ to{ stroke-dashoffset:0; } }
@keyframes spSpin{ to{ transform:rotate(360deg); } }
.sp2-orbit{ position:absolute; inset:-12px; opacity:0; animation:spFade .8s ease 1.4s forwards, spSpin 7s linear 1.4s infinite; }
.sp2-orbit i{ position:absolute; width:7px; height:7px; border-radius:50%; background:var(--gold-light); box-shadow:0 0 10px 2px rgba(228,197,131,.8); }
.sp2-orbit i:nth-child(1){ top:0; left:50%; margin-left:-3.5px; }
.sp2-orbit i:nth-child(2){ bottom:14%; left:6%; width:5px; height:5px; opacity:.7; }
.sp2-orbit i:nth-child(3){ bottom:14%; right:6%; width:4px; height:4px; opacity:.55; }
@keyframes spFade{ to{ opacity:1; } }
.sp2-mark{ position:relative; width:108px; height:108px; border-radius:30%; display:flex; align-items:center; justify-content:center; overflow:hidden;
  background:linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.03)); border:1.5px solid rgba(228,197,131,.55);
  box-shadow:0 18px 40px rgba(0,0,0,.35), inset 0 0 22px rgba(228,197,131,.12); opacity:0; transform:scale(.3) rotate(-14deg);
  animation:spPop 1s cubic-bezier(.34,1.56,.64,1) .55s forwards, spFloat 4.2s ease-in-out 1.7s infinite; }
@keyframes spPop{ to{ opacity:1; transform:scale(1) rotate(0); } }
@keyframes spFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
.sp2-img{ width:100%; height:100%; object-fit:contain; padding:10%; box-sizing:border-box; }
.sp2-mark::after{ content:''; position:absolute; top:0; left:-60%; width:40%; height:100%; pointer-events:none; background:linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent); transform:skewX(-20deg); animation:spSheen 3.6s ease-in-out 2.2s infinite; }
@keyframes spSheen{ 0%,55%{ left:-60%; } 100%{ left:140%; } }
.sp2-name{ position:relative; margin-top:34px; font-family:'Fraunces',serif; font-size:29px; font-weight:600; color:var(--gold-light); letter-spacing:.5px; text-align:center; padding:2px 22px; overflow:hidden; }
.sp2-name .c{ display:inline-block; opacity:0; transform:translateY(16px); filter:blur(6px); animation:spChar .7s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(1.25s + var(--k,0) * 55ms); }
@keyframes spChar{ to{ opacity:1; transform:none; filter:blur(0); } }
.sp2-name::after{ content:''; position:absolute; top:0; left:-60%; width:35%; height:100%; pointer-events:none; background:linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent); transform:skewX(-20deg); mix-blend-mode:overlay; animation:spSheen 3.2s ease-in-out 2.6s infinite; }
.sp2-div{ display:flex; align-items:center; gap:10px; margin-top:14px; height:10px; }
.sp2-div i{ display:block; height:1px; width:0; background:linear-gradient(90deg, transparent, var(--gold)); animation:spLine .9s ease 2s forwards; }
.sp2-div i:last-child{ background:linear-gradient(270deg, transparent, var(--gold)); }
.sp2-div b{ width:7px; height:7px; background:var(--gold-light); transform:rotate(45deg) scale(0); box-shadow:0 0 10px rgba(228,197,131,.8); animation:spDia .6s cubic-bezier(.34,1.56,.64,1) 1.9s forwards; }
@keyframes spLine{ to{ width:64px; } }
@keyframes spDia{ to{ transform:rotate(45deg) scale(1); } }
.sp2-tag{ margin-top:12px; font-size:13px; letter-spacing:.3px; color:rgba(239,233,216,.8); text-align:center; padding:0 28px; opacity:0; animation:fadeSlideIn .8s ease 2.3s forwards; }
.sp2-bar{ position:absolute; bottom:calc(58px + env(safe-area-inset-bottom)); width:132px; height:3px; border-radius:3px; background:rgba(255,255,255,.12); overflow:hidden; }
.sp2-bar span{ display:block; height:100%; width:0; border-radius:3px; background:linear-gradient(90deg, var(--gold), var(--gold-light)); box-shadow:0 0 10px rgba(228,197,131,.8); animation:spBarFill var(--sp-dur,5s) linear forwards; }
@keyframes spBarFill{ to{ width:100%; } }
.splash.leaving{ animation:spOut .75s cubic-bezier(.4,0,.2,1) forwards; pointer-events:none; }
@keyframes spOut{ to{ opacity:0; transform:scale(1.07); filter:blur(5px); } }
.splash.sp-prev{ position:fixed; z-index:500; cursor:pointer; }
.splash.sp-static .sp2 *, .splash.sp-static .sp2{ animation:none !important; }
.splash.sp-static .sp2-mark, .splash.sp-static .sp2-bism, .splash.sp-static .sp2-tag, .splash.sp-static .sp2-glow, .splash.sp-static .sp2-orbit, .splash.sp-static .sp2-name .c{ opacity:1 !important; transform:none !important; filter:none !important; }
.splash.sp-static .sp2-geo *{ stroke-dashoffset:0 !important; }
.splash.sp-static .sp2-div i{ width:64px !important; } .splash.sp-static .sp2-div b{ transform:rotate(45deg) !important; }
.splash.sp-static .sp2-bar span{ width:100% !important; } .splash.sp-static .sp2-stars{ display:none; }
@media (prefers-reduced-motion: reduce){
  .sp2 *{ animation:none !important; }
  .sp2-mark, .sp2-bism, .sp2-tag, .sp2-glow, .sp2-orbit, .sp2-name .c{ opacity:1 !important; transform:none !important; filter:none !important; }
  .sp2-geo *{ stroke-dashoffset:0 !important; } .sp2-div i{ width:64px !important; } .sp2-div b{ transform:rotate(45deg) !important; }
  .sp2-bar span{ width:100% !important; } .sp2-stars{ display:none; }
}

/* ===== Motion layer: home ambience, nav, scroll reveal ===== */

.scroll{ position:relative; isolation:isolate; }

.ambient i:nth-child(1){ width:190px; height:190px; left:-50px; top:-60px; background:rgba(199,154,75,.45); }
.ambient i:nth-child(2){ width:230px; height:230px; right:-70px; top:-40px; background:rgba(31,163,91,.30); animation-duration:18s; animation-delay:-5s; }
.ambient i:nth-child(3){ width:150px; height:150px; left:38%; top:80px; background:rgba(228,197,131,.35); animation-duration:11s; animation-delay:-3s; }
.phone.dark .ambient i{ opacity:.3; }
.ambient u{ position:absolute; left:var(--x,50%); bottom:0; width:4px; height:4px; border-radius:50%; text-decoration:none; background:rgba(199,154,75,.95); box-shadow:0 0 8px rgba(228,197,131,.9); opacity:0; animation:ambRise var(--d,9s) linear var(--dl,0s) infinite; }
@keyframes ambDrift{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(34px,26px) scale(1.18); } }
@keyframes ambRise{ 0%{ opacity:0; transform:translateY(0) scale(.6); } 15%{ opacity:.9; } 100%{ opacity:0; transform:translateY(-250px) scale(1.2); } }
.brand-logo{ border-radius:7px; object-fit:contain; display:block; animation:brandFloat 5s ease-in-out infinite; }
@keyframes brandFloat{ 0%,100%{ transform:translateY(0) rotate(0); } 50%{ transform:translateY(-2px) rotate(-3deg); } }
@keyframes navPop{ 0%{ transform:scale(.7) translateY(4px); } 60%{ transform:scale(1.22) translateY(-3px); } 100%{ transform:none; } }
.navbtn.pop svg{ animation:navPop .55s cubic-bezier(.34,1.56,.64,1); }
.iconbtn{ transition:transform .2s cubic-bezier(.34,1.56,.64,1); }
.iconbtn:active{ transform:scale(.86); }
.iconbtn[aria-label="Settings"]:hover svg{ transform:rotate(70deg); }
.iconbtn[aria-label="Settings"] svg{ transition:transform .5s cubic-bezier(.34,1.56,.64,1); }

/* settings drawer motion */
@keyframes sdIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
.sd.open .sd-head, .sd.open .sd-sec, .sd.open .sd-about{ animation:sdIn .5s cubic-bezier(.2,.7,.2,1) backwards; }
.sd.open .sd-sec:nth-child(1){ animation-delay:.10s; } .sd.open .sd-sec:nth-child(2){ animation-delay:.16s; }
.sd.open .sd-sec:nth-child(3){ animation-delay:.22s; } .sd.open .sd-sec:nth-child(4){ animation-delay:.28s; }
.sd.open .sd-sec:nth-child(5){ animation-delay:.34s; } .sd.open .sd-sec:nth-child(6){ animation-delay:.40s; }
.sd.open .sd-about{ animation-delay:.46s; }
.sd-seg button{ transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .25s, border-color .25s; }
.sd-seg button:active, .sd-row:active{ transform:scale(.96); }
.sd-row{ transition:transform .18s cubic-bezier(.34,1.56,.64,1); }
.sd-sw::after{ transition:inset-inline-start .35s cubic-bezier(.34,1.56,.64,1); }
.sd-about-mark{ display:flex; justify-content:center; margin-bottom:8px; }
.sd-about-mark .brand-logo{ width:48px; height:48px; border-radius:14px; }

/* admin: branding panel */
.ba-card{ max-width:540px; background:var(--parchment); border:1px solid var(--paper-line); border-radius:16px; padding:18px; }
.ba-card h3{ font-family:'Fraunces',serif; color:var(--forest); margin-bottom:14px; font-size:18px; }
.ba-logo-row{ display:flex; gap:16px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
.ba-logo{ width:96px; height:96px; flex:none; border-radius:28%; display:flex; align-items:center; justify-content:center; overflow:hidden; background:linear-gradient(150deg, var(--forest), var(--forest-deep)); box-shadow:0 10px 24px rgba(11,35,29,.3); animation:baFloat 4s ease-in-out infinite; }
.ba-logo img{ width:100%; height:100%; object-fit:contain; padding:10%; box-sizing:border-box; }
@keyframes baFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }
.ba-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; align-items:center; }
.ba-hint{ font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.55; }
.ba-file{ display:none; }
</style>
</head>

/* ============================================================
   DeenNet — small crypto helpers (no network code)
   • Identity  = an ECDSA key pair made on the device (the "backup key").

<script>
/* ============ STORAGE (uses window.storage when available, falls back to localStorage) ============ */
const HAS_CLOUD_STORAGE = (typeof window !== 'undefined' && !!window.storage);
if(!HAS_CLOUD_STORAGE){
  console.warn("window.storage not found — falling back to this browser's localStorage. Data will only be saved on this device and will NOT be shared with other people opening this file.");
}
const storageAPI = {
  async get(key, shared){
    if(HAS_CLOUD_STORAGE) return await window.storage.get(key, shared);
    const raw = localStorage.getItem('dc:'+key);
    if(raw===null) throw new Error('key not found: '+key);
    return { key, value: raw, shared: !!shared };
  },
  async set(key, value, shared){
    if(HAS_CLOUD_STORAGE) return await window.storage.set(key, value, shared);
    localStorage.setItem('dc:'+key, value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    if(HAS_CLOUD_STORAGE) return await window.storage.delete(key, shared);
    localStorage.removeItem('dc:'+key);
    return { key, deleted:true, shared: !!shared };
  },
  async list(prefix, shared){
    if(HAS_CLOUD_STORAGE) return await window.storage.list(prefix, shared);
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('dc:') && (!prefix || k.slice(3).startsWith(prefix))) keys.push(k.slice(3));
    }
    return { keys, prefix, shared: !!shared };
  }
};

// City-level entries: nearly every city in IN_GEO gets its well-known "Jama Masjid" listing
// (name/city only - address left blank). This is a starting point for the community to verify
// and enrich via the suggestion form; the per-city Google Maps button shows live results.
const INDIA_CITY_MASJIDS = (()=>{
  const covered = new Set(INDIA_FAMOUS_MASJIDS.concat(INDIA_VERIFIED_MASJIDS).map(m=>(m.name+'|'+m.city).toLowerCase()));
  const out = [];
  Object.keys(IN_GEO).forEach(state=>{
    (IN_GEO[state]||[]).forEach(city=>{
      const k = ('jama masjid|'+city).toLowerCase();
      if(!covered.has(k)){ out.push(_s('Jama Masjid', state, city, '')); covered.add(k); }
    });
  });
  return out;
})();

function mergeSeedMasjids(){
  if(DATA.masjidSeedVersion === SEED_VERSION) return;
  const key = m => (m.name+'|'+m.city).toLowerCase();
  const have = new Set(DATA.masjids.map(key));
  INDIA_FAMOUS_MASJIDS.concat(INDIA_VERIFIED_MASJIDS, INDIA_CITY_MASJIDS).forEach(m=>{ if(!have.has(key(m))) DATA.masjids.push(JSON.parse(JSON.stringify(m))); });
  DATA.masjidSeedVersion = SEED_VERSION;
}

function describeStorageError(e){
  const msg = (e && e.message) ? e.message : '';
  if(/quota/i.test(msg)) return 'Your browser storage is full — try removing an old photo, reference image, or naat to free up space.';
  return 'Could not save: '+(msg || 'unknown storage error');
}

    if(!result) showToast('Storage rejected that save — please try again');

}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}

  const t = document.getElementById('toast');
  t.textContent = trStr(msg);

}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function scholarAvatarHtml(sch, size){
  if(!sch) return '';
  let inner;
  if(sch.avatarUrl){
    inner = `<img src="${sch.avatarUrl}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;display:block;" alt="${escapeHtml(sch.name)}">`;
  }else{
    const initials = (sch.name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
    inner = `<div style="width:${size}px;height:${size}px;border-radius:50%;background:linear-gradient(150deg, var(--emerald), var(--forest));display:flex;align-items:center;justify-content:center;color:var(--gold-light);font-weight:800;font-size:${Math.round(size*0.4)}px;">${initials}</div>`;
  }
  return `<span class="avatar-glow" style="width:${size}px;height:${size}px;">${inner}</span>`;
}
function fileToResizedDataUrl(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSize/Math.max(w,h));
        w = Math.max(1,Math.round(w*scale)); h = Math.max(1,Math.round(h*scale));
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = ()=>reject(new Error('bad image'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}

/* ---- Shared reference-image manager (used in article + Q&A answer modals) ---- */
let modalRefs = [];
let refsContainerId = '';
function renderRefsList(){
  const el = document.getElementById(refsContainerId);
  if(!el) return;
  el.innerHTML = (modalRefs.length ? modalRefs.map((r,i)=>`
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;padding:7px;background:var(--paper);border:1px solid var(--paper-line);border-radius:10px;">
      <img src="${r.image}" style="width:42px;height:42px;object-fit:cover;border-radius:6px;flex-shrink:0;">
      <input value="${escapeHtml(r.caption||'')}" placeholder="e.g. Sahih Bukhari, Vol. 1, Page 202" oninput="updateRefCaption(${i}, this.value)" style="flex:1;border:1px solid var(--paper-line);border-radius:6px;padding:6px 8px;font-size:12px;background:var(--parchment);color:var(--ink);">
      <button type="button" onclick="removeRef(${i})" aria-label="Remove" style="border:none;background:none;color:var(--ruby);cursor:pointer;padding:4px;">${icon('trash',15)}</button>
    </div>`).join('') : `<div style="font-size:11px;color:var(--muted);margin-bottom:6px;">No reference images added yet.</div>`);
}
function updateRefCaption(i, v){ if(modalRefs[i]) modalRefs[i].caption = v; }
function removeRef(i){ modalRefs.splice(i,1); renderRefsList(); }
async function onRefPick(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await fileToResizedDataUrl(file, 700);
    modalRefs.push({ id:'ref-'+Date.now(), image:dataUrl, caption:'' });
    renderRefsList();
    e.target.value = '';
  }catch(err){ showToast('Could not read that image'); }
}

function requestLocation(){
  if(!navigator.geolocation){
    prayerStatus='error'; prayerErrorMsg="This browser doesn't support location access.";
    renderApp(); return;
  }
  prayerStatus='loading'; renderApp();
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      userLocation = { lat, lon, city:'Current location', country:'' };
      reverseGeocode(lat, lon);

      if(err.code===1) prayerErrorMsg='Location permission denied. Allow location access, or search for your city below.';
      else if(err.code===2) prayerErrorMsg='Location unavailable right now. Try searching for your city below.';
      else prayerErrorMsg='Location request timed out. Try searching for your city below.';
      renderApp();
    },
    { enableHighAccuracy:false, timeout:9000 }
  );

async function reverseGeocode(lat, lon){

    if(userLocation){

function tuneTime(str, add){
  const n = parseInt(add, 10) || 0;
  if(!n) return str;
  let m = parseTimeToMinutes(str) + n;
  m = ((m % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
}
function changeTune(k, v){
  let n = parseInt(v, 10); if(isNaN(n)) n = 0;
  prayerTune[k] = Math.max(-30, Math.min(30, n));
  persistLocation(); renderApp();
}
function getPrayerList(){

      { name:'Asr', time:tuneTime(t.Asr, prayerTune.Asr) },
      { name:'Maghrib', time:tuneTime(t.Maghrib, prayerTune.Maghrib) },
      { name:'Isha', time:tuneTime(t.Isha, prayerTune.Isha) },
    ];
  }
  return DATA.prayerTimes.map(p=>({ name:p.name, time:p.time }));
}
function parseTimeToMinutes(str){
  str = String(str).split(' ')[0];
  const ampmMatch = String(str).match(/(AM|PM)/i);
  let parts = str.replace(/\s?(AM|PM)/i,'').split(':').map(Number);
  let h = parts[0] || 0, m = parts[1] || 0;
  if(ampmMatch){
    const ap = ampmMatch[0].toUpperCase();
    if(ap==='PM' && h!==12) h+=12;
    if(ap==='AM' && h===12) h=0;
  }
  return h*60+m;
}
function computeCurrentAndNext(){
  const list = getPrayerList();
  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes();
  const nowSec = now.getSeconds();
  let currentIdx = -1;
  for(let i=0;i<list.length;i++){
    if(parseTimeToMinutes(list[i].time) <= nowMin) currentIdx = i;
  }
  const nextIdx = (currentIdx+1) % list.length;
  const nextMin = parseTimeToMinutes(list[nextIdx].time);
  let diffMin = nextMin - nowMin; if(diffMin<=0) diffMin += 24*60;
  let totalSec = diffMin*60 - nowSec;
  if(totalSec<0) totalSec = 0;
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  const remainingClock = h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
  return { list, currentIdx, nextIdx, remaining: `${Math.floor(diffMin/60)}h ${diffMin%60}m`, remainingClock, totalSec };
}
function computeCountdownTo(idx, list){
  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes();
  const nowSec = now.getSeconds();
  const targetMin = parseTimeToMinutes(list[idx].time);
  let diffMin = targetMin - nowMin; if(diffMin<=0) diffMin += 24*60;
  let totalSec = diffMin*60 - nowSec;
  if(totalSec<0) totalSec = 0;
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  const remainingClock = h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
  return { remainingClock, totalSec };
}

function bgGradientForMinute(min){
  if(min < 4*60 || min >= 19*60+30) return 'linear-gradient(180deg, #05070C 0%, #0B1220 45%, #17202E 100%)';
  if(min < 5*60+45) return 'linear-gradient(180deg, #0B1220 0%, #22314A 45%, #4B4457 100%)';
  if(min < 7*60) return 'linear-gradient(180deg, #1B2A4A 0%, #3A4E72 40%, #C98A5B 100%)';
  if(min < 16*60) return 'linear-gradient(180deg, #3E6FA8 0%, #5F8FC2 50%, #BFD6E8 100%)';
  if(min < 18*60+30) return 'linear-gradient(180deg, #2B3E63 0%, #6B5B6E 55%, #B9865F 100%)';
  return 'linear-gradient(180deg, #14203A 0%, #2B3350 50%, #4B3F52 100%)';
}
function angleForMinutes(min, radius){
  const cx=140, cy=140;
  const angleDeg = ((min - 720) / 1440) * 360;
  const rad = angleDeg * Math.PI/180;
  return { x: cx + radius*Math.sin(rad), y: cy - radius*Math.cos(rad) };
}
let prayerSparkles = null;
function getPrayerSparkles(){
  if(prayerSparkles) return prayerSparkles;
  const dots = [];
  for(let i=0;i<70;i++){
    const ang = Math.random()*Math.PI*2;
    const r = 8 + Math.random()*100;
    dots.push({ x: 140+r*Math.cos(ang), y: 140+r*Math.sin(ang), rad: 0.5+Math.random()*1.4, op: 0.12+Math.random()*0.5 });
  }
  prayerSparkles = dots;
  return dots;
}

function prayerScrubberHtml(pc){

  for(let i=0;i<totalBars;i++){
    bars += `<div style="width:2.5px;height:${i%4===0?16:10}px;border-radius:2px;background:${i<=filledUpTo?'#E4C583':'rgba(255,255,255,0.18)'};flex-shrink:0;"></div>`;

function startPrayerScrub(e){
  prayerScrubDragging = true;
  updatePrayerScrubFromEvent(e);
  const move = (ev)=>{ if(prayerScrubDragging) updatePrayerScrubFromEvent(ev); };
  const up = ()=>{
    prayerScrubDragging = false;
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    prayerScrubIdx = null;
    if(appScreen.name==='prayer') renderApp();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}
function updatePrayerScrubFromEvent(e){
  const el = document.getElementById('prayer-scrubber');
  if(!el) return;
  const rect = el.getBoundingClientRect();
  const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  const frac = Math.min(1, Math.max(0, (clientX - rect.left)/rect.width));
  const min = frac*1440;
  const pc = computeCurrentAndNext();
  let bestIdx = 0, bestDiff = Infinity;
  pc.list.forEach((p,i)=>{
    const pm = parseTimeToMinutes(p.time);
    const d = Math.min(Math.abs(pm-min), 1440-Math.abs(pm-min));
    if(d<bestDiff){ bestDiff=d; bestIdx=i; }
  });
  if(prayerScrubIdx!==bestIdx){ prayerScrubIdx = bestIdx; renderApp(); }
}

      const now = new Date();

      }
    }
  }, 1000);
}

function fmt12(min){

  return { hm: String(hh).padStart(2,'0')+':'+String(m).padStart(2,'0'), ap };
}

function classicPeriod(pc){
  const list = pc.list;
  const now = new Date();
  const nowM = now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  let ci = pc.currentIdx; if(ci<0) ci = list.length-1;
  const ni = (ci+1)%list.length;
  const s0 = parseTimeToMinutes(list[ci].time);
  let e0 = parseTimeToMinutes(list[ni].time);
  if(e0<=s0) e0 += 1440;
  let n = nowM; if(n<s0) n += 1440;
  const frac = Math.min(1, Math.max(0,(n-s0)/(e0-s0)));
  const leftSec = Math.max(0, Math.round((e0-n)*60));
  return { name:list[ci].name, frac, leftSec };
}
function fmtLeft(sec){

}
function classicRingInner(period){
  const N=72, cx=65, cy=65, r1=51, r2=62;
  const lit = Math.round(period.frac*N);
  let ticks = '';
  for(let i=0;i<N;i++){
    const a = i/N*2*Math.PI;
    const x1=(cx+r1*Math.sin(a)).toFixed(1), y1=(cy-r1*Math.cos(a)).toFixed(1);
    const x2=(cx+r2*Math.sin(a)).toFixed(1), y2=(cy-r2*Math.cos(a)).toFixed(1);
    ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${i<lit?'#FF6B5E':'rgba(255,255,255,0.82)'}" stroke-width="${i%6===0?2.6:1.6}" stroke-linecap="round"/>`;
  }
  const label = period.name==='Sunrise' ? 'Sun Rise' : period.name;
  return `<svg viewBox="0 0 130 130" style="position:absolute;inset:0;width:100%;height:100%;">${ticks}</svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22px;">

}

let adhanCtx = null;
function primeAdhanAudio(){
  try{
    adhanCtx = adhanCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(adhanCtx.state==='suspended') adhanCtx.resume();
  }catch(e){}
}
function playReminderChime(){
  if(!adhanCtx) return;
  try{
    [659,784,988].forEach((f,i)=>{
      const o = adhanCtx.createOscillator(), g = adhanCtx.createGain();
      const t0 = adhanCtx.currentTime + i*0.55;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.22,t0+0.06);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+1.2);
      o.connect(g); g.connect(adhanCtx.destination);
      o.start(t0); o.stop(t0+1.3);
    });
  }catch(e){}
}
function startPrayerAlertChecker(){
  setInterval(()=>{
    try{
      const pc = computeCurrentAndNext();
      const now = new Date();
      const nowM = now.getHours()*60+now.getMinutes();
      const day = now.toDateString();
      pc.list.forEach(p=>{
        if(!prayerAlerts[p.name]) return;
        const key = day+'-'+p.name;
        if(prayerFired[key]) return;
        if(parseTimeToMinutes(p.time)===nowM){
          prayerFired[key] = true;
          showToast('It is time for '+p.name);
          playReminderChime();
          try{ if('Notification' in window && Notification.permission==='granted') new Notification(p.name+' time', { body:'It is time for '+p.name+' prayer.' }); }catch(e){}
        }
      });
    }catch(e){}
  }, 10000);
}

/* ---- Qibla ---- */
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function computeQiblaBearing(lat,lon){
  const toRad=d=>d*Math.PI/180, toDeg=r=>r*180/Math.PI;
  const kLat=toRad(21.4225), kLon=toRad(39.8262);
  const lat1=toRad(lat), lon1=toRad(lon);
  const dLon=kLon-lon1;
  const y=Math.sin(dLon)*Math.cos(kLat);
  const x=Math.cos(lat1)*Math.sin(kLat)-Math.sin(lat1)*Math.cos(kLat)*Math.cos(dLon);
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function bearingTo(lat,lon,tLat,tLon){
  const toRad=d=>d*Math.PI/180, toDeg=r=>r*180/Math.PI;
  const a=toRad(tLat), l1=toRad(lat), dLon=toRad(tLon)-toRad(lon);
  const y=Math.sin(dLon)*Math.cos(a);
  const x=Math.cos(l1)*Math.sin(a)-Math.sin(l1)*Math.cos(a)*Math.cos(dLon);
  return (toDeg(Math.atan2(y,x))+360)%360;
}

function qiblaHeadingFromEvent(e){
  if(e.webkitCompassHeading!==undefined && e.webkitCompassHeading!==null && !isNaN(e.webkitCompassHeading)) return e.webkitCompassHeading;
  if(e.alpha===null || e.alpha===undefined) return null;
  const r = Math.PI/180;
  const a=e.alpha*r, b=(e.beta||0)*r, g=(e.gamma||0)*r;
  const cA=Math.cos(a), sA=Math.sin(a), sB=Math.sin(b), cB=Math.cos(b), sG=Math.sin(g), cG=Math.cos(g);
  // Top edge of the phone (phone held flat, like a compass)
  const yE = -sA*cB, yN = cA*cB;
  // Back of the phone (phone held upright, like a camera)
  const zE = -(cA*sG + sA*sB*cG), zN = -(sA*sG - cA*sB*cG);
  const useTop = Math.hypot(yE,yN) >= Math.hypot(zE,zN);
  const h = (useTop ? Math.atan2(yE,yN) : Math.atan2(zE,zN)) * 180/Math.PI;
  const scr = (screen.orientation && typeof screen.orientation.angle==='number') ? screen.orientation.angle : 0;
  return ((h + (useTop ? scr : 0)) % 360 + 360) % 360;
}
// Same idea from a quaternion (AbsoluteOrientationSensor, Chrome on Android)
function qiblaHeadingFromQuat(q){
  const x=q[0], y=q[1], z=q[2], w=q[3];
  const m12 = 2*(x*y - z*w), m22 = 1-2*(x*x+z*z), m32 = 2*(y*z + x*w);
  const m13 = 2*(x*z + y*w), m23 = 2*(y*z - x*w);
  const useTop = Math.hypot(m12,m22) >= Math.hypot(m13,m23);
  const h = (useTop ? Math.atan2(m12,m22) : Math.atan2(-m13,-m23)) * 180/Math.PI;
  return (h%360+360)%360;
}
let qiblaSensor = null, qiblaSensorLive = false, qiblaGotData = false, qiblaAbsSeen = false;
let qiblaUseRel = false, qiblaLastPlain = null, qiblaWatchdog = null;
function setQiblaNote(msg){
  const el = document.getElementById('qibla-note');
  if(el) el.textContent = msg || '';
}
function qiblaFeed(h){
  if(h===null || h===undefined || isNaN(h)) return;
  qiblaGotData = true;
  if(qiblaSmooth===null) qiblaSmooth = h;
  else{
    const d = ((h - qiblaSmooth + 540) % 360) - 180;
    qiblaSmooth = (qiblaSmooth + d*0.3 + 360) % 360;
  }
  compassHeading = qiblaSmooth;
  if(!qiblaUseRel) setQiblaNote('');
  applyQibla();
}
async function qiblaStartSensor(){
  try{
    if(!('AbsoluteOrientationSensor' in window)) return;
    if(navigator.permissions && navigator.permissions.query){
      const res = await Promise.all(['accelerometer','gyroscope','magnetometer'].map(n=>navigator.permissions.query({name:n}).catch(()=>({state:'granted'}))));
      if(res.some(r=>r.state==='denied')) return;
    }
    if(!compassActive) return;
    const sn = new AbsoluteOrientationSensor({ frequency:30, referenceFrame:'screen' });
    sn.addEventListener('reading', ()=>{
      if(!sn.quaternion || !compassActive) return;
      qiblaSensorLive = true; qiblaAbsSeen = true;
      qiblaFeed(qiblaHeadingFromQuat(sn.quaternion));
    });
    sn.addEventListener('error', ()=>{ qiblaSensorLive = false; try{ sn.stop(); }catch(_){} if(qiblaSensor===sn) qiblaSensor = null; });
    sn.start();
    qiblaSensor = sn;
  }catch(e){ /* fall back to deviceorientation events */ }
}
function onDeviceOrientation(e){
  if(qiblaSensorLive) return;   // the sensor API is already feeding us
  if(e.type==='deviceorientationabsolute'){
    if(e.alpha===null || e.alpha===undefined) return;
    qiblaAbsSeen = true;
    qiblaFeed(qiblaHeadingFromEvent(e));
    return;
  }
  // plain deviceorientation: iOS gives webkitCompassHeading (true compass)
  if(e.webkitCompassHeading!==undefined && e.webkitCompassHeading!==null && !isNaN(e.webkitCompassHeading)){ qiblaFeed(e.webkitCompassHeading); return; }
  qiblaLastPlain = e;
  if(qiblaAbsSeen) return;
  if(e.absolute===true && e.alpha!==null && e.alpha!==undefined){ qiblaFeed(qiblaHeadingFromEvent(e)); return; }
  if(qiblaUseRel && e.alpha!==null && e.alpha!==undefined) qiblaFeed(qiblaHeadingFromEvent(e));
}
function qiblaCheckData(){
  if(!compassActive || qiblaGotData) return;
  if(qiblaLastPlain && qiblaLastPlain.alpha!==null && qiblaLastPlain.alpha!==undefined){
    qiblaUseRel = true;
    setQiblaNote('Approximate mode: this browser does not report true north. If the arrow looks wrong, open the app in Chrome (Android) or Safari (iPhone).');
    qiblaFeed(qiblaHeadingFromEvent(qiblaLastPlain));
    return;
  }
  let msg = 'No compass data is coming from this device.';
  if(!window.isSecureContext) msg += ' The browser blocks motion sensors on non-HTTPS pages.';
  else if(window.top!==window.self) msg += ' Sensors are blocked inside previews/embedded frames — open the downloaded file directly in Chrome or Safari on your phone.';
  else msg += ' Open it on a phone (laptops have no compass), allow Motion & Orientation access in the browser settings, and keep away from magnets.';
  setQiblaNote(msg);
}
function qiblaStartListening(){
  qiblaGotData = false; qiblaAbsSeen = false; qiblaUseRel = false; qiblaLastPlain = null; qiblaSensorLive = false;
  window.addEventListener('deviceorientationabsolute', onDeviceOrientation, true);
  window.addEventListener('deviceorientation', onDeviceOrientation, true);
  qiblaStartSensor();
  clearTimeout(qiblaWatchdog);
  qiblaWatchdog = setTimeout(qiblaCheckData, 2800);
}
function qiblaStopListening(){
  window.removeEventListener('deviceorientationabsolute', onDeviceOrientation, true);
  window.removeEventListener('deviceorientation', onDeviceOrientation, true);
  clearTimeout(qiblaWatchdog);
  if(qiblaSensor){ try{ qiblaSensor.stop(); }catch(_){} qiblaSensor = null; }
  qiblaSensorLive = false;
}
function stopCompass(){ compassActive=false; qiblaSmooth=null; qiblaStopListening(); }
function toggleCompass(){
  if(compassActive){ stopCompass(); renderApp(); return; }
  const begin = ()=>{ compassActive=true; qiblaSmooth=null; qiblaStartListening(); renderApp(); };
  if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(state=>{
      if(state==='granted') begin(); else showToast('Compass permission denied — allow Motion & Orientation for this site');
    }).catch(()=>showToast('Compass not available'));
  }else if(window.DeviceOrientationEvent || 'AbsoluteOrientationSensor' in window){
    begin();
  }else{
    showToast('Live compass not supported on this device');
  }
}
function applyQibla(){
  const dial = document.getElementById('qibla-dial');
  if(!dial) return;
  if(!compassActive || qiblaSmooth===null) return;
  const target = -qiblaSmooth;
  const dd = ((target - qiblaDisp) % 360 + 540) % 360 - 180;
  qiblaDisp += dd;
  dial.style.transform = `rotate(${qiblaDisp}deg)`;

  const diff = Math.abs(((qiblaSmooth - qiblaBearing + 540) % 360) - 180);   // 0 = facing the Kaaba
  const ok = diff <= QIBLA_TOLERANCE;
  const GREEN = '#1FA35B';
  const pointer = document.getElementById('qibla-pointer');
  const needle = document.getElementById('qibla-needle');
  const wrap = document.getElementById('qibla-wrap');
  const status = document.getElementById('qibla-status');
  const sub = document.getElementById('qibla-sub');
  if(pointer) pointer.style.borderTopColor = ok ? GREEN : '';
  if(needle) needle.style.background = ok ? GREEN : '';
  dial.style.borderColor = ok ? GREEN : '';
  dial.classList.toggle('qibla-ok', ok);
  if(wrap) wrap.style.background = ok ? 'rgba(31,163,91,0.10)' : '';
  if(status){ status.textContent = ok ? '✓ You are facing ' + qiblaTargetName() : Math.round(qiblaBearing)+'° from North'; status.style.color = ok ? GREEN : ''; }
  if(sub){
    if(ok) sub.textContent = (qiblaTarget===0 ? 'Kaaba' : qiblaTargetName()) + ' is straight ahead';
    else{
      const signed = ((qiblaBearing - qiblaSmooth + 540) % 360) - 180;
      sub.textContent = 'Turn ' + Math.round(Math.abs(signed)) + '° ' + (signed>0 ? 'right' : 'left');
    }
  }
  if(ok && !qiblaAligned){ try{ if(navigator.vibrate) navigator.vibrate(80); }catch(_){} }
  qiblaAligned = ok;
}

function updateZakat(){

  const cash = num(zakatForm.cash), goldGrams = num(zakatForm.goldGrams), goldPrice = num(zakatForm.goldPrice);
  const silverGrams = num(zakatForm.silverGrams), silverPrice = num(zakatForm.silverPrice);
  const other = num(zakatForm.other), liabilities = num(zakatForm.liabilities);

  const gold = goldGrams*goldPrice, silver = silverGrams*silverPrice;
  const assets = cash + gold + silver + other;
  const net = assets - liabilities;
  const hasInput = !!(cash||goldGrams||silverGrams||other||liabilities||goldPrice||silverPrice);
  const goldMissing = goldGrams>0 && !(goldPrice>0);
  const silverMissing = silverGrams>0 && !(silverPrice>0);
  // Nisab: silver (612.36 g) when a silver price is given, otherwise gold (87.48 g)
  const nisab = silverPrice>0 ? silverPrice*612.36 : (goldPrice>0 ? goldPrice*87.48 : null);
  const fmt = n => n.toLocaleString(langLocale(), { maximumFractionDigits:0 });

  const amountEl = document.getElementById('zakat-center-amount');
  const labelEl = document.getElementById('zakat-center-label');
  const noteEl = document.getElementById('zakat-status-note');
  const warnEl = document.getElementById('zakat-warn');
  const bdEl = document.getElementById('zakat-breakdown');
  const ring = document.getElementById('zakat-ring');
  if(!amountEl) return;
  const circumference = 2*Math.PI*110;
  const setRing = frac => { if(ring) ring.setAttribute('stroke-dashoffset', circumference*(1-Math.max(0,Math.min(1,frac)))); };

  // warning when a gram amount has no price
  const warns = [];
  if(goldMissing) warns.push(tf("You entered gold grams but no gold price per gram, so the gold could not be valued. Enter today's price per gram."));
  if(silverMissing) warns.push(tf("You entered silver grams but no silver price per gram, so the silver could not be valued. Enter today's price per gram."));
  if(warnEl){ warnEl.style.display = warns.length ? 'block' : 'none'; warnEl.innerHTML = warns.map(w=>escapeHtml(w)).join('<br>'); }

  let zakatAmt = 0;
  if(!hasInput){
    countTo(amountEl, 0);
    labelEl.textContent = tf('ENTER YOUR ASSETS'); noteEl.textContent = ''; setRing(0);
  }else if(net<=0){
    countTo(amountEl, 0);
    if(goldMissing || silverMissing){
      labelEl.textContent = tf(goldMissing ? 'ENTER GOLD PRICE' : 'ENTER SILVER PRICE'); noteEl.textContent = '';
    }else{
      labelEl.textContent = tf('NO ZAKAT DUE');
      noteEl.textContent = tf('Your debts are equal to or more than your assets, so no zakat is due.');
    }
    setRing(0);
  }else if(nisab===null){
    zakatAmt = net*0.025;
    countTo(amountEl, zakatAmt);
    labelEl.textContent = tf('ZAKAT (2.5%)');
    noteEl.textContent = tf('Showing 2.5% of your net wealth ({a}). Enter a silver price per gram to also check the nisab threshold.', { a:fmt(net) });
    setRing(1);
  }else if(net>=nisab){
    zakatAmt = net*0.025;
    countTo(amountEl, zakatAmt);
    labelEl.textContent = tf('ZAKAT DUE');
    noteEl.textContent = tf('Net wealth {a} is above nisab ({b}) — 2.5% is due as zakat.', { a:fmt(net), b:fmt(nisab) });
    setRing(1);
  }else{
    countTo(amountEl, 0);
    labelEl.textContent = tf('BELOW NISAB');
    noteEl.textContent = tf('Net wealth {a} is below nisab ({b}) — no zakat is due this year.', { a:fmt(net), b:fmt(nisab) });
    setRing(net/nisab);
  }

  // breakdown table
  if(bdEl){
    const row = (label, val, strong) => `<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.08);font-size:12.5px;${strong?'font-weight:800;color:#E4C583;':'color:rgba(255,255,255,0.85);'}"><span>${label}</span><span dir="ltr">${val}</span></div>`;
    if(!hasInput || (!assets && !liabilities)){ bdEl.style.display = 'none'; bdEl.innerHTML = ''; }
    else{
      let h = '';
      if(cash) h += row('Cash & bank savings', fmt(cash));
      if(gold) h += row('Gold value', fmt(gold));
      if(silver) h += row('Silver value', fmt(silver));
      if(other) h += row('Other zakatable assets', fmt(other));
      h += row('Total assets', fmt(assets));
      if(liabilities) h += row('Debts', '− '+fmt(liabilities));
      h += row('Net wealth', fmt(Math.max(0,net)));
      if(nisab!==null) h += row('Nisab', fmt(nisab));
      h += row('Zakat due', fmt(zakatAmt), true);
      bdEl.innerHTML = h.replace(/border-bottom:1px solid rgba\(255,255,255,0\.08\);font-size:12\.5px;font-weight:800;color:#E4C583;/, 'font-size:13.5px;font-weight:800;color:#E4C583;');
      bdEl.style.display = 'block';
    }
  }
}

const RAMADAN_NEXT = new Date(2027, 1, 8);   // fallback only — the real date is worked out from the Hijri calendar
const LUNAR_YEAR = 354.367, LUNAR_MONTH = 29.53;
const HIJRI_MONTHS = ['Muharram','Safar',"Rabi' al-Awwal","Rabi' al-Thani",'Jumada al-Awwal','Jumada al-Thani','Rajab',"Sha'ban",'Ramadan','Shawwal',"Dhul Qa'dah",'Dhul Hijjah'];
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  roza:{ mode:'dates', gender:'male', dob:'', bulughAge:'12', startDate:todayISO(), ramLen:'30', partialYears:'0', partialMissed:'0', done:'0', manualTotal:'0',

         fidyaMode:'direct', wheatPrice:'', wheatKg:'1.633', fidyaDays:'', fidyaRate:'', fidyaPaid:'', kaffaraDays:'' }
};

function qzParseDate(v){ if(!v) return null; const d = new Date(v+'T00:00:00'); return isNaN(d.getTime()) ? null : d; }
function qzFmtDate(d){ return d.toLocaleDateString(langLocale(),{ day:'numeric', month:'short', year:'numeric' }); }
function qzNum(x){ return String(Math.round(x*10)/10); }
function qzFmtN(n){ return Math.round(n).toLocaleString(); }
function qzDuration(days){
  if(days<=0) return tf('today');
  if(days<60) return days+' '+(days===1?tf('day'):tf('days'));
  const m = days/30.44;
  if(m<24) return Math.round(m)+' '+tf('months');
  return (days/365.25).toFixed(1)+' '+tf('years');
}
function qzEta(units, perDay){
  if(!(units>0)) return { days:0, text:'Completed' };
  if(!(perDay>0)) return null;
  const days = Math.ceil(units/perDay);
  const d = new Date(); d.setDate(d.getDate()+days);
  return { days, date:d, text: qzDuration(days)+' · '+qzFmtDate(d) };
}
function qzItems(kind){ return kind==='namaz' ? QAZA_PRAYERS : [{ id:'roza', name:'Roza (fasts)', rakat:0 }]; }
function qzTargetNeed(total, iso){
  const t = qzParseDate(iso); if(!t) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const days = Math.ceil((t - now)/86400000);
  if(days<=0) return { past:true };
  return { days, perDay: total/days, perWeek: total/days*7 };
}

/* ---------- Hijri calendar helpers (fasting days + next Ramadan) ---------- */
let _qzHijriFmt = null;
function qzHijri(d){
  try{
    if(!_qzHijriFmt) _qzHijriFmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{ day:'numeric', month:'numeric', year:'numeric' });
    const o = {}; _qzHijriFmt.formatToParts(d).forEach(p=>{ o[p.type]=p.value; });
    const day = parseInt(o.day,10), month = parseInt(o.month,10), year = parseInt(o.year||o.relatedYear,10);
    if(!(day>0 && month>0 && month<13)) return null;
    return { d:day, m:month, y:year };
  }catch(e){ return null; }
}
let _qzRam = null;
function qzNextRamadan(){
  const key = todayISO();
  if(_qzRam && _qzRam.key===key) return _qzRam.date;
  let res = RAMADAN_NEXT;
  const t0 = new Date(); t0.setHours(0,0,0,0);
  if(qzHijri(t0)){
    for(let i=1;i<=400;i++){
      const d = new Date(t0); d.setDate(d.getDate()+i);
      const h = qzHijri(d);
      if(h && h.m===9 && h.d===1){ res = d; break; }
    }
  }
  _qzRam = { key, date:res };
  return res;
}
function qzInRamadan(){ const t=new Date(); const h=qzHijri(t); return !!(h && h.m===9); }
function qzHijriText(h){ return h ? (h.d+' '+HIJRI_MONTHS[h.m-1]+' '+h.y+' AH') : ''; }
function qzDayInfo(d){
  const h = qzHijri(d), dow = d.getDay(), tags = [];
  let forbidden = false, ramadan = false;
  if(h){
    if(h.m===9) ramadan = true;
    if(h.m===10 && h.d===1){ forbidden = true; tags.push('Eid-ul-Fitr'); }
    if(h.m===12 && h.d===10){ forbidden = true; tags.push('Eid-ul-Adha'); }
    if(h.m===12 && h.d>=11 && h.d<=13){ forbidden = true; tags.push('Tashreeq'); }
    if(!forbidden && !ramadan){
      if(h.d>=13 && h.d<=15) tags.push('White day');
      if(h.m===1 && (h.d===9 || h.d===10)) tags.push('Ashura');
      if(h.m===12 && h.d===9) tags.push('Arafah');
    }
  }
  if(!forbidden && !ramadan){
    if(dow===1) tags.push('Monday');
    if(dow===4) tags.push('Thursday');
  }
  return { h, tags, forbidden, ramadan };
}

/* ---------- Calculations ---------- */
function qzBulughGap(f){
  const dob = qzParseDate(f.dob), start = qzParseDate(f.startDate), age = parseFloat(f.bulughAge);
  if(!dob) return { ok:false, msg:'Enter your date of birth to calculate.' };
  if(!start) return { ok:false, msg:'Enter the date you started praying / fasting regularly.' };
  if(!(age>0)) return { ok:false, msg:'Enter the age when you became baligh (puberty).' };
  const bulugh = new Date(dob.getTime() + age*LUNAR_YEAR*86400000);
  const gross = Math.floor((start - bulugh)/86400000);
  return { ok:true, bulugh, start, gross };
}
function qzAgeNote(f){
  const a = parseFloat(f.bulughAge); if(!(a>0)) return '';
  const min = f.gender==='female' ? 9 : 12;
  if(a<min) return tf('Puberty is not usually recognised before {n} lunar years of age — please double-check this age.',{ n:min });
  if(a>15) return 'Most scholars consider a person baligh by 15 lunar years at the latest — you may want to use a lower age.';
  return '';
}
function qzNamazCalc(){
  const f = qazaForm.namaz, withWitr = f.witr!=='no';
  const counts = {}; let gross = 0, deduct = 0, days = 0, bulugh = null, irrDays = 0;
  if(f.mode==='manual'){
    QAZA_PRAYERS.forEach(p=>{ counts[p.id] = (p.id==='witr' && !withWitr) ? 0 : Math.max(0, Math.floor(parseFloat(f.manual[p.id])||0)); });
    days = Math.max.apply(null, Object.keys(counts).map(k=>counts[k]));
  }else{
    const g = qzBulughGap(f);
    if(!g.ok) return g;
    gross = Math.max(0, g.gross); bulugh = g.bulugh;
    const menses = Math.min(29, Math.max(0, parseFloat(f.menses)||0));
    if(f.gender==='female' && gross>0){
      deduct = Math.round(gross/LUNAR_MONTH*menses) + Math.floor(parseFloat(f.nifas)||0);
      deduct = Math.min(deduct, gross);
    }
    const base = Math.max(0, gross - deduct);
    irrDays = Math.round(Math.max(0, parseFloat(f.irrYears)||0) * LUNAR_YEAR * Math.min(100, Math.max(0, parseFloat(f.irrPct)||0)) / 100);
    if(f.gender==='female') irrDays = Math.round(irrDays * (1 - menses/LUNAR_MONTH));
    const done = Math.max(0, Math.floor(parseFloat(f.done)||0));
    const sel = (f.irrPrayers||'').split(',');
    QAZA_PRAYERS.forEach(p=>{
      const inIrr = sel.indexOf(p.id)>-1 || (p.id==='witr' && sel.indexOf('isha')>-1);
      counts[p.id] = (p.id==='witr' && !withWitr) ? 0 : Math.max(0, base + (inIrr?irrDays:0) - done);
    });
    days = Math.max.apply(null, Object.keys(counts).map(k=>counts[k]));
  }
  let total = 0, rakat = 0;
  QAZA_PRAYERS.forEach(p=>{ total += counts[p.id]; rakat += counts[p.id]*p.rakat; });
  return { ok:true, counts, total, rakat, days, gross, deduct, bulugh, irrDays };
}
function qzRamadansSince(f){
  const s = qzParseDate(f.startDate); if(!s) return 0;
  return Math.max(0, Math.floor((new Date() - s)/86400000/LUNAR_YEAR));
}
function qzRozaCalc(){
  const f = qazaForm.roza;
  if(f.mode==='manual'){
    const t = Math.max(0, Math.floor(parseFloat(f.manualTotal)||0));
    return { ok:true, total:t, counts:{ roza:t }, ramadans:0, full:0, partial:0, mensesQ:0, pregQ:0, done:0 };
  }
  const g = qzBulughGap(f);
  if(!g.ok) return g;
  const ramadans = g.gross>0 ? Math.floor(g.gross/LUNAR_YEAR) : 0;
  const len = parseInt(f.ramLen,10)===29 ? 29 : 30;
  const full = ramadans*len;
  const pYears = Math.max(0, Math.floor(parseFloat(f.partialYears)||0));
  const pMiss = Math.min(30, Math.max(0, parseFloat(f.partialMissed)||0));
  const partial = Math.round(pYears*pMiss);
  const fem = f.gender==='female';
  const since = qzRamadansSince(f);
  const mensesQ = fem ? Math.round(since * Math.min(15, Math.max(0, parseFloat(f.menses)||0))) : 0;
  const pregQ = fem ? Math.round(Math.max(0, Math.floor(parseFloat(f.pregRamadans)||0)) * Math.min(len, Math.max(0, parseFloat(f.pregDays)||0))) : 0;
  const done = Math.max(0, Math.floor(parseFloat(f.done)||0));
  const total = Math.max(0, full + partial + mensesQ + pregQ - done);
  return { ok:true, total, counts:{ roza:total }, ramadans, full, partial, mensesQ, pregQ, done, bulugh:g.bulugh, since };
}

/* ---------- Copy / share / backup ---------- */
function qzCopyFallback(txt, done){
  try{
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
  }catch(e){ prompt(trStr('Copy this text:'), txt); }
}
function qzCopy(txt, msg){
  const done = ()=>showToast(msg);
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, ()=>qzCopyFallback(txt, done)); return; }
  }catch(e){}
  qzCopyFallback(txt, done);
}
function qzPct(d){
  let t = 0, r = 0;
  Object.keys(d.total).forEach(k=>{ t += d.total[k]||0; r += d.remaining[k]||0; });
  return t ? (t-r)/t*100 : 0;
}
function qzSummaryText(kind, progress){
  const L = [];
  if(progress){
    const d = qazaData[kind]; if(!d) return '';
    let tot = 0, rem = 0; Object.keys(d.total).forEach(k=>{ tot += d.total[k]||0; rem += d.remaining[k]||0; });
    L.push((kind==='namaz'?'Qaza Namaz':'Qaza Roza')+' progress — Deen Companion');
    L.push((tot-rem)+' of '+tot+' completed ('+Math.round(qzPct(d))+'%), '+rem+' left');
    L.push('Streak: '+qzStreak(d)+' day(s) · best '+qzBestStreak(d));
    return L.join('\n');
  }
  const r = kind==='namaz' ? qzNamazCalc() : qzRozaCalc();
  if(!r || !r.ok || !(r.total>0)) return '';
  if(kind==='namaz'){
    L.push('Qaza Namaz estimate — Deen Companion');
    L.push(r.total+' prayers · '+r.days+' days · '+r.rakat+' rakat');
    QAZA_PRAYERS.forEach(p=>{ if(r.counts[p.id]>0) L.push(p.name+': '+r.counts[p.id]); });
  }else{
    L.push('Qaza Roza estimate — Deen Companion');
    L.push(r.total+' fasts');
  }
  return L.join('\n');
}
function qzShare(kind, progress){
  const txt = qzSummaryText(kind, progress);
  if(!txt){ showToast('Nothing to share yet'); return; }
  if(navigator.share){ navigator.share({ text:txt }).catch(()=>{}); return; }
  qzCopy(txt, 'Summary copied');
}
function qzBackup(){
  qzCopy(JSON.stringify({ app:'deen-qaza', v:1, data:qazaData, form:qazaForm }), 'Backup copied — paste it somewhere safe');
}
function qzCleanData(x){
  if(!x || typeof x!=='object') return null;
  const iso = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s));
  const o = { total:{}, remaining:{}, log:{}, goal:String(parseFloat(x.goal)||1), freq:String(parseFloat(x.freq)||2), started:iso(x.started)?x.started:todayISO() };
  Object.keys(x.total||{}).forEach(k=>{
    if(!/^[a-z]+$/.test(k)) return;
    o.total[k] = Math.max(0, Math.floor(+x.total[k]||0));
    o.remaining[k] = Math.max(0, Math.min(o.total[k], Math.floor(+(x.remaining||{})[k]||0)));
  });
  Object.keys(x.log||{}).forEach(k=>{ if(iso(k)){ const v = Math.floor(+x.log[k]||0); if(v>0) o.log[k] = v; } });
  return o;
}
function qzRestore(){
  const v = prompt(trStr('Paste your backup text here:'));
  if(!v) return;
  try{
    const o = JSON.parse(v);
    if(!o || o.app!=='deen-qaza' || !o.data) throw new Error('bad');
    if(!confirm('Restore this backup? It will replace your current qaza trackers.')) return;
    qazaData = { namaz:qzCleanData(o.data.namaz), roza:qzCleanData(o.data.roza) };
    const src = o.form || {};
    ['namaz','roza'].forEach(k=>{
      const s = src[k] || {};
      Object.keys(qazaForm[k]).forEach(key=>{
        if(key==='manual'){
          const m = {}; Object.keys(s.manual||{}).forEach(id=>{ if(/^[a-z]+$/.test(id)) m[id] = String(parseFloat(s.manual[id])||0); });
          qazaForm[k].manual = m;
        }else if(typeof s[key]==='string' || typeof s[key]==='number'){ qazaForm[k][key] = String(s[key]); }
      });
    });
    qazaTab = { namaz:null, roza:null };
    persistQaza(); renderApp(); showToast('Backup restored');
  }catch(e){ showToast("That doesn't look like a valid backup"); }
}

function qzUpdate(kind){
  const el = document.getElementById('qz-'+kind+'-result');
  if(!el) return;
  el.innerHTML = kind==='namaz' ? qzNamazResultHtml() : qzRozaResultHtml();
  const big = el.querySelector('[data-count]');
  if(big) countTo(big, parseFloat(big.getAttribute('data-count')));
}
function qzStartBtn(kind, r){
  if(!r.total) return '';

  <button class="btn-primary" style="width:100%;justify-content:center;margin-top:8px;padding:13px;" onclick="qzStartPlan('${kind}')">${icon('check',15,'#fff')} ${qazaData[kind]?'Replace tracker with this plan':'Start tracking this plan'}</button>`;
}
function qzNamazResultHtml(){

  const goal = parseFloat(f.goal)||1;
  const eta = qzEta(r.days, goal);
  const hrs = Math.round(r.days*35/60);
  const need = qzTargetNeed(r.days, f.targetDate);
  let needLine = '';

    <div class="qz-big" data-count="${r.total}">0</div><div class="qz-biglbl">QAZA PRAYERS</div>

}
function qzRozaResultHtml(){
  const r = qzRozaCalc(), f = qazaForm.roza;
  if(!r.ok) return `<div class="qz-hint">${r.msg}</div>`;
  if(r.total<=0) return `<div class="qz-hero"><div class="qz-big">0</div><div class="qz-biglbl">NO QAZA DUE</div><div class="qz-sub" style="margin-top:8px;">Nothing left to make up — Alhamdulillah.</div></div>`;
  const nextRam = qzNextRamadan();
  const weeksLeft = (nextRam - new Date())/(7*86400000);
  const need = weeksLeft>0 ? Math.ceil(r.total/weeksLeft) : null;
  const plans = [[1,'1 fast / week'],[2,'2 fasts / week (Mon & Thu)'],[3,'3 fasts / week'],[7,'Every day (where allowed)']];
  const tn = qzTargetNeed(r.total, f.targetDate);
  let tLine = '';
  if(tn && tn.past) tLine = `<div class="qz-sub" style="margin-top:4px;">Pick a date in the future to see your weekly target.</div>`;
  else if(tn){
    const pw = Math.ceil(tn.perWeek);
    tLine = `<div class="qz-sub" style="margin-top:4px;">${tf('To finish by {date} you need about {n} fasts per week.',{ date:`<b style="color:#E4C583;">${qzFmtDate(qzParseDate(f.targetDate))}</b>`, n:pw })}${pw>7 ? ' '+tf('That is more than one fast a day — choose a later date.') : ''}</div>`;
  }
  const rows = [];
  if(f.mode!=='manual'){
    if(r.full) rows.push([tf('{n} full Ramadan(s) before you began fasting',{ n:r.ramadans }), r.full]);
    if(r.partial) rows.push(['Partly-missed Ramadans', r.partial]);
    if(r.mensesQ) rows.push([tf('Menstruation ({n} Ramadans)',{ n:r.since }), r.mensesQ]);
    if(r.pregQ) rows.push(['Pregnancy / nursing', r.pregQ]);
    if(r.done) rows.push(['Already made up', -r.done]);
  }
  const ageNote = f.mode!=='manual' ? qzAgeNote(f) : '';
  return `
  <div class="qz-hero">
    <div class="qz-big" data-count="${r.total}">0</div><div class="qz-biglbl">QAZA FASTS</div>
    ${r.ramadans||r.partial||r.mensesQ||r.pregQ ? `<div class="qz-sub" style="margin-top:10px;">${tf('{n} full Ramadan(s) ({full}) + {partial} partly-missed{done}',{ n:r.ramadans, full:r.full, partial:r.partial+r.mensesQ+r.pregQ, done: r.done ? tf(' − {d} made up',{d:r.done}) : '' })}</div>` : ''}
    ${tLine}
  </div>
  ${rows.length>1 ? `<div class="qz-card"><h3>Breakdown</h3>${rows.map(x=>`<div class="qz-li"><span>${x[0]}</span><b>${x[1]<0?'−':''}${Math.abs(x[1]).toLocaleString()}</b></div>`).join('')}</div>` : ''}
  <div class="qz-card"><h3>How long will it take?</h3>
    ${plans.map(p=>{ const e = qzEta(r.total, p[0]/7); return `<div class="qz-li"><span>${p[1]}</span><b>${e?e.text.split(' · ')[0]:''}</b></div>`; }).join('')}
    ${need ? `<div class="qz-note" style="margin-top:8px;">${tf('To finish before the next Ramadan (about {date}), you would need roughly {n} per week.',{ date:qzFmtDate(nextRam), n:`<b>${need} ${tf('fast(s)')}</b>` })}</div>` : ''}
    <div class="qz-note">Do not fast on Eid days or the 3 days after Eid-ul-Adha (Tashreeq).</div>
  </div>
  ${ageNote ? `<div class="qz-note" style="color:var(--ruby);">${ageNote}</div>` : ''}
  ${qzStartBtn('roza', r)}`;
}

/* ---------- Plan + tracker ---------- */
function qzStartPlan(kind){
  const r = kind==='namaz' ? qzNamazCalc() : qzRozaCalc();
  if(!r || !r.ok || !(r.total>0)){ showToast('Nothing to track yet'); return; }
  if(qazaData[kind] && !confirm('Replace your current tracker with this new calculation? Your logged progress will reset.')) return;
  const total = {}, remaining = {};
  Object.keys(r.counts).forEach(k=>{ total[k]=r.counts[k]; remaining[k]=r.counts[k]; });
  qazaData[kind] = { total, remaining, log:{}, goal:qazaForm.namaz.goal||'1', freq:'2', started:todayISO() };
  qazaTab[kind] = 'tracker'; persistQaza(); renderApp();
  showToast('Tracker started — may Allah make it easy');
}

function qzPlan(kind, key, val){
  const d = qazaData[kind]; if(!d) return;
  d[key] = val; persistQaza(); renderApp();
}
function qzLog(d, n, kind){
  const off = (kind && String(qazaForm[kind].logDay)==='1') ? 1 : 0;
  const k = qzDayKey(off);
  const v = Math.max(0, (d.log[k]||0)+n);
  if(v) d.log[k] = v; else delete d.log[k];
}
function qzDayKey(offset){
  const d = new Date(); d.setDate(d.getDate()-offset);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function qzStreak(d){
  let s = 0, i = (d.log[qzDayKey(0)]>0) ? 0 : 1;
  while(i<400 && d.log[qzDayKey(i)]>0){ s++; i++; }
  return s;
}
function qzBestStreak(d){
  const keys = Object.keys(d.log).filter(k=>d.log[k]>0).sort();
  let best = 0, cur = 0, prev = null;
  keys.forEach(k=>{
    const t = qzParseDate(k); if(!t) return;
    if(prev && Math.round((t-prev)/86400000)===1) cur++; else cur = 1;
    if(cur>best) best = cur;
    prev = t;
  });
  return best;
}
function qzMilestoneToast(before, after){
  const hit = [75,50,25,10].find(m=> after>=m && before<m);
  if(hit) showToast(tf('MashaAllah! {m}% of your qaza is done',{ m:hit }));
}
function qzMark(kind, id, delta){
  const d = qazaData[kind]; if(!d) return;
  const t = d.total[id]||0; let r = d.remaining[id]||0;
  const before = qzPct(d);
  if(delta<0){
    if(r<=0){ showToast('Already completed'); return; }
    r--; qzLog(d, 1, kind);
    try{ if(navigator.vibrate) navigator.vibrate(15); }catch(_){}
  }else{
    if(r>=t) return;
    r++; qzLog(d, -1, kind);
  }
  d.remaining[id] = r; persistQaza(); qzRefreshTracker(kind);
  if(delta<0 && r===0){
    const left = Object.keys(d.remaining).reduce((a,k)=>a+d.remaining[k],0);
    const nm = (qzItems(kind).find(x=>x.id===id)||{}).name || '';
    showToast(left===0 ? 'Alhamdulillah! All qaza completed' : 'MashaAllah! All '+nm+' qaza completed');
  }else if(delta<0){ qzMilestoneToast(before, qzPct(d)); }
}
function qzMarkDay(){
  const d = qazaData.namaz; if(!d) return;
  const before = qzPct(d);
  let n = 0;
  Object.keys(d.remaining).forEach(k=>{ if(d.remaining[k]>0){ d.remaining[k]--; n++; } });
  if(!n){ showToast('Already completed'); return; }
  qzLog(d, n, 'namaz'); persistQaza(); qzRefreshTracker('namaz');
  try{ if(navigator.vibrate) navigator.vibrate([15,30,15]); }catch(_){}
  const left = Object.keys(d.remaining).reduce((a,k)=>a+d.remaining[k],0);
  if(left===0) showToast('Alhamdulillah! All qaza completed');
  else{
    const after = qzPct(d);
    if([75,50,25,10].some(m=> after>=m && before<m)) qzMilestoneToast(before, after);
    else showToast('One day of qaza made up — '+n+' prayers');
  }
}
function qzAddMissed(kind, id){
  const d = qazaData[kind]; if(!d) return;
  d.total[id] = (d.total[id]||0) + 1;
  d.remaining[id] = (d.remaining[id]||0) + 1;
  persistQaza(); renderApp();
  showToast('Added one to your qaza');
}
function qzEdit(kind, id){
  const d = qazaData[kind]; if(!d) return;

  const v = prompt('How many '+(it?it.name:'')+' qaza are still left?', d.remaining[id]);
  if(v===null) return;

  if(isNaN(n) || n<0){ showToast('Enter a valid number'); return; }
  if(n>d.total[id]) d.total[id] = n;

}
function qzReset(kind){
  if(!confirm('Reset this tracker? Your progress and history will be cleared.')) return;
  qazaData[kind] = null; qazaTab[kind] = 'calc'; persistQaza(); renderApp();
}
function qzHeatHtml(d){
  const days = 35, arr = [];
  let mx = 1;
  for(let i=days-1;i>=0;i--){ const n = d.log[qzDayKey(i)]||0; arr.push({ i, n }); if(n>mx) mx = n; }
  const start = new Date(); start.setDate(start.getDate()-(days-1));
  const names = ['S','M','T','W','T','F','S'];
  let h = `<div class="qz-heat" dir="ltr">${names.map(n=>`<div class="qz-hd">${n}</div>`).join('')}`;
  for(let p=0;p<start.getDay();p++) h += '<div></div>';
  arr.forEach(c=>{
    const dd = new Date(); dd.setDate(dd.getDate()-c.i);
    const lvl = c.n<=0 ? 0 : Math.min(4, Math.ceil(4*c.n/mx));
    h += `<div class="qz-hc l${lvl}${c.i===0?' today':''}" title="${escapeHtml(qzFmtDate(dd))}: ${c.n}"></div>`;
  });
  return h + '</div>';
}
function qzRefreshTracker(kind){
  const d = qazaData[kind]; if(!d) return;
  const items = qzItems(kind).filter(it=>(d.total[it.id]||0)>0);
  let tot = 0, rem = 0, maxRem = 0;
  items.forEach(it=>{
    const t = d.total[it.id], r = d.remaining[it.id];
    tot += t; rem += r; maxRem = Math.max(maxRem, r);
    const n = document.getElementById('qz-'+kind+'-'+it.id+'-n'); if(n) countTo(n, r);
    const bar = document.getElementById('qz-'+kind+'-'+it.id+'-bar'); if(bar) bar.style.width = (t ? 100*(t-r)/t : 0)+'%';
  });
  const pct = tot ? (tot-rem)/tot*100 : 0;
  const C = 2*Math.PI*52;
  const ring = document.getElementById('qz-'+kind+'-ring'); if(ring) ring.setAttribute('stroke-dashoffset', C*(1-pct/100));
  const left = document.getElementById('qz-'+kind+'-left'); if(left) countTo(left, rem);
  const pe = document.getElementById('qz-'+kind+'-pct'); if(pe) pe.textContent = (pct<10 && pct>0 ? pct.toFixed(1) : Math.round(pct))+'%';
  const dt = document.getElementById('qz-'+kind+'-donetxt'); if(dt) dt.textContent = (tot-rem).toLocaleString()+' of '+tot.toLocaleString()+' completed';
  // week + stats
  const week = []; for(let i=6;i>=0;i--) week.push({ i, n:d.log[qzDayKey(i)]||0 });
  const weekSum = week.reduce((a,w)=>a+w.n,0);
  const perDayUnits = kind==='namaz' ? items.length : 1;
  const set = (id, v)=>{ const el = document.getElementById(id); if(el) el.textContent = v; };
  set('qz-'+kind+'-today', d.log[qzDayKey(0)]||0);
  set('qz-'+kind+'-streak', qzStreak(d));
  set('qz-'+kind+'-week', weekSum);
  const logKeys = Object.keys(d.log).filter(k=>d.log[k]>0);
  const doneTot = logKeys.reduce((a,k)=>a+d.log[k],0);
  set('qz-'+kind+'-donetot', doneTot.toLocaleString());
  set('qz-'+kind+'-best', qzBestStreak(d));
  set('qz-'+kind+'-avg', logKeys.length ? qzNum(doneTot/logKeys.length) : '0');
  const barsEl = document.getElementById('qz-'+kind+'-bars');
  if(barsEl){
    const mx = Math.max(1, ...week.map(w=>w.n));
    const names = ['S','M','T','W','T','F','S'];
    if(!barsEl.children.length){
      barsEl.innerHTML = week.map(w=>{ const dd = new Date(); dd.setDate(dd.getDate()-w.i); return `<div class="qz-wb"><i></i><span>${names[dd.getDay()]}</span></div>`; }).join('');
    }
    week.forEach((w,idx)=>{ const b = barsEl.children[idx].querySelector('i'); requestAnimationFrame(()=>{ b.style.height = Math.max(4, 52*w.n/mx)+'px'; }); });
  }
  const heat = document.getElementById('qz-'+kind+'-heat'); if(heat) heat.innerHTML = qzHeatHtml(d);
  const miles = document.getElementById('qz-'+kind+'-miles');
  if(miles) miles.innerHTML = [10,25,50,75,100].map(m=>`<div class="qz-badge ${pct>=m?'on':''}">${pct>=m?icon('check',11,'#E4C583')+' ':''}${m}%</div>`).join('');
  // ETA + plan text
  let etaText = '', planText = '';
  if(rem<=0){ etaText = 'All qaza completed. Alhamdulillah!'; }
  else if(kind==='namaz'){
    const goal = parseFloat(d.goal)||1;
    const e = qzEta(maxRem, goal);
    etaText = e ? 'About '+maxRem.toLocaleString()+' days left · at '+goal+'/day: '+e.text : '';
    const pace = weekSum/perDayUnits/7;
    planText = pace>0 ? 'At your last-7-day pace ('+pace.toFixed(1)+' days of qaza per day) you will finish in '+qzDuration(Math.ceil(maxRem/pace))+'.' : 'Log a few days and your real pace will appear here.';
  }else{
    const perWeek = parseFloat(d.freq)||1;
    const e = qzEta(rem, perWeek/7);
    etaText = e ? 'At '+perWeek+'/week: '+e.text : '';
    const pace = weekSum/7*7;
    planText = perWeek===2 ? 'Mondays and Thursdays are the sunnah days to fast.' : 'Avoid Eid days and the 3 days after Eid-ul-Adha.';
    if(pace>0) planText += ' Your last 7 days: '+weekSum+' fast'+(weekSum===1?'':'s')+'.';
    const wl = (qzNextRamadan() - new Date())/(7*86400000);
    const need = wl>0 ? Math.ceil(rem/wl) : null;
    set('qz-roza-ramadan', need ? 'Next Ramadan is about '+qzFmtDate(qzNextRamadan())+' (moon-sighting dependent). To clear your qaza before then you need roughly '+need+' fast'+(need===1?'':'s')+' per week.' : 'Ramadan is here or very close — focus on the current fasts.');
  }
  set('qz-'+kind+'-eta', etaText);
  set('qz-'+kind+'-plan', planText);
}

/* ---- Animation helpers ---- */
document.addEventListener('pointerdown', function(e){
  try{
    const t = e.target.closest && e.target.closest('.btn-primary,.btn-ghost,.chip,.catcard,.arow,.trow,.gcard');
    if(!t) return;
    const r = t.getBoundingClientRect();
    const size = Math.max(r.width, r.height) * 1.6;
    if(getComputedStyle(t).position==='static') t.style.position = 'relative';
    t.style.overflow = 'hidden';
    const sp = document.createElement('span');
    sp.className = 'ripple';
    sp.style.width = sp.style.height = size+'px';
    sp.style.left = (e.clientX - r.left - size/2)+'px';
    sp.style.top = (e.clientY - r.top - size/2)+'px';
    t.appendChild(sp);
    setTimeout(()=>{ if(sp.parentNode) sp.parentNode.removeChild(sp); }, 650);
  }catch(_){}
}, true);
function countTo(el, target){
  if(!el) return;
  const from = parseFloat(el.dataset.v||'0') || 0;
  el.dataset.v = target;
  if(el._raf) cancelAnimationFrame(el._raf);
  if(from===target){ el.textContent = Math.round(target).toLocaleString(); return; }
  const t0 = performance.now(), dur = 450;
  const step = (t)=>{
    const k = Math.min(1, (t-t0)/dur), ease = 1-Math.pow(1-k,3);
    el.textContent = Math.round(from + (target-from)*ease).toLocaleString();
    if(k<1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}
