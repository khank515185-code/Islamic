function fbStartPresenceAgg(){
  if(AGG.un || !FB.on || !FB.staff) return;
  AGG.un = FB.db.collection('live_presence').orderBy('ts','desc').limit(500).onSnapshot(snap=>{
    AGG.times = snap.docs.map(d=>fbMs(d.data({ serverTimestamps:'estimate' }).ts));
    aggCompute();
  }, ()=>{});
  AGG.timer = setInterval(aggCompute, 20000);
}
function fbStopPresenceAgg(){
  if(AGG.un){ AGG.un(); AGG.un = null; }
  clearInterval(AGG.timer); AGG.timer = null;
}
function aggCompute(){
  if(!DATA.live.isLive) return;
  const now = Date.now();
  const n = AGG.times.filter(t=>now-t < 75000).length;
  if(n!==DATA.live.viewers){ DATA.live.viewers = n; fbSyncLive(); liveRefreshViewers(); }
}
function liveRefreshViewers(){
  const n = (DATA.live.viewers||0).toLocaleString();
  const el = document.getElementById('live-viewers');
  if(el) el.textContent = n;
  document.querySelectorAll('.lv-n').forEach(x=>{ x.textContent = n; });
}

/* ---------- live screen: chat + presence ---------- */
const LV = { active:false, chatUn:null, hb:null, lastSend:0 };
function liveEnter(){
  if(LV.active) return;
  LV.active = true;
  if(!FB.on) return;
  LV.chatUn = FB.db.collection('live_chat').orderBy('ts','desc').limit(60).onSnapshot(snap=>{
    const arr = snap.docs.map(d=>{ const v = fbDocData(d); return { id:v.id, user:v.name, text:v.text, uid:v.uid, ts:v.ts }; });
    arr.reverse();
    liveChatMessages = arr;
    liveRefreshChat();
  }, e=>{ FB.err = fbFriendlyError(e); });
  presenceBeat();
  LV.hb = setInterval(presenceBeat, 30000);
}
function liveLeave(){
  if(!LV.active) return;
  LV.active = false;
  if(LV.chatUn){ LV.chatUn(); LV.chatUn = null; }
  clearInterval(LV.hb); LV.hb = null;
  rtcViewerStop();
}
function presenceBeat(){
  if(!FB.on || !FB.user || !DATA.live.isLive) return;
  FB.db.collection('live_presence').doc(FB.user.uid).set({ ts:firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
}
function liveChatHtml(){
  const msgs = liveChatMessages;
  if(!msgs.length) return `<div style="color:var(--muted);font-size:12px;padding:6px 2px;">${DATA.live.chatOn===false ? 'Live chat is off for this stream' : 'No messages yet — say Assalamu alaikum!'}</div>`;
  return msgs.map(m=>`<div class="chat-msg"><span class="chat-user">${escapeHtml(m.user)}</span><span class="chat-text">${escapeHtml(m.text)}</span>${(isStaffNow() && m.id) ? `<button class="iconbtn" style="padding:0 2px;margin-inline-start:4px;" onclick="liveChatDelete('${m.id}')" aria-label="Delete">${icon('close',11,'var(--ruby)')}</button>` : ''}</div>`).join('');
}
function liveRefreshChat(){
  const el = document.getElementById('live-chat-scroll');
  if(!el) return;
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  el.innerHTML = liveChatHtml();
  if(nearBottom) el.scrollTop = el.scrollHeight;
  translateNode(el);
}
async function sendChat(){
  const input = document.getElementById('chat-input');
  if(!input) return;
  const v = input.value.trim();
  if(!v) return;
  if(DATA.live.chatOn===false){ showToast('Live chat is off for this stream'); return; }
  if(!chatDisplayName){
    const n = (prompt(trStr('Enter your name to chat:'))||'').trim().slice(0,40);
    if(!n) return;
    chatDisplayName = n;
    try{ storageAPI.set('chat-display-name', n, false); }catch(e){}
  }
  if((DATA.chatBanned||[]).includes(chatDisplayName)){ showToast('You are blocked from chatting'); return; }
  if(Date.now()-LV.lastSend < 1200){ showToast('Slow down a little'); return; }
  LV.lastSend = Date.now();
  input.value = '';
  if(FB.on){
    try{
      await FB.db.collection('live_chat').add({ uid:FB.user.uid, name:chatDisplayName, text:v.slice(0,300), ts:firebase.firestore.FieldValue.serverTimestamp() });
    }catch(e){ input.value = v; showToast('Could not send — '+fbFriendlyError(e)); }
  }else{
    liveChatMessages.push({ user:chatDisplayName, text:v.slice(0,300) });
    liveRefreshChat();
  }
  input.focus();
}
function liveChatDelete(id){
  if(!isStaffNow()) return;
  FB.db.collection('live_chat').doc(id).delete().catch(e=>showToast(fbFriendlyError(e)));
}
async function liveChatClear(){
  if(!isStaffNow()) return;
  if(!confirm('Delete every live chat message?')) return;
  try{
    const s = await FB.db.collection('live_chat').get();
    await Promise.all(s.docs.map(d=>d.ref.delete()));
    showToast('Chat cleared');
  }catch(e){ showToast(fbFriendlyError(e)); }
}
function toggleLiveChat(){
  DATA.live.chatOn = (DATA.live.chatOn===false);
  persistData(); refreshAllUi();
  showToast(DATA.live.chatOn===false ? 'Live chat turned off' : 'Live chat turned on');
}

/* ============================================================
   BROADCAST FROM THIS DEVICE  (WebRTC, Firebase is the signalling channel)
   Peer-to-peer: the broadcaster's phone sends video to each viewer directly,
   so it is meant for small groups. For big audiences use the Agora live engine.
   ============================================================ */
const RTC_CFG = { iceServers:[{ urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302'] }] };
const RTC_MAX_VIEWERS = 8;
const RTC = { host:null, viewer:null, status:'', unmuted:false };
function rtcSessions(){ return FB.db.collection('live').doc('current').collection('rtc'); }
function rtcWaitIce(pc, ms){
  return new Promise(res=>{
    if(pc.iceGatheringState==='complete') return res();
    const done = ()=>{ pc.removeEventListener('icegatheringstatechange', chk); res(); };
    const chk = ()=>{ if(pc.iceGatheringState==='complete') done(); };
    pc.addEventListener('icegatheringstatechange', chk);
    setTimeout(done, ms||2500);
  });
}
async function rtcHostStart(audioOnly){
  audioOnly = audioOnly===true;
  if(!FB.on){ showToast('Join the network first to broadcast from this device'); return; }
  if(!FB.staff){ showToast('Log in as staff first'); return; }
  if(RTC.host || AG.host || AG.starting) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showToast('Camera is not available here — open the app over https'); return; }
  if(DATA.live.agoraAppId) return agoraHostStart(audioOnly);
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video: audioOnly ? false : { facingMode:'user', width:{ ideal:1280 }, height:{ ideal:720 } }, audio:{ echoCancellation:true, noiseSuppression:true } });
  }catch(e){ showToast('Could not use the camera / microphone: '+(e.message||e.name)); return; }
  const sessionId = 's'+Date.now().toString(36);
  try{ const old = await rtcSessions().get(); await Promise.all(old.docs.map(d=>d.ref.delete())); }catch(e){}
  RTC.host = { stream, peers:{}, facing:'user', sessionId, muted:false };
  const L = DATA.live;
  L.mode = 'camera'; L.engine = 'p2p'; L.audioOnly = audioOnly; L.channel = null; L.hostRtcUid = null; L.sessionId = sessionId; L.isLive = true;
  L.hostName = (FB.staff && FB.staff.name) || '';
  if(scholarSession) L.hostScholarId = scholarSession;
  persistData();
  RTC.host.un = rtcSessions().onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      const H = RTC.host; if(!H) return;
      if(ch.type==='removed'){ rtcHostDrop(ch.doc.id); return; }
      const d = ch.doc.data();
      if(d.sessionId!==H.sessionId) return;
      if(d.full) return;
      if(d.offer && !d.answer && !H.peers[ch.doc.id]) rtcHostAccept(ch.doc.id, d);
    });
  }, e=>{ showToast(fbFriendlyError(e)); });
  refreshAllUi();
  showToast('You are live — keep this page open');
}
async function rtcHostAccept(key, d){
  const H = RTC.host; if(!H) return;
  if(Object.keys(H.peers).length >= RTC_MAX_VIEWERS){
    rtcSessions().doc(key).update({ full:true }).catch(()=>{});
    return;
  }
  const pc = new RTCPeerConnection(RTC_CFG);
  H.peers[key] = { pc };
  H.stream.getTracks().forEach(t=>pc.addTrack(t, H.stream));
  pc.onconnectionstatechange = ()=>{
    if(pc.connectionState==='failed' || pc.connectionState==='closed' || pc.connectionState==='disconnected'){
      setTimeout(()=>{ if(RTC.host && RTC.host.peers[key] && RTC.host.peers[key].pc===pc && pc.connectionState!=='connected') rtcHostDrop(key); }, 4000);
    }
    rtcUpdateCount();
  };
  try{
    await pc.setRemoteDescription(JSON.parse(d.offer));
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await rtcWaitIce(pc);
    await rtcSessions().doc(key).update({ answer:JSON.stringify(pc.localDescription) });
  }catch(e){ rtcHostDrop(key); }
}
function rtcHostDrop(key){
  const H = RTC.host; if(!H || !H.peers[key]) return;
  try{ H.peers[key].pc.close(); }catch(e){}
  delete H.peers[key];
  rtcUpdateCount();
}
function rtcConnectedCount(){
  const H = RTC.host; if(!H) return 0;
  return Object.keys(H.peers).filter(k=>H.peers[k].pc.connectionState==='connected').length;
}
function rtcUpdateCount(){
  const n = rtcConnectedCount();
  document.querySelectorAll('.rtc-peers').forEach(el=>{ el.textContent = n; });
}
async function rtcHostStop(endStream){
  if(AG.host) return agoraHostStop(endStream);
  const H = RTC.host; if(!H) return;
  RTC.host = null;
  try{ if(H.un) H.un(); }catch(e){}
  Object.keys(H.peers).forEach(k=>{ try{ H.peers[k].pc.close(); }catch(e){} });
  H.stream.getTracks().forEach(t=>t.stop());
  try{ const old = await rtcSessions().get(); old.docs.forEach(d=>d.ref.delete()); }catch(e){}
  DATA.live.mode = 'link'; DATA.live.sessionId = null; DATA.live.engine = null; DATA.live.audioOnly = false;
  if(endStream){ DATA.live.isLive = false; }
  persistData();
  refreshAllUi();
  if(endStream) showToast('Broadcast ended');
}
async function rtcHostFlip(){
  if(AG.host) return agoraHostFlip();
  const H = RTC.host; if(!H) return;
  if(H.stream.getVideoTracks().length===0){ showToast('This is an audio-only broadcast'); return; }
  const facing = H.facing==='user' ? 'environment' : 'user';
  try{
    const ns = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:facing } } });
    const nt = ns.getVideoTracks()[0];
    Object.keys(H.peers).forEach(k=>{
      const s = H.peers[k].pc.getSenders().find(x=>x.track && x.track.kind==='video');
      if(s) s.replaceTrack(nt);
    });
    H.stream.getVideoTracks().forEach(t=>{ t.stop(); H.stream.removeTrack(t); });
    H.stream.addTrack(nt);
    H.facing = facing;
    rtcAttachHostPreview();
  }catch(e){ showToast('Could not switch the camera'); }
}
function rtcHostMute(){
  if(AG.host) return agoraHostMute();
  const H = RTC.host; if(!H) return;
  H.muted = !H.muted;
  H.stream.getAudioTracks().forEach(t=>{ t.enabled = !H.muted; });
  refreshAllUi();
  showToast(H.muted ? 'Microphone muted' : 'Microphone on');
}
function rtcAttachHostPreview(){
  agoraAttachHost();
  document.querySelectorAll('video.rtc-host-preview').forEach(el=>{
    if(RTC.host && el.srcObject!==RTC.host.stream){ el.srcObject = RTC.host.stream; el.muted = true; const p = el.play(); if(p && p.catch) p.catch(()=>{}); }
  });
  rtcUpdateCount();
}
/* viewer side */
function rtcSetStatus(msg){
  RTC.status = msg || '';
  document.querySelectorAll('.rtc-status').forEach(el=>{
    el.textContent = trStr(RTC.status);
    el.style.display = RTC.status ? 'flex' : 'none';
  });
}
async function rtcViewerStart(force){
  if(DATA.live.engine==='agora'){ if(AG.host && !force) return; return agoraViewerStart(); }
  if(RTC.viewer || (RTC.host && !force) || !FB.on || !FB.user) return;
  const L = DATA.live;
  if(!L.isLive || L.mode!=='camera' || !L.sessionId) return;
  const key = FB.user.uid.slice(0,6)+Math.random().toString(36).slice(2,9);
  const V = RTC.viewer = { key, sessionId:L.sessionId, pc:null, stream:null, un:null, answered:false, timer:null, retries:0 };
  rtcSetStatus('Connecting…');
  try{
    const pc = V.pc = new RTCPeerConnection(RTC_CFG);
    pc.addTransceiver('video', { direction:'recvonly' });
    pc.addTransceiver('audio', { direction:'recvonly' });
    pc.ontrack = e=>{
      if(e.streams && e.streams[0]) V.stream = e.streams[0];
      else { if(!V.stream) V.stream = new MediaStream(); V.stream.addTrack(e.track); }
      rtcAttachViewer();
    };
    pc.onconnectionstatechange = ()=>{
      if(RTC.viewer!==V) return;
      if(pc.connectionState==='connected'){ clearTimeout(V.timer); rtcSetStatus(''); }
      else if(pc.connectionState==='failed' || pc.connectionState==='disconnected'){ rtcViewerRetry(); }
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await rtcWaitIce(pc);
    const ref = rtcSessions().doc(key);
    V.un = ref.onSnapshot(s=>{
      if(!s.exists || RTC.viewer!==V) return;
      const d = s.data();
      if(d.full){ rtcSetStatus('Stream is full right now — please try again in a moment'); return; }
      if(d.answer && !V.answered){
        V.answered = true;
        pc.setRemoteDescription(JSON.parse(d.answer)).catch(()=>rtcViewerRetry());
      }
    });
    await ref.set({ uid:FB.user.uid, sessionId:V.sessionId, offer:JSON.stringify(pc.localDescription), ts:Date.now() });
    V.timer = setTimeout(()=>{
      if(RTC.viewer===V && (!V.pc || V.pc.connectionState!=='connected')) rtcSetStatus('Waiting for the broadcaster…');
      V.timer = setTimeout(()=>{ if(RTC.viewer===V && V.pc.connectionState!=='connected') rtcViewerRetry(); }, 15000);
    }, 12000);
  }catch(e){ rtcSetStatus('Could not connect'); }
}
function rtcViewerRetry(){
  const V = RTC.viewer; if(!V) return;
  const n = V.retries + 1;
  rtcViewerStop();
  if(n>4){ rtcSetStatus('Could not connect'); return; }
  setTimeout(()=>{ if(appScreen.name==='live'){ rtcViewerStart().then(()=>{ if(RTC.viewer) RTC.viewer.retries = n; }); } }, 1500);
}
function rtcViewerStop(){
  agoraViewerStop();
  const V = RTC.viewer; if(!V) return;
  RTC.viewer = null;
  clearTimeout(V.timer);
  try{ if(V.un) V.un(); }catch(e){}
  try{ if(V.pc) V.pc.close(); }catch(e){}
  try{ if(FB.on) rtcSessions().doc(V.key).delete().catch(()=>{}); }catch(e){}
  document.querySelectorAll('video.rtc-view').forEach(el=>{ el.srcObject = null; });
  rtcSetStatus('');
}
function rtcAttachViewer(){
  agoraAttachViewer();
  document.querySelectorAll('video.rtc-view').forEach(el=>{
    if(RTC.viewer && RTC.viewer.stream && el.srcObject!==RTC.viewer.stream){
      el.srcObject = RTC.viewer.stream;
      el.muted = !RTC.unmuted;
      const p = el.play(); if(p && p.catch) p.catch(()=>{});
    }
  });
  const b = document.getElementById('rtc-unmute'); if(b) b.style.display = RTC.unmuted ? 'none' : 'flex';
}
function rtcUnmute(){
  RTC.unmuted = true;
  if(AG.viewer && AG.viewer.audio){ try{ AG.viewer.audio.setVolume(100); AG.viewer.audio.play(); }catch(e){} }
  document.querySelectorAll('video.rtc-view').forEach(el=>{ el.muted = false; const p = el.play(); if(p && p.catch) p.catch(()=>{}); });
  const b = document.getElementById('rtc-unmute'); if(b) b.style.display = 'none';
}
function audioCardHtml(){
  return `<div class="audio-card"><span style="display:inline-flex;">${icon('radio',34,'var(--gold-light)')}</span><div style="font-weight:800;margin-top:8px;">${escapeHtml(trStr('Audio-only broadcast'))}</div></div>`;
}
function rtcViewerMediaHtml(){
  const L = DATA.live;
  const stage = L.engine==='agora'
    ? `<div class="ag-view" style="position:absolute;inset:0;background:#000;"></div>`
    : `<video class="rtc-view" autoplay playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;"></video>`;

}
function rtcHostMediaHtml(){
  if(AG.host) return AG.host.audioOnly ? audioCardHtml() : `<div class="ag-host-preview" style="position:absolute;inset:0;background:#000;"></div>`;
  if(RTC.host && DATA.live.audioOnly) return audioCardHtml();
  return `<video class="rtc-host-preview" autoplay playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;"></video>`;

function isHosting(){ return !!(RTC.host || AG.host); }

/* ============================================================
   AGORA ENGINE — unlimited viewers. Firebase still carries the live status,
   chat, viewer count and the channel name; Agora carries only the video.
   No server needed (App ID in testing mode). Viewers only play the host's uid.
   ============================================================ */
const AG = { host:null, viewer:null, starting:false };
const AGORA_SRCS = ['https://download.agora.io/sdk/release/AgoraRTC_N-4.24.8.js','https://cdn.jsdelivr.net/npm/agora-rtc-sdk-ng@4.24.8/AgoraRTC_N.js'];
let _agLoad = null;
function agoraLoad(){
  if(window.AgoraRTC) return Promise.resolve();
  if(_agLoad) return _agLoad;
  _agLoad = (async()=>{
    for(const src of AGORA_SRCS){
      try{ await Promise.race([ fbLoadScript(src), new Promise((_, rej)=>setTimeout(()=>rej(new Error('timeout')), 12000)) ]); if(window.AgoraRTC) return; }catch(e){}
    }
    throw new Error('Could not load the live video engine — check your internet connection');
  })();
  _agLoad.catch(()=>{ _agLoad = null; });
  return _agLoad;
}
function agoraFriendly(e){
  const m = ((e && (e.code||'')) + ' ' + (e && e.message ? e.message : e || '')).toString();
  if(/dynamic use static key|invalid vendor key|CAN_NOT_GET_GATEWAY|invalid app ?id/i.test(m)) return 'Agora rejected the App ID — in the Agora console create the project with “App ID” (testing) authentication, and check the ID';
  if(/PERMISSION_DENIED|NotAllowed/i.test(m)) return 'Camera / microphone permission was denied';
  if(/NOT_READABLE|NotReadable/i.test(m)) return 'The camera or microphone is being used by another app';
  if(/DEVICES_NOT_FOUND|NotFound/i.test(m)) return 'No camera or microphone found';
  return m.trim() || 'Something went wrong';
}
async function agoraHostStart(audioOnly){
  if(AG.host || AG.starting) return;
  const L = DATA.live;
  AG.starting = true;
  showToast('Starting the broadcast…');
  let client = null, aTrack = null, vTrack = null;
  try{
    await agoraLoad();
    if(AgoraRTC.setLogLevel) AgoraRTC.setLogLevel(3);
    const sessionId = 's'+Date.now().toString(36);
    const channel = 'dc-'+sessionId;
    const uid = Math.floor(Math.random()*900000000)+1000;
    client = AgoraRTC.createClient({ mode:'live', codec:'vp8' });
    await client.setClientRole('host');
    await client.join(L.agoraAppId, channel, null, uid);
    aTrack = await AgoraRTC.createMicrophoneAudioTrack({ AEC:true, ANS:true });
    const tracks = [aTrack];
    if(!audioOnly){ vTrack = await AgoraRTC.createCameraVideoTrack({ encoderConfig:'720p_2', facingMode:'user' }); tracks.push(vTrack); }
    await client.publish(tracks);
    AG.host = { client, aTrack, vTrack, uid, channel, sessionId, muted:false, audioOnly:!!audioOnly, camIdx:0 };
    L.mode = 'camera'; L.engine = 'agora'; L.channel = channel; L.hostRtcUid = uid; L.audioOnly = !!audioOnly;
    L.sessionId = sessionId; L.isLive = true;
    L.hostName = (FB.staff && FB.staff.name) || '';
    if(scholarSession) L.hostScholarId = scholarSession;
    persistData();
    refreshAllUi();
    showToast('You are live — keep this page open');
  }catch(e){
    try{ if(aTrack){ aTrack.stop(); aTrack.close(); } }catch(_){}
    try{ if(vTrack){ vTrack.stop(); vTrack.close(); } }catch(_){}
    try{ if(client) await client.leave(); }catch(_){}
    showToast(agoraFriendly(e));
  }
  AG.starting = false;
}
async function agoraHostStop(endStream){
  const H = AG.host; if(!H) return;
  AG.host = null;
  try{ if(H.aTrack){ H.aTrack.stop(); H.aTrack.close(); } }catch(e){}
  try{ if(H.vTrack){ H.vTrack.stop(); H.vTrack.close(); } }catch(e){}
  try{ await H.client.leave(); }catch(e){}
  const L = DATA.live;
  L.mode = 'link'; L.engine = null; L.channel = null; L.hostRtcUid = null; L.sessionId = null; L.audioOnly = false;
  if(endStream) L.isLive = false;
  persistData();
  refreshAllUi();
  if(endStream) showToast('Broadcast ended');
}
async function agoraHostFlip(){
  const H = AG.host; if(!H) return;
  if(!H.vTrack){ showToast('This is an audio-only broadcast'); return; }
  try{
    const cams = await AgoraRTC.getCameras();
    if(cams.length<2){ showToast('Only one camera found'); return; }
    H.camIdx = (H.camIdx+1) % cams.length;
    await H.vTrack.setDevice(cams[H.camIdx].deviceId);
  }catch(e){ showToast('Could not switch the camera'); }
}
function agoraHostMute(){
  const H = AG.host; if(!H) return;
  H.muted = !H.muted;
  try{ H.aTrack.setEnabled(!H.muted); }catch(e){}
  refreshAllUi();
  showToast(H.muted ? 'Microphone muted' : 'Microphone on');
}
function agoraAttachHost(){
  const H = AG.host; if(!H || !H.vTrack) return;
  document.querySelectorAll('.ag-host-preview').forEach(el=>{
    if(!el.firstChild){ try{ H.vTrack.play(el, { fit:'cover' }); }catch(e){} }
  });
}
async function agoraViewerStart(){
  if(AG.viewer) return;
  const L = DATA.live;
  if(!(L.isLive && L.mode==='camera' && L.engine==='agora' && L.agoraAppId && L.channel)) return;
  const V = AG.viewer = { client:null, video:null, audio:null };
  rtcSetStatus('Connecting…');
  const isHost = u => String(u.uid)===String(DATA.live.hostRtcUid);
  try{
    await agoraLoad();
    if(AG.viewer!==V) return;
    if(AgoraRTC.setLogLevel) AgoraRTC.setLogLevel(3);
    const client = V.client = AgoraRTC.createClient({ mode:'live', codec:'vp8' });
    await client.setClientRole('audience', { level:1 });
    client.on('user-published', async (user, type)=>{
      if(AG.viewer!==V || !isHost(user)) return;
      try{ await client.subscribe(user, type); }catch(e){ return; }
      if(AG.viewer!==V) return;
      if(type==='video'){ V.video = user.videoTrack; agoraAttachViewer(); rtcSetStatus(''); }
      if(type==='audio'){
        V.audio = user.audioTrack;
        try{ V.audio.setVolume(RTC.unmuted ? 100 : 0); V.audio.play(); }catch(e){}
        if(DATA.live.audioOnly) rtcSetStatus('');
      }
    });
    const gone = (user, type)=>{
      if(AG.viewer!==V || !isHost(user)) return;
      if(!type || type==='video'){ V.video = null; document.querySelectorAll('.ag-view').forEach(el=>{ el.innerHTML = ''; }); }
      if(!type || type==='audio') V.audio = null;
      rtcSetStatus('Waiting for the broadcaster…');
    };
    client.on('user-unpublished', gone);
    client.on('user-left', u=>gone(u));
    await client.join(L.agoraAppId, L.channel, null, null);
    setTimeout(()=>{ if(AG.viewer===V && !V.video && !V.audio) rtcSetStatus('Waiting for the broadcaster…'); }, 8000);
  }catch(e){
    if(AG.viewer===V){ AG.viewer = null; try{ if(V.client) V.client.leave(); }catch(_){} }
    rtcSetStatus('Could not connect');
    console.warn('Agora viewer:', e);
  }
}
function agoraViewerStop(){
  const V = AG.viewer; if(!V) return;
  AG.viewer = null;
  try{ if(V.client) V.client.leave(); }catch(e){}
  document.querySelectorAll('.ag-view').forEach(el=>{ el.innerHTML = ''; });
  rtcSetStatus('');
}
function agoraAttachViewer(){
  const V = AG.viewer; if(!V) return;
  document.querySelectorAll('.ag-view').forEach(el=>{
    if(V.video && !el.firstChild){ try{ V.video.play(el, { fit:'cover' }); }catch(e){} }
  });
  const b = document.getElementById('rtc-unmute'); if(b) b.style.display = RTC.unmuted ? 'none' : 'flex';
}

function feedLocalLoad(){
  FEED.posts = (DATA.posts||[]).slice().sort((a,b)=>b.ts-a.ts);

function staffIdentity(){
  if(FB.staff && FB.staff.name) return { name:FB.staff.name, role:FB.staff.role==='scholar' ? 'Scholar' : (FB.staff.role||'Admin') };
  if(scholarSession){ const s = DATA.scholars.find(x=>x.id===scholarSession); if(s) return { name:s.name, role:'Scholar' }; }
  return { name:'Admin', role:'Admin' };

function timeAgo(ms){
  const s = Math.max(0, (Date.now()-ms)/1000);
  if(s<60) return tf('just now');
  if(s<3600) return tf('{n} min ago',{ n:Math.floor(s/60) });
  if(s<86400) return tf('{n} h ago',{ n:Math.floor(s/3600) });
  if(s<86400*30) return tf('{n} d ago',{ n:Math.floor(s/86400) });
  return qzFmtDate(new Date(ms));
}
async function postSave(p){
  const id = p.id;
  if(FB.on){
    const o = { text:p.text, img:p.img||'', author:p.author, role:p.role, pinned:!!p.pinned };
    if(id) await FB.db.collection('posts').doc(id).set(o, { merge:true });
    else { o.likedBy = []; o.authorUid = FB.user.uid; o.ts = firebase.firestore.FieldValue.serverTimestamp(); await FB.db.collection('posts').add(o); }
  }else{
    DATA.posts = DATA.posts || [];
    if(id){ const e = DATA.posts.find(x=>x.id===id); if(e) Object.assign(e, { text:p.text, img:p.img||'', pinned:!!p.pinned }); }
    else DATA.posts.unshift({ id:'p-'+Date.now(), text:p.text, img:p.img||'', author:p.author, role:p.role, pinned:!!p.pinned, likedBy:[], ts:Date.now() });

function imgToDataUrl(file, maxDim, q){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{
      const im = new Image();
      im.onload = ()=>{
        const k = Math.min(1, maxDim/Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.width*k)); c.height = Math.max(1, Math.round(im.height*k));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        let out = c.toDataURL('image/jpeg', q);
        if(out.length > 650000) out = c.toDataURL('image/jpeg', 0.5);
        res(out);
      };
      im.onerror = ()=>rej(new Error('That file is not an image'));
      im.src = fr.result;
    };
    fr.onerror = ()=>rej(new Error('Could not read the file'));
    fr.readAsDataURL(file);
  });
}

  const f = inp.files && inp.files[0]; if(!f) return;
  try{
    PM.img = await imgToDataUrl(f, 900, 0.72);
    if(PM.img.length > 800000){ PM.img = ''; showToast('That photo is too large — pick a smaller one'); return; }
    const pv = document.getElementById('mp-prev'); pv.src = PM.img; pv.style.display = 'block';
    document.getElementById('mp-rm').style.display = 'inline-flex';
  }catch(e){ showToast(e.message); }

function p2pBackup(){
  if(!FB.net) return;
  qzCopy(DeenNet.backupString(FB.net.me), 'Backup key copied — keep it secret, never share it');
  p2pLs('dc:p2p-backed', '1');
}
function p2pRestorePrompt(){
  const s = prompt('Paste your backup key (it starts with DN1.)');
  if(!s) return;
  let id;
  try{ id = DeenNet.parseBackup(s); }catch(e){ showToast(e.message); return; }
  if(!confirm('Replace the identity on this phone with the one from the backup?')) return;
  p2pLs('dc:p2p-id', JSON.stringify(id)); p2pLs('dc:p2p-backed', '1');
  if(!p2pLs('dc:p2p-name')) p2pLs('dc:p2p-name', 'Friend');
  showToast('Restored — reloading…');
  setTimeout(()=>location.reload(), 600);
}
function p2pForget(){
  if(!confirm('Remove your identity from this phone? Without a backup key you can never get it back (and staff access is lost).')) return;
  if(!confirm('Really remove it? This cannot be undone.')) return;
  p2pLs('dc:p2p-id', null); p2pLs('dc:p2p-name', null); p2pLs('dc:p2p-backed', null);
  location.reload();
}

/* ============================================================
   CLOUD CONTENT (CMS) — banners, articles (with images), categories, masjids,
   duas, scholars, settings and Q&A are shared through Firestore.
   ============================================================ */
const CMS_TYPES = { categories:'arr', articles:'arr', banners:'arr', masjids:'arr', duas:'arr', scholars:'arr', settings:'obj', qa:'arr' };
const CMS_ALL = Object.keys(CMS_TYPES);
const CMS = { last:{}, seeded:{}, base:{}, timer:null, started:false };
function stable(o){
  if(Array.isArray(o)) return '['+o.map(stable).join(',')+']';
  if(o && typeof o==='object') return '{'+Object.keys(o).filter(k=>o[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';
  return JSON.stringify(o===undefined ? null : o);
}
function cmsClean(type, it){
  if(type==='scholars'){ const c = Object.assign({}, it); delete c.password; delete c.username; return c; }
  return it;
}
function cmsLocalMap(type){
  const m = {};
  if(CMS_TYPES[type]==='obj'){ m.main = stable(DATA[type]||{}); return m; }
  (DATA[type]||[]).forEach(it=>{ if(it && it.id) m[it.id] = stable(cmsClean(type, it)); });
  return m;
}
function cmsOrder(type, it, idx){
  if(type==='qa'){ const n = parseInt(String(it.id).split('-')[1],10); return n ? -n : idx; }
  return idx;
}
function cmsDocId(type, id){ return type+'__'+String(id).replace(/[\/\s]/g,'_'); }
function cmsBaseline(){
  CMS_ALL.forEach(t=>{ CMS.base[t] = stable(cmsLocalMap(t)); CMS.seeded[t] = false; CMS.last[t] = {}; });
}
function cmsStart(){
  if(CMS.started || !FB.on) return;
  CMS.started = true;
  cmsBaseline();
  fbListen(FB.db.collection('cms'), snap=>{ CMS.lastSnap = snap; cmsApply(snap); });
}
function cmsApply(snap){
  const by = {};
  snap.docs.forEach(d=>{
    const v = d.data(); if(!v || !v.type || !CMS_TYPES[v.type]) return;
    (by[v.type] = by[v.type] || []).push({ id:v.id, o:(typeof v.o==='number'?v.o:0), json:(v.enc ? qaPlain(v.enc) : v.json), answered:v.answered });
  });
  let changed = false;
  CMS_ALL.forEach(type=>{
    const docs = by[type];
    if(!docs || !docs.length){ CMS.seeded[type] = false; CMS.last[type] = {}; return; }
    docs.sort((a,b)=>a.o-b.o);
    const last = {}; const items = [];
    docs.forEach(x=>{
      try{
        const it = JSON.parse(x.json);
        if(type==='qa' && x.answered!==true){ it.answered = false; it.answer = ''; it.answeredBy = null; it.references = []; }
        items.push(it); last[x.id] = stable(cmsClean(type, it));
      }catch(e){}
    });
    CMS.seeded[type] = true;
    if(CMS_TYPES[type]==='obj'){
      CMS.last[type] = { main: last[Object.keys(last)[0]] };
      const obj = items[0] || {};
      if(stable(DATA[type]||{})!==stable(obj)){ DATA[type] = Object.assign({}, DATA[type], obj); changed = true; }
    }else{
      CMS.last[type] = last;
      if(stable((DATA[type]||[]).map(it=>cmsClean(type,it)))!==stable(items.map(it=>cmsClean(type,it)))){
        if(type==='scholars'){
          const old = DATA.scholars||[];
          items.forEach(n=>{ const o = old.find(x=>x.id===n.id); if(o && o.username) n.username = o.username; });
        }
        DATA[type] = items; changed = true;
      }
    }
  });
  if(changed){
    try{ storageAPI.set('deen-companion-shared-data', JSON.stringify(DATA), true); }catch(e){}
    cmsRefreshUi();
  }
}
function cmsRefreshUi(){
  try{ renderApp(); }catch(e){}
  try{ if(_staffView==='admin') renderAdmin(); }catch(e){}
  try{ if(_staffView==='scholar') renderScholarView(); }catch(e){}
}
function cmsPush(){
  if(!FB.on || !FB.staff) return;
  clearTimeout(CMS.timer);
  CMS.timer = setTimeout(()=>cmsPushNow(false), 500);
}
function cmsPushNow(force){
  if(!FB.on || !FB.staff) return 0;
  const admin = (FB.staff.role||'admin')==='admin';
  const types = admin ? CMS_ALL : ['articles','qa','scholars'];
  const ops = [];
  const col = FB.db.collection('cms');
  const sv = firebase.firestore.FieldValue.serverTimestamp();
  types.forEach(type=>{
    const local = cmsLocalMap(type);
    const last = CMS.last[type] || {};
    const isObj = CMS_TYPES[type]==='obj';
    const writeOne = (id, idx)=>{
      const item = isObj ? DATA[type] : (DATA[type]||[]).find(x=>x.id===id);
      if(!item) return;
      const c = cmsClean(type, item);
      const doc = { type, id, o: isObj ? 0 : cmsOrder(type, item, idx), json: stable(c), ts: sv };
      if(type==='qa'){ doc.answered = !!item.answered; doc.askerUid = item.askerUid || ''; }
      if(type==='qa' && !item.answered){ last[id] = local[id]; return; }
      ops.push(col.doc(cmsDocId(type, id)).set(doc));
      last[id] = local[id];
    };
    if(!admin && type==='scholars'){
      const mine = FB.staff.scholarId;
      if(mine && CMS.seeded[type] && local[mine]!==last[mine]) writeOne(mine, 0);
      CMS.last[type] = last; return;
    }
    if(!CMS.seeded[type] && !force){
      if(stable(local)===CMS.base[type]) return;
    }
    Object.keys(local).forEach((id, idx)=>{ if(force || !CMS.seeded[type] || local[id]!==last[id]) writeOne(id, idx); });
    if(CMS.seeded[type] || force){
      Object.keys(last).forEach(id=>{
        if(!(id in local) && (admin || type==='articles' || type==='qa')){
          ops.push(col.doc(cmsDocId(type, id)).delete()); delete last[id];
        }
      });
    }
    CMS.seeded[type] = true; CMS.last[type] = last;
  });
  if(ops.length){
    Promise.all(ops).catch(e=>showToast('Could not save to the cloud: '+fbFriendlyError(e)));
  }
  return ops.length;
}
async function cmsSeedAll(){
  if(!isStaffNow() || (FB.staff.role||'admin')!=='admin'){ showToast('Admin access needed'); return; }
  const n = cmsPushNow(true);
  showToast(n ? 'Uploaded '+n+' items to the cloud' : 'Nothing to upload');
}
/* Questions are end-to-end encrypted: only the admin, the current scholars and the person who asked can read them
   until a scholar answers (answers are public). Everyone else's phone only ever holds unreadable bytes. */
const QA_PLAIN = new Map(), QA_BUSY = new Set();
function qaPlain(enc){
  if(!enc || !enc.c || !FB.net) return '';
  if(QA_PLAIN.has(enc.c)) return QA_PLAIN.get(enc.c);
  if(!QA_BUSY.has(enc.c)){
    QA_BUSY.add(enc.c);
    DeenNet.decryptJson(enc, FB.net.me).then(t=>{
      QA_PLAIN.set(enc.c, t || '');
      if(t && CMS.lastSnap) cmsApply(CMS.lastSnap);
    }).catch(()=>{ QA_PLAIN.set(enc.c, ''); }).then(()=>{ QA_BUSY.delete(enc.c); });
  }
  return '';
}
async function cmsAddQuestion(q){
  if(!FB.on || !FB.user) return;
  try{
    const pubs = [FB.net.netPub, FB.net.me.pub];
    const st = await FB.db.collection('staff').get();
    st.docs.forEach(d=>{ const v = d.data(); if(v && v.pub) pubs.push(v.pub); });
    const enc = await DeenNet.encryptJson(stable(q), pubs);
    await FB.db.collection('cms').doc(cmsDocId('qa', q.id)).set({ type:'qa', id:q.id, o:cmsOrder('qa', q, 0), askerUid:FB.user.uid, answered:false, json:'', enc, ts:firebase.firestore.FieldValue.serverTimestamp() });
  }catch(e){ showToast('Could not send your question: '+fbFriendlyError(e)); }
}

async function fbAddStaff(){
  const code = ((document.getElementById('st-email')||{}).value||'').trim();
  const role = (document.getElementById('st-role')||{}).value || 'scholar';
  const name = ((document.getElementById('st-name')||{}).value||'').trim();
  let uid, pub;
  if(FB.fire){
    const m = /^([A-Za-z0-9]{20,40})\.([A-Za-z0-9_-]{87})$/.exec(code);
    if(!m || !DeenNet.validPub(m[2])){ showToast('Paste the ID code the person copied from their Account screen'); return; }
    uid = m[1]; pub = m[2];
  }else{
    if(!DeenNet.validPub(code)){ showToast('Paste the ID code the person copied from their Account screen'); return; }
    uid = DeenNet.uidOf(code); pub = code;
  }
  try{
    await FB.db.collection('staff').doc(uid).set({ role, name: name || 'Staff '+uid.slice(0,5), pub }, { merge:true });
    showToast('Added to the team');
    await fbLoadStaff();
  }catch(e){ showToast(fbFriendlyError(e)); }

/* ---------- Qaza Namaz: fidya ---------- */
function qzNFidyaHtml(){
  const f = qazaForm.namaz;
  const direct = f.fidyaMode!=='wheat';
  return `
  <div class="qz-card"><h3>Is there a kaffara for missed prayers?</h3>
    <div class="qz-note" style="margin:0;">No. A missed prayer is made up (qaza) together with sincere repentance (tawba) — there is no kaffara for namaz. What exists is fidya: for a person who passed away owing prayers and asked for it in a will, or who is permanently unable to pray. Rulings differ between madhabs, so please ask a trusted scholar.</div>
  </div>
  <div class="qz-card"><h3>Fidya for missed prayers</h3>
    ${qzField('namaz','fidyaDays','Days of missed prayers','number','0')}
    <div class="field"><label>Prayers counted per day</label><div style="display:flex;gap:8px;flex-wrap:wrap;">${qzChip('namaz','fidyaPer','6','6 (with Witr)')}${qzChip('namaz','fidyaPer','5','5 (without Witr)')}</div></div>
    ${qzField('namaz','fidyaPrayers','Or the total number of prayers, if you know it','number','0')}
    ${qazaData.namaz ? `<button class="btn-ghost" style="margin:-4px 0 12px;" onclick="qzNFidyaFromTracker()">${icon('refresh',13)} Use my remaining qaza prayers</button>` : ''}
    <div class="field"><label>How do you want to set the rate?</label><div style="display:flex;gap:8px;flex-wrap:wrap;">${qzChip('namaz','fidyaMode','direct','Enter amount')}${qzChip('namaz','fidyaMode','wheat','From wheat price')}</div></div>
    ${direct
      ? qzField('namaz','fidyaRate','Fidya per prayer (your local rate)','number','0','Same as the sadaqat-ul-fitr amount — about 2 kg of wheat. Check the current local rate.')
      : `${qzField('namaz','wheatPrice','Wheat price per kg','number','0')}
         <div class="field"><label>Wheat per prayer</label><div style="display:flex;gap:8px;flex-wrap:wrap;">${qzChip('namaz','wheatKg','1.633','1.633 kg (Hanafi)')}${qzChip('namaz','wheatKg','2','2 kg (safer side)')}</div></div>`}
    ${qzField('namaz','fidyaPaid','Amount already given','number','0')}
    <div id="qz-nfidya-res"></div>
  </div>`;
}
function qzNFidyaFromTracker(){
  const d = qazaData.namaz;
  if(!d){ showToast('Start a namaz tracker first'); return; }
  const rem = Object.keys(d.remaining).reduce((a,k)=>a+d.remaining[k],0);
  qazaForm.namaz.fidyaPrayers = String(rem); persistQaza(); renderApp();
}
function qzNFidyaUpdate(){
  const f = qazaForm.namaz;
  const per = String(f.fidyaPer)==='5' ? 5 : 6;
  const days = Math.max(0, Math.floor(parseFloat(f.fidyaDays)||0));
  const direct = Math.max(0, Math.floor(parseFloat(f.fidyaPrayers)||0));
  const prayers = direct>0 ? direct : days*per;
  const rate = qzFidyaRate(f);
  const paid = Math.max(0, parseFloat(f.fidyaPaid)||0);
  const kg = f.fidyaMode==='wheat' ? (parseFloat(f.wheatKg)||1.633) : 1.633;
  const el = document.getElementById('qz-nfidya-res'); if(!el) return;
  if(!(prayers>0)){ el.innerHTML = ''; return; }
  const fmt = n => n.toLocaleString(undefined,{ maximumFractionDigits:0 });
  const total = prayers*rate, left = Math.max(0, total-paid);
  el.innerHTML = `<div class="qz-hero" style="margin:0;"><div class="qz-big">${rate>0 ? fmt(total) : fmt(prayers)}</div><div class="qz-biglbl">${rate>0 ? 'TOTAL FIDYA' : 'POOR PEOPLE TO FEED (1 PER PRAYER)'}</div>
      <div class="qz-sub" style="margin-top:8px;">${rate>0 ? tf('{p} prayers × {r} per prayer',{ p:fmt(prayers), r:fmt(rate) }) : tf('Enter the fidya rate to see the amount.')}</div>
      <div class="qz-sub" style="margin-top:4px;">${tf('About {k} kg of wheat in total',{ k:fmt(prayers*kg) })}</div></div>`
    + (rate>0 && paid>0 ? `<div class="qz-li" style="margin-top:8px;"><span>${tf('Already given')}</span><b>${fmt(paid)}</b></div><div class="qz-li"><span>${tf('Still to give')}</span><b>${fmt(left)}</b></div>` : '');
}

  if(!img && (!ar || !sub)){ showToast('Add a photo, or fill in both text fields'); return; }
  if(id){
    const b = DATA.banners.find(x=>x.id===id);
    Object.assign(b, { ar, sub, img });
    showToast('Slide updated');
  }else{
    DATA.banners.push({ id:'b-'+Date.now(), ar, sub, img });
    showToast('Slide added');
  }
  persistData(); closeModal(); renderAdmin(); renderApp();
}

/* ---------- articles (with thumbnail) ---------- */
function openArticleModal(id, lockScholarId){
  const editing = id ? DATA.articles.find(a=>a.id===id) : null;
  const authorVal = editing ? (editing.scholarId||'') : (lockScholarId||'');
  AM = { thumb: editing ? safeImg(editing.thumb) : '' };
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-head"><h3>${editing?'Edit article':'Add article'}</h3><button class="iconbtn" onclick="closeModal()">${icon('close',18)}</button></div>
    <div class="modal-body">
      <div class="field"><label>Title</label><input id="ma-title" value="${editing?escapeHtml(editing.title):''}"></div>
      <div class="field"><label>Thumbnail photo (optional)</label>
        <input id="ma-thumb-file" type="file" accept="image/*" onchange="articlePickThumb(this)">
        ${imgPreviewHtml(AM.thumb, 'ma-thumb-prev', 140)}
        <button class="btn-ghost" id="ma-thumb-rm" style="margin-top:8px;${AM.thumb?'':'display:none;'}" onclick="articleRemoveThumb()">Remove photo</button>
        <div style="font-size:10.5px;color:var(--muted);margin-top:4px;">Shown on article lists and at the top of the article. Resized automatically.</div>
      </div>
      <div class="field-row">
        <div class="field"><label>Category</label>
          <select id="ma-cat">${DATA.categories.map(c=>`<option value="${c.id}" ${editing&&editing.catId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Tag</label><input id="ma-tag" value="${editing?escapeHtml(editing.tag):''}" placeholder="e.g. Belief"></div>
      </div>
      <div class="field"><label>Read time (minutes)</label><input id="ma-time" type="number" min="1" value="${editing?editing.time:5}"></div>
      <div class="field"><label>Author (Mufti Sahab / scholar)</label>
        <select id="ma-scholar" ${lockScholarId?'disabled':''}>
          <option value="">No author shown</option>
          ${DATA.scholars.map(s=>`<option value="${s.id}" ${authorVal===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Body</label><textarea id="ma-body">${editing?escapeHtml(editing.body):''}</textarea></div>
      <div class="field">
        <label>Book / Hadith reference images (optional)</label>
        <div id="ma-refs-list"></div>
        <input type="file" accept="image/*" id="ma-ref-file" onchange="onRefPick(event)">
        <div style="font-size:10.5px;color:var(--muted);margin-top:4px;">Attach a scanned page with a caption — e.g. book name, volume, page number.</div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-primary" onclick="saveArticle('${editing?editing.id:''}', ${lockScholarId?`'${lockScholarId}'`:'null'})">${icon('check',14,'#fff')} Save</button></div>`;
  document.getElementById('modal-overlay').classList.add('show');
  modalRefs = editing ? JSON.parse(JSON.stringify(editing.references||[])) : [];
  refsContainerId = 'ma-refs-list';
  renderRefsList();
}
function saveArticle(id, lockScholarId){
  const title = document.getElementById('ma-title').value.trim();
  const catId = document.getElementById('ma-cat').value;
  const tag = document.getElementById('ma-tag').value.trim() || 'General';
  const time = parseInt(document.getElementById('ma-time').value,10) || 5;
  const body = document.getElementById('ma-body').value.trim() || 'Content coming soon.';
  const scholarSelect = document.getElementById('ma-scholar');
  const scholarId = lockScholarId || (scholarSelect ? (scholarSelect.value || null) : null);
  const references = JSON.parse(JSON.stringify(modalRefs));
  const thumb = AM.thumb || '';
  if(!title){ showToast('Enter a title'); return; }
  const hues = COLOR_CHOICES;
  if(id){
    const a = DATA.articles.find(x=>x.id===id);
    Object.assign(a, { title, catId, tag, time, body, scholarId, references, thumb });
    showToast('Article updated');
  }else{
    DATA.articles.push({ id:'art-'+Date.now(), catId, title, tag, time, body, scholarId, references, thumb, hue: hues[DATA.articles.length % hues.length] });
    showToast('Article added');
  }
  persistData(); closeModal(); renderAdmin(); renderApp();
  if(scholarSession) renderScholarView();
}

/* ---------- Admin → Firebase (setup, team, content, live engine, guide) ---------- */

  const on = FB.on;
  const isAdminUser = on && FB.staff && (FB.staff.role||'admin')==='admin';
  const status = on ? `<span class="fb-pill ok">● Firebase · ${escapeHtml((FB.cfg&&FB.cfg.projectId)||'')}</span>` : `<span class="fb-pill">● Demo mode (this phone only)</span>`;
  return `
  <div class="admin-header"><h2>Firebase</h2>${status}</div>
  ${FB.err ? `<div class="fb-note" style="color:var(--ruby);margin-bottom:12px;">${escapeHtml(FB.err)}</div>` : ''}
  ${fbPasteCardHtml()}
  ${FB.fire ? fbAdminCardHtml() : ''}
  ${FB.fire && isAdminUser ? adminUpdateCardHtml() : ''}
  <div class="fb-card"><h3>Team (admins &amp; scholars)</h3>${staffTeamHtml()}</div>
  <div class="fb-card"><h3>Publish app content to everyone</h3>
    <div class="fb-note" style="margin:0 0 8px;">Banners, articles (with photos), categories, masjids, duas, scholars and settings are shared with every user once published. After the first publish, every change you save is uploaded automatically.</div>
    ${isAdminUser ? `<button class="btn-primary" onclick="cmsSeedAll()">${icon('check',15,'#fff')} Publish all content now</button>` : `<div class="fb-note">Admins only.</div>`}
  </div>
  <div class="fb-card"><h3>Live engine (any number of viewers)</h3>
    <div class="fb-note" style="margin:0 0 8px;">Without this, in-app broadcasts are peer-to-peer and limited to ${RTC_MAX_VIEWERS} viewers. For a full masjid audience add a free Agora account: console.agora.io → New project → authentication <b>“App ID”</b> (testing) → copy the <b>App ID</b> and paste it below. Agora includes 10,000 free minutes a month; every viewer's watching time counts toward that.</div>
    ${!FB.on ? `<div class="fb-note">Join a network first.</div>` : !FB.staff ? `<div class="fb-note">Staff only.</div>` : `
    <div class="field"><label>Agora App ID</label><input id="fb-agora" value="${escapeHtml(DATA.live.agoraAppId||'')}" placeholder="32 letters and numbers" style="font-family:monospace;"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;"><button class="btn-primary" onclick="saveAgoraAppId()">${icon('check',15,'#fff')} Save</button>
    <span class="fb-pill ${DATA.live.agoraAppId?'ok':''}">${DATA.live.agoraAppId ? '● Unlimited-viewer engine on' : '● Peer-to-peer (up to '+RTC_MAX_VIEWERS+')'}</span></div>`}
  </div>
  ${FB.fire ? fbRulesCardHtml() : ''}`;
}

function needsStaffLogin(){ return FB.on && !FB.staff; }
function screenAccount(){ return FB.on ? screenAccountFb() : screenAccountLocal(); }

/* ============ INIT ============ */
(async function init(){
  splashStart();
  await loadData();
  await loadLang();
  await loadPrefs();
  streakTouch();
  await fbInit();
  if(FB.on) fbStartListeners(); else feedLocalLoad();
  startLangObserver();
  { const dn = document.getElementById('desk-name'); if(dn) dn.textContent = appName(); }
  if(STAFF_HASH_RE.test(location.hash)) setTimeout(openStaffGate, 300);
  renderApp();
  renderAdmin();
  startLiveSim();
  startBannerAutoScroll();
  startPrayerCountdownTicker();
  startPrayerAlertChecker();
  startChatPolling();
  const naatEl = document.getElementById('naat-player');
  if(naatEl){
    naatEl.addEventListener('play', ()=>{ naatPlaying=true; if('mediaSession' in navigator) navigator.mediaSession.playbackState='playing'; renderApp(); });
    naatEl.addEventListener('pause', ()=>{ naatPlaying=false; if('mediaSession' in navigator) navigator.mediaSession.playbackState='paused'; renderApp(); });
    naatEl.addEventListener('ended', ()=>{ naatPlaying=false; renderApp(); if(DATA.naats.length>1) playNextNaat(); });
    naatEl.addEventListener('timeupdate', ()=>{
      const bar = document.getElementById('naat-progress');
      if(bar && naatEl.duration) bar.style.width = ((naatEl.currentTime/naatEl.duration)*100)+'%';
    });
  }
  if(userLocation){ fetchPrayerTimes(userLocation.lat, userLocation.lon); }
  splashFinish();
})();
</script>
