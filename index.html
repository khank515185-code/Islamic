/* ---------- App updates: admin publishes a version, every user is prompted ---------- */
const APP_VERSION = '1.0.0';     // bump this when you upload a new file, then publish the same number in Admin → Firebase → App update
function cmpVer(a, b){
  const x = String(a||'0').split('.').map(n=>parseInt(n,10)||0), y = String(b||'0').split('.').map(n=>parseInt(n,10)||0);
  for(let i=0;i<Math.max(x.length,y.length);i++){ const d=(x[i]||0)-(y[i]||0); if(d) return d>0?1:-1; }
  return 0;
}
function updateCheck(){
  const old = document.getElementById('upd-bar'); if(old) old.remove();
  const c = FB.appCfg;
  if(!c || !c.latest) return;
  const behind = cmpVer(c.latest, APP_VERSION) > 0;
  const forced = !!(c.min && cmpVer(c.min, APP_VERSION) > 0);
  if(!behind && !forced) return;
  if(!forced && p2pLs('dc:upd-dismiss')===c.latest) return;
  const el = document.createElement('div'); el.id = 'upd-bar';
  const notes = c.notes ? `<div style="font-size:12px;opacity:.85;margin-top:4px;line-height:1.5;">${escapeHtml(c.notes)}</div>` : '';
  if(forced){
    el.style.cssText = 'position:fixed;inset:0;z-index:10000;background:var(--parchment,#fff);display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;';
    el.innerHTML = `<div style="max-width:340px;"><div style="font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--forest);">Update required</div>
      <div style="font-size:13px;color:var(--muted);margin:8px 0 4px;">Version ${escapeHtml(c.latest)} is ready. Please update to keep using the app.</div>${notes.replace('opacity:.85','color:var(--ink)')}
      <button class="btn-primary" style="margin-top:18px;width:100%;" onclick="applyUpdate()">Update now</button></div>`;
  }else{
    el.style.cssText = 'position:fixed;left:10px;right:10px;top:10px;z-index:9999;background:var(--forest,#0f5132);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;';
    el.innerHTML = `<div style="flex:1;"><b style="font-size:13px;">Update available · v${escapeHtml(c.latest)}</b>${notes}</div>
      <button class="btn-primary" style="padding:8px 12px;font-size:12px;" onclick="applyUpdate()">Update</button>
      <button style="all:unset;cursor:pointer;font-size:12px;opacity:.8;padding:6px;" onclick="dismissUpdate()">Later</button>`;
  }
  document.body.appendChild(el);
}
function dismissUpdate(){ if(FB.appCfg) p2pLs('dc:upd-dismiss', FB.appCfg.latest); const e = document.getElementById('upd-bar'); if(e) e.remove(); }
async function applyUpdate(){
  const c = FB.appCfg || {};
  try{ if(window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(e){}
  try{ if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){ (await navigator.serviceWorker.getRegistrations()).forEach(r=>r.unregister()); } }catch(e){}
  const u = (c.url && /^https?:\/\//i.test(c.url)) ? c.url : location.href.split('#')[0].split('?')[0];
  if(/\.(apk|aab|zip)(\?|#|$)/i.test(u)){ location.href = u; return; }   // file download: open as is
  if(/^https?:/.test(u)) location.href = u + (u.includes('?')?'&':'?') + 'v=' + encodeURIComponent(c.latest || Date.now());
  else location.reload();
}
async function fbPublishUpdate(){
  const g = id => ((document.getElementById(id)||{}).value||'').trim();
  const latest = g('upd-latest'), min = g('upd-min'), url = g('upd-url'), notes = g('upd-notes');
  const okV = v => /^\d+(\.\d+){0,3}$/.test(v);
  if(!okV(latest)){ showToast('Latest version should look like 1.2.0'); return; }
  if(min && !okV(min)){ showToast('Minimum version should look like 1.1.0'); return; }
  if(url && !/^https?:\/\//i.test(url)){ showToast('The link must start with https://'); return; }
  try{
    await FB.db.collection('config').doc('app').set({ latest, min, url, notes:notes.slice(0,400), ts:firebase.firestore.FieldValue.serverTimestamp() });
    showToast('Update published — users will be prompted');
  }catch(e){ showToast(fbFriendlyError(e)); }
}
async function fbClearUpdate(){
  if(!confirm('Remove the update notice for all users?')) return;
  try{ await FB.db.collection('config').doc('app').delete(); showToast('Update notice removed'); }catch(e){ showToast(fbFriendlyError(e)); }
}

let APP_STREAK = { count:0, best:0 };
let _installEvt = null;
function localDayKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function streakTouch(){
  try{
    const now = new Date(), today = localDayKey(now);
    const y = new Date(now.getFullYear(), now.getMonth(), now.getDate()-1);
    let o = {}; try{ o = JSON.parse(p2pLs('dc:streak')||'{}') || {}; }catch(e){}
    if(o.last!==today){
      o.count = (o.last===localDayKey(y)) ? (o.count||0)+1 : 1;
      o.best = Math.max(o.best||0, o.count);
      o.last = today;
      p2pLs('dc:streak', JSON.stringify(o));
    }
    APP_STREAK = { count:o.count||1, best:o.best||1 };
  }catch(e){}
}

// Reverse-delay engine: records into a ring buffer and plays the last chunk
// backwards, using two overlapping Hann-windowed grains so there are no clicks.
const WORKLET_SRC = `
class SadaReverse extends AudioWorkletProcessor {
  static get parameterDescriptors() {
    return [{ name: 'len', defaultValue: 0.5, minValue: 0.05, maxValue: 3, automationRate: 'k-rate' }];
  }
  constructor() {
    super();
    this.size = Math.ceil(sampleRate * 3.2);
    this.buf = [new Float32Array(this.size), new Float32Array(this.size)];
    this.w = 0; this.p = 0; this.L = Math.round(sampleRate * 0.5);
    this.aA = 0; this.aB = 0;
  }
  process(inputs, outputs, params) {
    const inp = inputs[0], out = outputs[0];
    const n = out[0].length, size = this.size;
    const want = Math.max(64, Math.round(params.len[0] * sampleRate));
    for (let i = 0; i < n; i++) {
      for (let ch = 0; ch < 2; ch++) {
        const src = inp[ch] || inp[0];
        this.buf[ch][this.w] = src ? src[i] : 0;
      }
      if (this.p === 0) { this.L = want; this.aA = this.w; }
      const L = this.L, half = L >> 1;
      if (this.p === ((L - half) % L)) this.aB = this.w;
      const ageA = this.p, ageB = (this.p + half) % L;
      const wA = Math.sin(Math.PI * ageA / L), wB = Math.sin(Math.PI * ageB / L);
      const gA = wA * wA, gB = wB * wB;
      const iA = (this.aA - ageA + size) % size, iB = (this.aB - ageB + size) % size;
      for (let ch = 0; ch < 2; ch++) {
        if (out[ch]) out[ch][i] = this.buf[ch][iA] * gA + this.buf[ch][iB] * gB;
      }
      this.p++; if (this.p >= L) this.p = 0;
      this.w++; if (this.w >= size) this.w = 0;
    }
    return true;
  }
}

`;

// Synthetic hall impulse response (seeded, so live and exported audio match).
// seconds ≈ RT60. Tail gets darker over time and has a few early reflections.
function buildIR(c, seconds) {
  const rate = c.sampleRate, len = Math.max(64, Math.floor(rate * seconds));
  const buf = c.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    let seed = 1234567 + ch * 7919;
    const rnd = () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    let lp = 0;
    for (let i = 0; i < len; i++) {
      const t = i / len;
      lp += ((rnd() * 2 - 1) - lp) * (0.85 - 0.65 * t);
      const fadeOut = t > 0.9 ? (1 - t) / 0.1 : 1;
      d[i] = lp * Math.exp(-6.2 * t) * fadeOut;
    }
    for (let e = 0; e < 8; e++) {
      const pos = Math.floor(rate * (0.008 + rnd() * 0.07));
      if (pos < len) d[pos] += (rnd() * 2 - 1) * 0.9;
    }
  }
  return buf;
}

}

// Builds the complete effect graph on any context (live or offline).
//   input → dry ─────────────────────────────┐
//   input → [delay network + LFO] → wet ─────┼→ bus → limiter → out
//   input → room send → (+ shimmer) → pre-delay → hall → damp ─┘
// Ping-pong is done with gains + panning (no re-wiring), so toggling is click-free.

  // dry + delay network

  f.revToDelay.connect(f.delayIn);
  f.delayIn.connect(f.dSumA);
  f.dSumA.connect(f.lpA); f.lpA.connect(f.shA); f.shA.connect(f.delayA);
  f.delayA.connect(f.selfA); f.selfA.connect(f.dSumA);

  f.dSumB.connect(f.lpB); f.lpB.connect(f.shB); f.shB.connect(f.delayB);
  f.delayB.connect(f.crossB); f.crossB.connect(f.dSumA);
  f.delayA.connect(f.panA); f.panA.connect(f.wet);

    const d = c.createDelay(0.2); d.delayTime.value = 0;

      f.revLen = f.rev.parameters.get('len');

  // output: gentle limiter
  f.bus.connect(f.comp); f.comp.connect(f.out);

}

// Pushes the whole settings object onto the graph. smooth=true for live use.
function applyFX(f, s, smooth) {

  set(f.lfo.frequency, P.rate / 10, 0.05);

  set(f.pre.delayTime, P.pre / 1000);

        setTimeout(() => { f.conv.buffer = buildIR(c, f.irWanted); f.revOut.gain.setTargetAtTime(1, c.currentTime, 0.03); }, 60);

    }

}

let ctx = null, fx = null, master = null, analyser = null, recDest = null, audioPromise = null;

/* ---- auto-analysis: rough tempo (onset autocorrelation) + brightness (zero-crossings) ---- */
function autoAnalyze(buffer) {
  try {
    const data = buffer.getChannelData(0), sr = buffer.sampleRate;
    const maxSamples = Math.min(data.length, sr * 60);

    for (let f = 1; f < frames; f++) onset[f] = Math.max(0, env[f] - env[f - 1]);
    const fd = frameSize / sr;
    const minLag = Math.max(1, Math.round((60 / 180) / fd)), maxLag = Math.min(frames - 1, Math.round((60 / 40) / fd));
    const scoreAt = lag => { let sc = 0; for (let f = 0; f < frames - lag; f++) sc += onset[f] * onset[f + lag]; return sc; };

    for (let lag = minLag; lag <= maxLag; lag++) { const sc = scoreAt(lag); if (sc > bestScore) { bestScore = sc; bestLag = lag; } }
    // Autocorrelation often locks onto two beats instead of one — prefer the half-lag when it's nearly as strong.
    if (bestLag > 0) {

}

    const isFav = favs.includes(t.id);
    card.innerHTML = `<div class="card-name"></div><div class="card-desc"></div><div class="card-spec"></div>
      <button class="star${isFav ? ' on' : ''}" aria-label="${isFav ? 'Remove from favourites' : 'Add to favourites'}">${isFav ? '★' : '☆'}</button>
      ${t.cat === 'mine' ? '<button class="del" aria-label="Delete template">🗑</button>' : ''}`;
    const nm = card.querySelector('.card-name');
    nm.append(document.createTextNode(t.name));
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = catLabel(t.cat); nm.append(tag);
    if (t.id === S.suggested) { const s = document.createElement('span'); s.className = 'tag sug'; s.textContent = 'Suggested for your file'; nm.append(s); }
    card.querySelector('.card-desc').textContent = t.desc || 'Your saved sound.';
    card.querySelector('.card-spec').textContent = specLine(t);
    card.addEventListener('click', e => { if (e.target.closest('.star,.del')) return; applyTemplate(t); });
    card.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === card) { e.preventDefault(); applyTemplate(t); } });
    card.querySelector('.star').addEventListener('click', () => {
      favs = favs.includes(t.id) ? favs.filter(x => x !== t.id) : favs.concat(t.id); store.set('favs', favs); renderTemplates();
    });
    const del = card.querySelector('.del');
    if (del) del.addEventListener('click', () => {
      mine = mine.filter(m => m.id !== t.id); favs = favs.filter(x => x !== t.id);
      store.set('mine', mine); store.set('favs', favs); if (S.activeTpl === t.id) S.activeTpl = null; paintLCD(); renderTemplates(); toast('Template deleted');
    });
    list.appendChild(card);
  }
}
function buildCats() {
  const row = $('catRow');
  CATS.forEach(c => {
    const b = document.createElement('button'); b.className = 'chip' + (c.id === cat ? ' selected' : ''); b.textContent = c.label; b.dataset.cat = c.id;
    b.addEventListener('click', () => { cat = c.id; row.querySelectorAll('.chip').forEach(x => x.classList.toggle('selected', x === b)); renderTemplates(); });
    row.appendChild(b);
  });
}
function saveAsTemplate() {
  const input = $('tplName'), name = input.value.trim();
  if (!name) { toast('Give your template a name first', true); input.focus(); return; }
  const sn = snapshot();
  const t = { id: 'u' + Date.now().toString(36), name, desc: 'Your saved sound.', mode: sn.mode, p: sn.params, pp: sn.pingPong, sync: sn.sync === 'free' ? undefined : sn.sync, bpm: sn.bpm, limiter: sn.limiter };
  delete t.p.inGain; delete t.p.master;
  mine.push(t); store.set('mine', mine);
  S.activeTpl = t.id; S.dirty = false; input.value = ''; cat = 'mine';
  $('catRow').querySelectorAll('.chip').forEach(x => x.classList.toggle('selected', x.dataset.cat === 'mine'));

/* ---- A/B, random, share codes ---- */
const AB = { A: null, B: null };
function saveAB(slot) {
  AB[slot] = snapshot(); $('recall' + slot + 'Btn').disabled = false;
  const b = $('save' + slot + 'Btn'), o = b.textContent; b.textContent = '✓ Saved'; setTimeout(() => { b.textContent = o; }, 900);
}
function recallAB(slot) {
  if (!AB[slot] || !applySnapshot(AB[slot], true)) return;

  $('recallABtn').classList.toggle('is-on', slot === 'A'); $('recallBBtn').classList.toggle('is-on', slot === 'B');
}
function randomize() {
  const r = (a, b) => Math.round(a + Math.random() * (b - a)), modes = Object.keys(MODES);
  S.mode = modes[r(0, modes.length - 1)];
  Object.assign(S.params, { time: r(150, 900), feedback: r(15, 60), mix: r(20, 50), room: r(15, 70), tone: r(35, 85), depth: S.mode === 'mod' || S.mode === 'tape' ? r(10, 40) : r(0, 15), rate: r(3, 12), decay: r(15, 60), pre: r(0, 60) });
  S.pingPong = Math.random() < 0.35; S.sync = 'free'; S.activeTpl = null; S.dirty = false; S.label = 'Random sound';
  refreshAll();
}
function copyCode() {
  const code = 'SADA:' + btoa(unescape(encodeURIComponent(JSON.stringify(snapshot()))));
  const done = () => toast('Settings code copied');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, () => { $('codeInput').value = code; toast('Copy the code from the box below'); });
  else { $('codeInput').value = code; toast('Copy the code from the box below'); }
}
function loadCode() {
  const raw = $('codeInput').value.trim();
  try {
    if (!raw.startsWith('SADA:')) throw 0;
    const sn = JSON.parse(decodeURIComponent(escape(atob(raw.slice('SADA:'.length)))));
    if (!applySnapshot(sn, false)) throw 0;
    S.activeTpl = null; S.label = 'Shared sound'; refreshAll(); $('codeInput').value = ''; toast('Settings loaded');
  } catch (e) { toast('That code isn’t valid', true); }
}

/* ---- wiring ---- */
function init() {
  // knobs
  root.querySelectorAll('[data-knobs]').forEach(host => host.dataset.knobs.split(',').forEach(n => host.appendChild(makeKnob(n))));
  buildCats();

  // restore last session
  const last = store.get('last', null);
  if (last && applySnapshot(last, false)) { S.activeTpl = last.activeTpl || null; S.dirty = !!last.dirty; }

  // pedal
  $('modes').addEventListener('click', e => { const b = e.target.closest('.mode-chip'); if (b) setMode(b.dataset.mode); });
  $('pingPongToggle').addEventListener('click', () => { S.pingPong = !S.pingPong; S.dirty = true; refreshAll(); });
  $('limiterToggle').addEventListener('click', () => { S.limiter = !S.limiter; refreshAll(); });
  $('bypassToggle').addEventListener('click', toggleBypass);
  $('resetBtn').addEventListener('click', resetAll);
  $('tapTempoBtn').addEventListener('click', tapTempo);
  $('syncSelect').addEventListener('change', e => { S.sync = e.target.value; S.dirty = true; syncUI(); pushAudio(); });
  $('bpmInput').addEventListener('change', e => { S.bpm = clamp(Math.round(+e.target.value) || S.bpm, 40, 240); S.dirty = true; syncUI(); pushAudio(); });

  // source
  $('micBtn').addEventListener('click', toggleMic);
  $('fileInput').addEventListener('change', e => { handleFile(e.target.files[0]); e.target.value = ''; });
  const dz = $('dropZone');
  ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));
  $('playBtn').addEventListener('click', togglePlay);
  $('loopBtn').addEventListener('click', toggleLoop);
  $('stopFileBtn').addEventListener('click', stopFile);
  const seek = $('seek');
  seek.addEventListener('input', () => { tick.scrub = true; $('curTime').textContent = fmtTime(seek.value / 1000 * tDur()); });
  seek.addEventListener('change', () => { seekTo(seek.value / 1000 * tDur()); tick.scrub = false; });

  // monitor
  root.querySelectorAll('[data-viz]').forEach(b => b.addEventListener('click', () => {
    vizMode = b.dataset.viz; root.querySelectorAll('[data-viz]').forEach(x => x.classList.toggle('selected', x === b));
  }));
  $('recBtn').addEventListener('click', toggleRecord);

  // studio
  $('saveTplBtn').addEventListener('click', saveAsTemplate);
  $('tplName').addEventListener('keydown', e => { if (e.key === 'Enter') saveAsTemplate(); });
  $('saveABtn').addEventListener('click', () => saveAB('A')); $('saveBBtn').addEventListener('click', () => saveAB('B'));
  $('recallABtn').addEventListener('click', () => recallAB('A')); $('recallBBtn').addEventListener('click', () => recallAB('B'));
  $('randomBtn').addEventListener('click', randomize);
  $('copyCodeBtn').addEventListener('click', copyCode); $('loadCodeBtn').addEventListener('click', loadCode);
  $('exportBtn').addEventListener('click', exportWav);

  // templates search + tabs
  $('tplSearch').addEventListener('input', e => { query = e.target.value; renderTemplates(); });
  $('tabbar').addEventListener('click', e => {
    const b = e.target.closest('[data-go]'); if (!b) return;
    host.dataset.tab = b.dataset.go;
    $('tabbar').querySelectorAll('button').forEach(x => x.classList.toggle('selected', x === b));
    { const sc = host.closest('.scroll'); if (sc) sc.scrollTop = 0; }
  });

  // shortcuts
  document.addEventListener('keydown', e => {
    if (!host.isConnected) return;
    const tg = e.composedPath()[0] || e.target; if (!tg || !tg.getAttribute) return;
    const tag = tg.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON' || tg.getAttribute('role') === 'slider' || tg.getAttribute('role') === 'button' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'b' || e.key === 'B') toggleBypass();
    else if (e.key === 't' || e.key === 'T') tapTempo();
  });

  syncTransportUI(); refreshAll();
}
init();

  leaveFn = () => {
    try { if (micOn) stopMic(); } catch (e) {}
    try { if (T.kind === 'buffer' && T.playing) bufferPause(); else if (T.kind === 'video') video.pause(); } catch (e) {}
    try { if (recorder && recorder.state === 'recording') recorder.stop(); } catch (e) {}
    try { syncTransportUI(); setOutput(hasInput()); if (ctx && ctx.state === 'running') ctx.suspend(); } catch (e) {}
  };
  resumeFn = () => { if (analyser) startTicker(); };

  }
  return {
    mount(slot){
      if(!slot) return;
      if(!host){ host = document.createElement('div'); host.id = 'sada-host'; }
      slot.appendChild(host);
      if(!booted){ booted = true; try{ boot(); }catch(err){ console.error('Sada-e-Noor failed to start', err); slot.textContent = 'Sada-e-Noor could not start: ' + err.message; } }
      else if(resumeFn) resumeFn();
    },
    leave(){ if(leaveFn) leaveFn(); }
  };
})();

/* ---- render dispatcher ---- */
let lastScreenKey = '';
function applyEntranceAnimations(){
  try{
    const root = document.getElementById('screen-root');
    const sc = root && root.querySelector('.scroll');
    if(!sc) return;
    let items = [];
    Array.from(sc.children).forEach(c=>{
      const plainWrap = c.tagName==='DIV' && !c.className && !c.id && c.children.length>=3 && !/animation/.test(c.getAttribute('style')||'');
      if(plainWrap) items.push(...Array.from(c.children)); else items.push(c);
    });
    let n = 0;
    items.forEach(el=>{
      if(n>=14) return;
      if(el.tagName==='SCRIPT' || el.tagName==='STYLE') return;
      const cl = el.classList;
      if(cl.contains('card-in') || cl.contains('row-pulse') || cl.contains('prayer-header-anim') || cl.contains('anim-item')) return;
      if(/animation|position:\s*(absolute|fixed)/.test(el.getAttribute('style')||'')) return;
      el.style.setProperty('--i', n++);
      cl.add('anim-item');
    });
  }catch(e){}
}

  const activeIdx = Math.max(0, NAV_ITEMS.findIndex(n=>n.id===appTab));

    <div class="nav-pill" style="${LANG==='ur'?'right':'left'}:${activeIdx*colWidth}%; width:${colWidth}%;"></div>

      </button>`).join('')}
  </div>`;

  const scrKey = appScreen.name+'|'+(appScreen.catId||'')+'|'+(appScreen.articleId||'');
  const scrChanged = scrKey!==lastScreenKey;
  lastScreenKey = scrKey;
  let scrCls = '';
  if(scrChanged){
    if(appScreen.name==='home') scrCls = 'screen-back';
    else if(['live','qa','saved','account'].includes(appScreen.name)) scrCls = 'screen-anim';
    else scrCls = 'screen-fwd';

  document.getElementById('screen-root').innerHTML = `<div class="${scrCls}" style="display:flex;flex-direction:column;flex:1;min-height:0;">${content}</div>` + miniPlayerHtml() + nav;

async function playNaat(id){
  const n = DATA.naats.find(x=>x.id===id);
  if(!n) return;
  const audioEl = document.getElementById('naat-player');
  if(currentNaat && currentNaat.id===id){
    if(naatPlaying) audioEl.pause(); else audioEl.play();
    return;
  }
  currentNaat = n;
  renderApp();
  showToast('Loading '+n.title+'...');
  try{
    const r = await storageAPI.get(n.audioKey, true);
    if(!r || !r.value){ throw new Error('no audio data found'); }
    audioEl.src = r.value;
    await audioEl.play();
    setNaatMediaSession(n);
  }catch(e){
    showToast('Could not load this audio: '+(e && e.message ? e.message : 'unknown error'));
    currentNaat = null;
    renderApp();
  }
}
function toggleNaatPlay(){
  const audioEl = document.getElementById('naat-player');
  if(!audioEl || !currentNaat) return;
  if(naatPlaying) audioEl.pause(); else audioEl.play();
}
function playNextNaat(){
  if(!currentNaat || !DATA.naats.length) return;
  const idx = DATA.naats.findIndex(n=>n.id===currentNaat.id);
  const next = DATA.naats[(idx+1)%DATA.naats.length];
  if(next) playNaat(next.id);
}
function playPrevNaat(){
  if(!currentNaat || !DATA.naats.length) return;
  const idx = DATA.naats.findIndex(n=>n.id===currentNaat.id);
  const prev = DATA.naats[(idx-1+DATA.naats.length)%DATA.naats.length];
  if(prev) playNaat(prev.id);
}
function setNaatMediaSession(n){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: n.title,
      artist: n.reciter || appName(),
      album: 'Naats',
    });
    navigator.mediaSession.setActionHandler('play', ()=>{ const el=document.getElementById('naat-player'); if(el) el.play(); });
    navigator.mediaSession.setActionHandler('pause', ()=>{ const el=document.getElementById('naat-player'); if(el) el.pause(); });
    navigator.mediaSession.setActionHandler('previoustrack', playPrevNaat);
    navigator.mediaSession.setActionHandler('nexttrack', playNextNaat);
  }catch(e){}
}

  ` : `
    <div class="chat-input-row"><input id="community-chat-input" placeholder="Message as ${escapeHtml(chatDisplayName)}..." onkeydown="if(event.key==='Enter') sendChatMessage()"><button class="iconbtn" style="color:var(--emerald);" onclick="sendChatMessage()" aria-label="Send">${icon('send',18)}</button></div>
  `}`;
}
async function sendChatMessage(){
  if(!DATA.chatEnabled){ showToast('Chat is currently disabled'); return; }
  if(!chatDisplayName){
    const nameInput = document.getElementById('chat-name-input');
    const name = nameInput ? nameInput.value.trim() : '';
    if(!name){ showToast('Enter your name first'); return; }
    chatDisplayName = name;
    try{ await storageAPI.set('chat-display-name', name, false); }catch(e){}
    renderApp();
    return;
  }
  if((DATA.chatBanned||[]).includes(chatDisplayName)){ showToast('You are blocked from chatting'); return; }
  const input = document.getElementById('community-chat-input');
  const text = input ? input.value.trim() : '';
  if(!text) return;
  const msg = { id:'msg-'+Date.now()+'-'+Math.random().toString(36).slice(2,7), name:chatDisplayName, text, ts:Date.now() };
  communityChatMessages.push(msg);
  if(input) input.value = '';
  renderChatMessagesOnly();
  try{
    const latest = await fetchCommunityChat();
    if(latest===null) throw new Error('could not reach storage');
    if(!latest.some(m=>m.id===msg.id)) latest.push(msg);
    const result = await storageAPI.set('community-chat-messages', JSON.stringify(latest), true);
    if(!result) throw new Error('storage rejected the write');
    communityChatMessages = latest;
  }catch(e){ showToast('Sent, but could not sync with other users right now'); }
}
function renderChatMessagesOnly(){
  const el = document.getElementById('community-chat-scroll');
  if(!el) return;
  el.innerHTML = communityChatMessages.length ? communityChatMessages.map(m=>`<div class="chat-msg" style="margin-bottom:9px;"><span class="chat-user">${escapeHtml(m.name)}</span><span class="chat-text">${escapeHtml(m.text)}</span></div>`).join('') : `<div style="color:var(--muted);font-size:12.5px;padding:24px 0;text-align:center;">No messages yet — say Assalamu Alaikum!</div>`;
  el.scrollTop = el.scrollHeight;
}
function startChatPolling(){
  setInterval(async ()=>{
    if(appScreen.name==='chat'){
      const latest = await fetchCommunityChat();
      if(latest!==null){
        communityChatMessages = latest;
        renderChatMessagesOnly();
      }
    }
  }, 4000);
}

function attachReadProgress(){
  const scrollEl = document.querySelector('#screen-root .scroll');
  const bar = document.getElementById('read-progress');
  if(!scrollEl || !bar) return;
  const update = ()=>{
    const max = scrollEl.scrollHeight - scrollEl.clientHeight;
    const pct = max>0 ? Math.min(100,(scrollEl.scrollTop/max)*100) : 0;
    bar.style.width = pct+'%';
  };
  scrollEl.addEventListener('scroll', update);
  update();
}

function animateCountUp(el, target, duration){
  const startTime = performance.now();
  function step(now){
    const p = Math.min(1, (now-startTime)/duration);
    el.textContent = Math.floor(target*p);
    if(p<1) requestAnimationFrame(step); else el.textContent = target;
  }
  requestAnimationFrame(step);
}

async function saveNaat(id){
  const title = document.getElementById('na-title').value.trim();
  const reciter = document.getElementById('na-reciter').value.trim();
  const colorEl = document.querySelector('#na-colors .swatch-pick.sel');
  const color = colorEl ? colorEl.dataset.color : COLOR_CHOICES[0];
  const fileInput = document.getElementById('na-audio-file');
  const file = fileInput && fileInput.files[0];
  if(!title){ showToast('Enter a title'); return; }
  if(!id && !file){ showToast('Choose an audio file'); return; }
  if(file && file.size > 3*1024*1024){ showToast('That file is too large — please use a shorter or lower-quality clip (under ~3 MB)'); return; }
  const naatId = id || ('naat-'+Date.now());
  const audioKey = 'naat-audio-'+naatId;
  if(file){
    try{
      const dataUrl = await fileToBase64(file);
      if(dataUrl.length > 4.5*1024*1024){
        showToast('That file is too large once encoded — please use a shorter or lower-quality clip');
        return;
      }
      const result = await storageAPI.set(audioKey, dataUrl, true);
      if(!result){ showToast('Storage rejected that file — try a smaller clip'); return; }
    }catch(e){ showToast('Could not save that audio file: '+(e && e.message ? e.message : 'unknown error')); return; }
  }
  if(id){
    const n = DATA.naats.find(x=>x.id===id);
    Object.assign(n, { title, reciter, color });
    showToast('Naat updated');
  }else{
    DATA.naats.push({ id:naatId, title, reciter, color, audioKey });
    showToast('Naat uploaded');
  }
  persistData(); closeModal(); renderAdmin(); renderApp();
}

/* ---------- Sealed vault (admin-only readable, stored in Firebase) ----------
   Every user's device stores and relays these records inside DeenNet, so no
   server is needed. Each record is encrypted to the admin's network key, so
   the device holding it (and its owner) cannot read it. Only the admin, who
   holds the matching private key, can open them. */
const VAULT = { rows:[], opened:{}, busy:false };
async function vaultPut(kind, obj){
  if(!FB.on || !FB.net || !FB.user) throw new Error('Network is not ready yet');
  if(!FB.net.netPub) throw new Error('The admin is not set up yet');
  const enc = await DeenNet.encryptJson(JSON.stringify(obj), [FB.net.netPub]);   // admin only
  const id = DeenNet.randId(20);
  await FB.db.collection('vault').doc(id).set({ kind:String(kind).slice(0,24), uid:FB.user.uid, enc, ts:firebase.firestore.FieldValue.serverTimestamp() });
  return id;
}
function vaultSendPrompt(){
  const v = (prompt('Message for the team (private — only the admin can read it):')||'').trim();
  if(!v) return;
  vaultPut('feedback', { text:v.slice(0,2000), at:Date.now() })
    .then(()=>showToast('Sent privately'))
    .catch(e=>showToast('Could not send: '+fbFriendlyError(e)));
}
async function vaultRefresh(){
  if(!FB.on) return;
  try{
    const snap = await FB.db.collection('vault').get();
    VAULT.rows = snap.docs.map(d=>{ const v = d.data(); v.id = d.id; v.ts = v.ts ? fbMs(v.ts) : 0; return v; }).sort((a,b)=>(b.ts||0)-(a.ts||0));
  }catch(e){ showToast(fbFriendlyError(e)); }
  renderAdmin();
}
async function vaultOpen(id){
  const r = VAULT.rows.find(x=>x.id===id); if(!r) return;
  try{
    const t = await DeenNet.decryptJson(r.enc, FB.net.me);
    VAULT.opened[id] = t === null ? '(this key cannot open it)' : t;
  }catch(e){ VAULT.opened[id] = '(could not decrypt)'; }
  renderAdmin();
}
async function vaultDelete(id){
  if(!confirm('Delete this record from every device?')) return;
  try{ await FB.db.collection('vault').doc(id).delete(); VAULT.rows = VAULT.rows.filter(x=>x.id!==id); renderAdmin(); }
  catch(e){ showToast(fbFriendlyError(e)); }
}
function adminVault(){
  if(!VAULT.busy){ VAULT.busy = true; vaultRefresh().finally(()=>{ VAULT.busy = false; }); }
  const rows = VAULT.rows.map(r=>`

      <td><div class="row-actions">

    </tr>`).join('') || `<tr><td colspan="4" style="color:var(--muted);">No sealed records yet.</td></tr>`;

/* ---- Bulk import / export ---- */
const MASJID_CSV_COLS = ['name','state','city','address','fiqh','jumaTime','imam','mapUrl'];
function csvEscape(v){ v = String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function parseCsv(text){
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=c;
    }else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(cur); cur=''; if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; }
    else cur+=c;
  }
  row.push(cur); if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows;
}
function downloadText(filename, text, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:mime||'text/plain'}));
  a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportMasjidsCsv(){
  const lines = [MASJID_CSV_COLS.join(',')].concat(DATA.masjids.map(m=>MASJID_CSV_COLS.map(c=>csvEscape(c==='address'?(m.address||m.addr||''):m[c])).join(',')));
  downloadText('masjids.csv', lines.join('\n'), 'text/csv');
}
function downloadMasjidTemplate(){
  downloadText('masjids-template.csv', MASJID_CSV_COLS.join(',')+'\nJama Masjid,Delhi,Old Delhi,"Chandni Chowk, near Red Fort",Sunni,1:30 PM,,\n', 'text/csv');
}
function openMasjidImportModal(){
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-head"><h3>Bulk import masjids</h3><button class="iconbtn" onclick="closeModal()">${icon('close',18)}</button></div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px;">
        Upload or paste a CSV with columns: <b>${MASJID_CSV_COLS.join(', ')}</b>. <b>name, state, city</b> are required. A JSON array with the same keys also works. Duplicates (same name + city) are skipped.
        <a href="#" onclick="downloadMasjidTemplate();return false;" style="color:var(--emerald);font-weight:700;">Download template</a>
      </div>
      <div class="field"><label>CSV / JSON file</label><input type="file" id="mi-file" accept=".csv,.json,.txt" onchange="onMasjidImportFile(this)"></div>
      <div class="field"><label>Or paste here</label><textarea id="mi-text" rows="9" placeholder="name,state,city,address,fiqh,jumaTime,imam,mapUrl"></textarea></div>
    </div>
    <div class="modal-foot"><button class="btn-ghost" onclick="closeModal()">Cancel</button><button class="btn-primary" onclick="runMasjidImport()">${icon('check',14,'#fff')} Import</button></div>`;
  document.getElementById('modal-overlay').classList.add('show');
}
function onMasjidImportFile(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ document.getElementById('mi-text').value = r.result; };
  r.readAsText(f);
}
function runMasjidImport(){
  const text = (document.getElementById('mi-text').value||'').trim();
  if(!text){ showToast('Choose a file or paste data first'); return; }
  let items = [];
  try{
    if(text[0]==='['){ items = JSON.parse(text); }
    else{
      const rows = parseCsv(text);
      const head = rows[0].map(h=>h.trim().toLowerCase());
      const idx = {}; MASJID_CSV_COLS.forEach(c=>{ idx[c] = head.indexOf(c.toLowerCase()); });
      if(idx.name<0 || idx.state<0 || idx.city<0){ showToast('Header row must include name, state, city'); return; }
      items = rows.slice(1).map(r=>{ const o={}; MASJID_CSV_COLS.forEach(c=>{ o[c] = idx[c]>=0 ? (r[idx[c]]||'').trim() : ''; }); return o; });
    }
  }catch(e){ showToast('Could not read the data: '+e.message); return; }
  const key = (n,c)=>(String(n||'')+'|'+String(c||'')).toLowerCase().trim();
  const have = new Set(DATA.masjids.map(m=>key(m.name,m.city)));
  let added = 0, skipped = 0, n = 0;
  items.forEach(o=>{
    const name = String(o.name||'').trim(), state = String(o.state||'').trim(), city = String(o.city||'').trim();
    if(!name || !state || !city || have.has(key(name,city))){ skipped++; return; }
    have.add(key(name,city));
    DATA.masjids.push({ id:'ms-imp-'+Date.now()+'-'+(n++), name, state, city, address:String(o.address||o.addr||'').trim(), imam:String(o.imam||'').trim(), fiqh:String(o.fiqh||'Sunni').trim()||'Sunni', jumaTime:String(o.jumaTime||'').trim(), mapUrl:String(o.mapUrl||'').trim() });
    added++;
  });
  persistData(); closeModal(); renderAdmin(); renderApp();
  showToast('Imported '+added+' masjid'+(added===1?'':'s')+(skipped?(' · skipped '+skipped):''));
}

function deleteMasjid(id){

}

/* The public app has no link to the admin or scholar panels. Staff reach them by
   opening  <your-url>#staff  or by tapping the app name 5 times on the home screen,
   then signing in. (Real data protection comes from your Firebase rules.) */
let _staffView = 'app';
const STAFF_HASH_RE = /^#\/?(staff|admin|scholar)/i;
function staffAllowed(which){
  if(which==='app') return true;
  if(FB.on) return !!FB.staff && (which==='scholar' || (FB.staff.role||'admin')!=='scholar');
  try{ return sessionStorage.getItem('dc:staff-ok')==='1'; }catch(e){ return false; }
}
function cleanStaffHash(){ try{ if(STAFF_HASH_RE.test(location.hash)) history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
function showView(which){
  if(which!=='app' && !staffAllowed(which)){ openStaffGate(); return; }
  _staffView = which;
  document.getElementById('view-app').style.display = which==='app' ? 'flex' : 'none';
  document.getElementById('view-admin').style.display = which==='admin' ? 'block' : 'none';
  document.getElementById('view-scholar').style.display = which==='scholar' ? 'block' : 'none';
  document.body.classList.toggle('staff-mode', which!=='app');
  if(which==='app') cleanStaffHash();
  window.scrollTo(0,0);
}
let _brandTaps = [];
function brandTap(){
  const now = Date.now();
  _brandTaps = _brandTaps.filter(x=>now-x<3000); _brandTaps.push(now);
  if(_brandTaps.length>=5){ _brandTaps = []; openStaffGate(); }
}
async function staffHash(s){
  try{
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('deen:'+s));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h = 5381; for(let i=0;i<s.length;i++) h = ((h<<5)+h) ^ s.charCodeAt(i); return 'x'+(h>>>0).toString(16);
}
function staffGateEl(){ return document.getElementById('staff-gate'); }
let _gateMode = null;   // 'staff' | 'admin' when opened from Settings, otherwise null (old behaviour)
function openStaffGate(mode){
  _gateMode = (mode==='staff' || mode==='admin') ? mode : null;
  const g = staffGateEl(); g.classList.add('show'); staffGateRender();
  setTimeout(()=>{ const f = g.querySelector('input'); if(f) f.focus(); }, 60);
}
function closeStaffGate(){ staffGateEl().classList.remove('show'); _gateMode = null; cleanStaffHash(); }
function sgErr(m){ const e = document.getElementById('sg-err'); if(e) e.textContent = m||''; }
async function staffGatePasscode(){
  const p = (document.getElementById('sg-pass')||{}).value||'';
  let stored = null; try{ stored = localStorage.getItem('dc:staff-hash'); }catch(e){}
  if(!stored){
    const p2 = (document.getElementById('sg-pass2')||{}).value||'';
    if(p.length<6){ sgErr('Use at least 6 characters'); return; }
    if(p!==p2){ sgErr('The two passcodes do not match'); return; }
    try{ localStorage.setItem('dc:staff-hash', await staffHash(p)); }catch(e){ sgErr('Could not save on this device'); return; }
  }else if(await staffHash(p)!==stored){ sgErr('Incorrect passcode'); return; }
  try{ sessionStorage.setItem('dc:staff-ok','1'); }catch(e){}
  staffGateRender();
}
window.addEventListener('hashchange', ()=>{ if(STAFF_HASH_RE.test(location.hash)) openStaffGate(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && staffGateEl().classList.contains('show')) closeStaffGate(); });
document.getElementById('modal-overlay').addEventListener('click', (e)=>{
  if(e.target.id==='modal-overlay') closeModal();
});

["Tawheed is the single most foundational concept in Islamic belief — the conviction that Allah alone is worthy of worship, without partner or equal. Scholars traditionally divide it into three dimensions: oneness in Lordship, oneness in worship, and oneness in His names and attributes.","तौहीद इस्लामी अक़ीदे की सबसे बुनियादी चीज़ है — यह यक़ीन कि सिर्फ़ अल्लाह ही इबादत के लायक़ है, उसका कोई शरीक या बराबर नहीं। उलमा इसे आम तौर पर तीन हिस्सों में बाँटते हैं: रुबूबियत में एक होना, इबादत में एक होना, और उसके नामों और सिफ़ात में एक होना।","توحید اسلامی عقیدے کی سب سے بنیادی چیز ہے — یہ یقین کہ صرف اللہ ہی عبادت کے لائق ہے، اس کا کوئی شریک یا برابر نہیں۔ علماء اسے عموماً تین حصوں میں تقسیم کرتے ہیں: ربوبیت میں ایک ہونا، عبادت میں ایک ہونا، اور اس کے ناموں اور صفات میں ایک ہونا۔"],
["Belief in Islam rests on six pillars: Allah, His angels, His books, His messengers, the Day of Judgement, and divine decree. Together they form the framework through which a believer understands their place in creation.","इस्लाम में ईमान छह अरकान पर क़ायम है: अल्लाह, उसके फ़रिश्ते, उसकी किताबें, उसके रसूल, आख़िरत का दिन और तक़दीर। ये सब मिलकर वो बुनियाद बनाते हैं जिससे एक मोमिन कायनात में अपनी जगह को समझता है।","اسلام میں ایمان چھ ارکان پر قائم ہے: اللہ، اس کے فرشتے، اس کی کتابیں، اس کے رسول، آخرت کا دن اور تقدیر۔ یہ سب مل کر وہ بنیاد بناتے ہیں جس سے ایک مومن کائنات میں اپنی جگہ کو سمجھتا ہے۔"],
["The companions of the Prophet ﷺ carried the message of Islam forward with sincerity and sacrifice. Honouring their memory and studying their character is considered part of a healthy Islamic upbringing.","नबी ﷺ के सहाबा ने इख़्लास और क़ुर्बानी के साथ इस्लाम का पैग़ाम आगे बढ़ाया। उनकी याद का अदब और उनके किरदार का मुतालआ एक सेहतमंद इस्लामी तर्बियत का हिस्सा माना जाता है।","نبی ﷺ کے صحابہ نے اخلاص اور قربانی کے ساتھ اسلام کا پیغام آگے بڑھایا۔ ان کی یاد کا ادب اور ان کے کردار کا مطالعہ ایک صحت مند اسلامی تربیت کا حصہ مانا جاتا ہے۔"],
["Long before prophethood, the Prophet Muhammad ﷺ was known among his people as Al-Amin — the trustworthy. His early life offers a portrait of honesty, humility and quiet reflection.","नुबुव्वत से बहुत पहले भी नबी मुहम्मद ﷺ अपनी क़ौम में अल-अमीन — यानी अमानतदार — के नाम से जाने जाते थे। आपकी शुरुआती ज़िंदगी सच्चाई, इनकिसारी और ख़ामोश ग़ौर-ओ-फ़िक्र की तस्वीर पेश करती है।","نبوت سے بہت پہلے بھی نبی محمد ﷺ اپنی قوم میں الامین — یعنی امانت دار — کے نام سے جانے جاتے تھے۔ آپ کی ابتدائی زندگی سچائی، عاجزی اور خاموش غور و فکر کی تصویر پیش کرتی ہے۔"],
["Bid'ah refers to innovation in matters of religion. Scholars have long discussed how to distinguish genuine innovation from permissible new means of doing something already established.","बिदअत से मुराद दीन के मामलों में नई बात निकालना है। उलमा ने बहुत बहस की है कि असली नई ईजाद और किसी पहले से साबित काम को करने के जायज़ नए तरीक़ों में फ़र्क़ कैसे किया जाए।","بدعت سے مراد دین کے معاملات میں نئی بات نکالنا ہے۔ علماء نے طویل بحث کی ہے کہ اصل نئی ایجاد اور کسی پہلے سے ثابت کام کو کرنے کے جائز نئے طریقوں میں فرق کیسے کیا جائے۔"],
["Wudu is the ritual purification performed before prayer. It follows a set sequence — intention, washing the face, arms, wiping the head, and washing the feet — each step rooted in prophetic practice.","वुज़ू वो तहारत है जो नमाज़ से पहले की जाती है। इसकी एक तरतीब है — नीयत, चेहरा धोना, बाज़ू धोना, सर का मसह और पैर धोना — और हर क़दम की जड़ नबी ﷺ के तरीक़े में है।","وضو وہ طہارت ہے جو نماز سے پہلے کی جاتی ہے۔ اس کی ایک ترتیب ہے — نیت، چہرہ دھونا، بازو دھونا، سر کا مسح اور پاؤں دھونا — اور ہر قدم کی بنیاد نبی ﷺ کے طریقے میں ہے۔"],
["Zakat is calculated at 2.5% of wealth that has been held above the nisab threshold for one lunar year. This includes cash, gold, silver, and trade goods, but generally excludes a primary residence or personal-use items.","ज़कात उस माल का 2.5% है जो निसाब से ऊपर पूरे एक चाँद के साल तक आपके पास रहा हो। इसमें नक़द, सोना, चाँदी और तिजारती माल शामिल हैं, लेकिन आम तौर पर रहने का मकान और निजी इस्तेमाल की चीज़ें शामिल नहीं होतीं।","زکوٰۃ اس مال کا 2.5% ہے جو نصاب سے اوپر پورے ایک قمری سال تک آپ کے پاس رہا ہو۔ اس میں نقد، سونا، چاندی اور تجارتی مال شامل ہیں، لیکن عموماً رہائشی مکان اور ذاتی استعمال کی چیزیں شامل نہیں ہوتیں۔"],
["Tajweed is the set of rules governing correct Quranic pronunciation. Beginners usually start with the articulation points of letters before moving on to elongation and stopping rules.","तजवीद क़ुरआन को सही तलफ़्फ़ुज़ से पढ़ने के क़ायदों का नाम है। शुरुआत करने वाले आम तौर पर पहले हरूफ़ के मख़ारिज सीखते हैं, फिर मद और वक़्फ़ के क़ायदों की तरफ़ बढ़ते हैं।","تجوید قرآن کو صحیح تلفظ سے پڑھنے کے قاعدوں کا نام ہے۔ ابتدا کرنے والے عموماً پہلے حروف کے مخارج سیکھتے ہیں، پھر مد اور وقف کے قاعدوں کی طرف بڑھتے ہیں۔"],
["Recited in every unit of prayer, Al-Fatiha is often described as the essence of the Quran — a concise expression of praise, guidance, and supplication.","नमाज़ की हर रकअत में पढ़ी जाने वाली सूरह अल-फ़ातिहा को अक्सर क़ुरआन का ख़ुलासा कहा जाता है — यह हम्द, हिदायत और दुआ का मुख़्तसर बयान है।","نماز کی ہر رکعت میں پڑھی جانے والی سورۃ الفاتحہ کو اکثر قرآن کا خلاصہ کہا جاتا ہے — یہ حمد، ہدایت اور دعا کا مختصر بیان ہے۔"],
["After the passing of the Prophet ﷺ, four companions led the Muslim community in succession: Abu Bakr, Umar, Uthman, and Ali (may Allah be pleased with them all). Their era is remembered for justice and rapid consolidation of the early Muslim state.","नबी ﷺ के विसाल के बाद चार सहाबा ने बारी-बारी से मुस्लिम उम्मत की क़यादत की: अबू बक्र, उमर, उस्मान और अली (अल्लाह उन सबसे राज़ी हो)। उनका दौर अद्ल और शुरुआती इस्लामी रियासत के तेज़ी से मज़बूत होने के लिए याद किया जाता है।","نبی ﷺ کے وصال کے بعد چار صحابہ نے باری باری مسلم امت کی قیادت کی: ابوبکر، عمر، عثمان اور علی (اللہ ان سب سے راضی ہو)۔ ان کا دور عدل اور ابتدائی اسلامی ریاست کے تیزی سے مضبوط ہونے کے لیے یاد کیا جاتا ہے۔"],
["Between the 8th and 13th centuries, Muslim scholars made lasting contributions to mathematics, medicine, astronomy and philosophy, often building on and preserving earlier Greek and Indian knowledge.","आठवीं से तेरहवीं सदी के बीच मुस्लिम उलमा ने गणित, तिब्ब, फ़लकियात और फ़लसफ़े में अहम ख़िदमात अंजाम दीं, और अक्सर यूनानी और हिंदुस्तानी इल्म को आगे बढ़ाया और महफ़ूज़ रखा।","آٹھویں سے تیرہویں صدی کے درمیان مسلم علماء نے ریاضی، طب، فلکیات اور فلسفے میں اہم خدمات انجام دیں، اور اکثر یونانی اور ہندوستانی علم کو آگے بڑھایا اور محفوظ رکھا۔"],
["Understanding this topic well takes patience and the guidance of qualified teachers. Treat this overview as a starting point for further study, not a replacement for it.","इस विषय को अच्छी तरह समझने के लिए सब्र और माहिर उस्तादों की रहनुमाई चाहिए। इस मुख़्तसर जायज़े को आगे के मुतालए की शुरुआत समझें, उसका बदल नहीं।","اس موضوع کو اچھی طرح سمجھنے کے لیے صبر اور ماہر اساتذہ کی رہنمائی درکار ہے۔ اس مختصر جائزے کو مزید مطالعے کی ابتدا سمجھیں، اس کا متبادل نہیں۔"],
["Kaffara fasts must be consecutive; if you miss a day (other than for menstruation) the count restarts. Each broken fast needs its own kaffara in some views — ask a scholar.","कफ़्फ़ारे के रोज़े लगातार होने चाहिए; अगर एक दिन भी छूटा (माहवारी के सिवा) तो गिनती दोबारा शुरू होगी। कुछ आरा के मुताबिक़ हर तोड़े हुए रोज़े का अलग कफ़्फ़ारा है — किसी आलिम से पूछें।","کفارے کے روزے لگاتار ہونے چاہییں؛ اگر ایک دن بھی چھوٹا (ماہواری کے سوا) تو گنتی دوبارہ شروع ہوگی۔ بعض آراء کے مطابق ہر توڑے ہوئے روزے کا الگ کفارہ ہے — کسی عالم سے پوچھیں۔"],

/* ============ SETTINGS DRAWER (language · theme · text size · comfort · staff) ============ */
const PREF_DEFAULTS = { theme:'light', size:100, haptics:true, calm:false };
let prefs = { ...PREF_DEFAULTS };
let adminRevealed = false;
try{ adminRevealed = sessionStorage.getItem('dc:admin-visible')==='1'; }catch(e){}
let _verTaps = [];
const _vibrate = navigator.vibrate ? navigator.vibrate.bind(navigator) : null;
if(_vibrate){ try{ navigator.vibrate = p => prefs.haptics ? _vibrate(p) : false; }catch(e){} }
const _sysDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
if(_sysDark && _sysDark.addEventListener) _sysDark.addEventListener('change', ()=>{ if(prefs.theme==='auto') applyPrefs(true); });

function applyPrefs(rerender){
  appDark = prefs.theme==='dark' || (prefs.theme==='auto' && !!(_sysDark && _sysDark.matches));
  const phone = document.getElementById('phone');
  if(phone){ phone.style.setProperty('--ui-zoom', String(prefs.size/100)); phone.classList.toggle('calm', !!prefs.calm); }
  if(rerender) renderApp();
}
function savePrefs(){ try{ storageAPI.set('app-prefs', JSON.stringify(prefs), false); }catch(e){} }
async function loadPrefs(){
  try{
    const r = await storageAPI.get('app-prefs', false);
    const p = r && r.value ? JSON.parse(r.value) : null;
    if(p && typeof p==='object'){
      if(['light','dark','auto'].includes(p.theme)) prefs.theme = p.theme;
      if([90,100,115].includes(p.size)) prefs.size = p.size;
      prefs.haptics = p.haptics!==false; prefs.calm = !!p.calm;
    }
  }catch(e){}
  applyPrefs(false);
}
function setPref(key, val){
  prefs[key] = val; savePrefs();
  if(key==='haptics' && val && _vibrate) _vibrate(15);
  applyPrefs(key==='theme' || key==='calm');
  renderSettings();
}
function resetPrefs(){
  prefs = { ...PREF_DEFAULTS }; savePrefs(); applyPrefs(true);
  if(LANG!=='en') setLang('en');
  renderSettings(); showToast('Settings reset');
}

function ensureDrawer(){
  if(document.getElementById('sd')) return;
  const phone = document.getElementById('phone'); if(!phone) return;
  const scrim = document.createElement('div'); scrim.id = 'sd-scrim'; scrim.className = 'sd-scrim'; scrim.addEventListener('click', closeSettings);
  const d = document.createElement('aside'); d.id = 'sd'; d.className = 'sd';
  d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true'); d.setAttribute('aria-label','Settings');
  phone.appendChild(scrim); phone.appendChild(d);
}
function settingsHtml(){
  const seg = (items, cur, fn) => `<div class="sd-seg" style="grid-template-columns:repeat(${items.length},1fr);">${items.map(it=>
    `<button class="${cur===it.v?'on':''}" aria-pressed="${cur===it.v}" onclick="${fn}">${it.i||''}<span>${it.l}</span></button>`.replace('__V__', it.v)).join('')}</div>`;
  const sw = (id, on, title, sub, action) => `<button class="sd-row" role="switch" aria-checked="${on}" onclick="${action}">
      <div class="tx"><b>${title}</b><span class="s">${sub}</span></div><span class="sd-sw"></span></button>`;
  const row = (ic, title, sub, action) => `<button class="sd-row" onclick="${action}"><span class="ico">${icon(ic,17,'var(--forest-deep)')}</span>
      <div class="tx"><b>${title}</b><span class="s">${sub}</span></div>${icon('chevronRight',16,'var(--muted)')}</button>`;
  const sizeGlyph = px => `<span style="font-family:'Fraunces',serif;font-size:${px}px;line-height:1;">Aa</span>`;
  return `
  <div class="sd-head"><h2>Settings</h2><button class="iconbtn" onclick="closeSettings()" aria-label="Close">${icon('close',20)}</button></div>
  <div class="sd-body">
    <div class="sd-sec"><div class="sd-t">Language</div>
      <div class="sd-seg" style="grid-template-columns:repeat(3,1fr);" dir="ltr">${LANGS.map(x=>`<button class="${LANG===x.id?'on':''}" aria-pressed="${LANG===x.id}" onclick="setLang('${x.id}'); renderSettings();"><span>${x.name}</span></button>`).join('')}</div>
    </div>
    <div class="sd-sec"><div class="sd-t">Theme</div>
      ${seg([{v:'light',l:'Light',i:icon('sun',18)},{v:'dark',l:'Dark',i:icon('moon',18)},{v:'auto',l:'Auto',i:icon('settings',18)}], prefs.theme, "setPref('theme','__V__')")}
    </div>
    <div class="sd-sec"><div class="sd-t">Text size</div>
      ${seg([{v:90,l:'Small',i:sizeGlyph(14)},{v:100,l:'Normal',i:sizeGlyph(17)},{v:115,l:'Large',i:sizeGlyph(21)}], prefs.size, "setPref('size',__V__)")}
    </div>
    <div class="sd-sec"><div class="sd-t">Comfort</div>
      ${sw('haptics', prefs.haptics, 'Vibration', 'Feel a tap on Tasbih and counters', `setPref('haptics', ${!prefs.haptics})`)}
      ${sw('calm', prefs.calm, 'Calm mode', 'Fewer animations and effects', `setPref('calm', ${!prefs.calm})`)}
    </div>
    <div class="sd-sec"><div class="sd-t">Shortcuts</div>
      ${row('user', 'My account', 'Profile and saved items', "closeSettings(); selectTab('account')")}
      ${row('message', 'Private message to team', 'Only the admin can read it', "closeSettings(); vaultSendPrompt()")}
    </div>
    <div class="sd-sec"><div class="sd-t">Staff</div>
      ${row('users', 'Staff login', 'Scholars and masjid staff', "openStaffFromSettings('staff')")}
      ${adminRevealed ? `${row('dashboard', 'Admin panel', 'Content, live stream, notices', "openStaffFromSettings('admin')")}
      <button class="sd-link" onclick="hideAdminOption()">Hide admin option</button>` : ''}
    </div>
    <div class="sd-about" onclick="versionTap()"><div class="sd-about-mark">${brandMarkHtml(48)}</div><b>${escapeHtml(appName())}</b><span>Version</span> <span>1.0</span></div>
    <button class="sd-link" onclick="resetPrefs()">Reset settings</button>
  </div>`;
}
function renderSettings(){ const d = document.getElementById('sd'); if(d) d.innerHTML = settingsHtml(); }
let _sdReturn = null;
function openSettings(){
  ensureDrawer(); renderSettings();
  _sdReturn = document.activeElement;
  document.getElementById('sd-scrim').classList.add('open');
  document.getElementById('sd').classList.add('open');
  setTimeout(()=>{ const b = document.querySelector('#sd .sd-head .iconbtn'); if(b) b.focus(); }, 320);
}
function closeSettings(){
  const d = document.getElementById('sd'); if(!d) return;
  d.classList.remove('open'); document.getElementById('sd-scrim').classList.remove('open');
  if(_sdReturn && _sdReturn.focus){ try{ _sdReturn.focus(); }catch(e){} } _sdReturn = null;
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ const d = document.getElementById('sd'); if(d && d.classList.contains('open')) closeSettings(); } });

/* Staff is always visible; Admin stays hidden until the version line is tapped 7 times.
   (This only hides the button — real protection is the passcode / Firebase staff role.) */
function versionTap(){
  const now = Date.now();
  _verTaps = _verTaps.filter(x=>now-x<4000); _verTaps.push(now);
  if(_verTaps.length>=7 && !adminRevealed){
    _verTaps = []; adminRevealed = true;
    try{ sessionStorage.setItem('dc:admin-visible','1'); }catch(e){}
    renderSettings(); showToast('Admin option unlocked');
  }
}
function hideAdminOption(){
  adminRevealed = false; try{ sessionStorage.removeItem('dc:admin-visible'); }catch(e){}
  renderSettings(); showToast('Admin option hidden');
}
function openStaffFromSettings(mode){
  closeSettings();
  const area = mode==='admin' ? 'admin' : 'scholar';
  setTimeout(()=>{ if(staffAllowed(area)) openStaffArea(area); else openStaffGate(mode); }, 220);
}

/* ============ BRANDING (admin-editable logo / name / tagline) + animated logo screen ============ */
const BRAND_KEY = 'dc:brand';
function brand(){
  const s = (typeof DATA!=='undefined' && DATA && DATA.settings) || {};
  const secs = parseInt(s.splashSecs, 10);
  return {
    name: s.appName || 'Deen Companion',
    tagline: (s.tagline!==undefined && s.tagline!==null) ? s.tagline : 'Knowledge that illuminates the heart',
    logo: s.logo || '',
    secs: (secs>=2 && secs<=10) ? secs : 5
  };
}
function readBrandCache(){ try{ const c = JSON.parse(localStorage.getItem(BRAND_KEY)||'null'); return (c && c.name) ? c : null; }catch(e){ return null; } }
function brandMarkHtml(px, color){
  const b = brand();
  if(b.logo) return `<img class="brand-logo" alt="" src="${b.logo}" style="width:${px}px;height:${px}px;">`;
  return icon('moon', Math.max(14, px-4), color || 'var(--emerald)');
}

const SPLASH = { start:0, secs:5, initDone:false, hidden:false, sig:'' };
function splTr(s, lang){ return (lang && lang!=='en' && I18N[s] && I18N[s][lang]) ? I18N[s][lang] : s; }
function splashInner(b, lang){
  const name = splTr(b.name, lang), tag = splTr(b.tagline, lang);
  const stars = Array.from({length:30}, (_, i)=>{

  }).join('');

    <div class="sp2-logo">

      <svg class="sp2-geo" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="g1" cx="100" cy="100" r="94" pathLength="100"/>
        <rect class="g2" x="36" y="36" width="128" height="128" rx="6" pathLength="100"/>
        <rect class="g2 b" x="36" y="36" width="128" height="128" rx="6" pathLength="100" transform="rotate(45 100 100)"/>
        <circle class="g3" cx="100" cy="100" r="76" pathLength="100"/>
      </svg>
      <span class="sp2-orbit" aria-hidden="true"><i></i><i></i><i></i></span>

function splashMotionOff(){
  let calm = false; try{ calm = !!JSON.parse(localStorage.getItem('dc:app-prefs')||'{}').calm; }catch(e){}
  const rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  return calm || rm;
}
function splashLang(){ try{ const l = localStorage.getItem('dc:app-lang'); return (l==='hi'||l==='ur') ? l : 'en'; }catch(e){ return 'en'; } }
function splashStart(){
  const el = document.getElementById('splash'), phone = document.getElementById('phone');
  if(!el) return;
  const b = readBrandCache() || brand();
  const still = splashMotionOff();
  SPLASH.secs = still ? 1.5 : b.secs; SPLASH.start = performance.now(); SPLASH.hidden = false; SPLASH.initDone = false;
  SPLASH.sig = [b.name, b.tagline, b.logo].join('\u0001') + splashLang();
  el.className = 'splash' + (still ? ' sp-static' : '');
  el.innerHTML = splashInner({ ...b, secs: SPLASH.secs }, splashLang());
  window.__booting = true; if(phone) phone.classList.add('booting');
  setTimeout(splashTryHide, SPLASH.secs*1000 + 40);
  setTimeout(()=>{ SPLASH.initDone = true; splashTryHide(); }, SPLASH.secs*1000 + 9000);   // safety net if startup stalls
}
function splashFinish(){ SPLASH.initDone = true; splashTryHide(); }
function splashTryHide(){
  if(SPLASH.hidden || !SPLASH.initDone) return;
  if(performance.now() - SPLASH.start < SPLASH.secs*1000 - 30) return;
  SPLASH.hidden = true;
  const el = document.getElementById('splash'), phone = document.getElementById('phone');
  if(el) el.classList.add('leaving');
  setTimeout(()=>{ window.__booting = false; if(phone) phone.classList.remove('booting'); }, 320);   // home animations start as the logo screen fades
  setTimeout(()=>{ if(el){ el.classList.remove('leaving'); el.classList.add('hide'); } }, 780);
}
function splashRefresh(){
  // data finished loading after the logo screen began: swap text / logo in place if they differ from the cached copy
  if(SPLASH.hidden) return;
  const b = brand(), lang = splashLang();
  const sig = [b.name, b.tagline, b.logo].join('\u0001') + lang;
  if(sig===SPLASH.sig) return;
  SPLASH.sig = sig;
  const el = document.getElementById('splash'); if(!el) return;
  const bar = el.querySelector('.sp2-bar span'), cur = bar ? getComputedStyle(bar).width : null;
  el.innerHTML = splashInner({ ...b, secs: Math.max(0.5, (SPLASH.secs*1000 - (performance.now()-SPLASH.start))/1000) }, lang);
}
function previewSplash(){
  const old = document.getElementById('splash-preview'); if(old) old.remove();
  const b = brand(), still = splashMotionOff(), secs = still ? 1.5 : b.secs;
  const ov = document.createElement('div'); ov.id = 'splash-preview'; ov.className = 'splash sp-prev' + (still ? ' sp-static' : '');
  ov.innerHTML = splashInner({ ...b, secs }, LANG);
  const done = ()=>{ ov.classList.add('leaving'); setTimeout(()=>ov.remove(), 760); };
  ov.addEventListener('click', done);
  document.body.appendChild(ov);
  setTimeout(done, secs*1000);
}

/* ---- keep favicon, install icon, desktop panel and splash in step with the admin's branding ---- */
const _brandDefaults = {};
function logoIcons(src){
  return new Promise(res=>{
    const im = new Image();
    im.onload = ()=>{
      const mk = n => {
        const c = document.createElement('canvas'); c.width = c.height = n;
        const g = c.getContext('2d'); g.fillStyle = '#0B231D'; g.fillRect(0, 0, n, n);
        const k = Math.min(n*.78/(im.width||n), n*.78/(im.height||n)), w = (im.width||n)*k, h = (im.height||n)*k;
        g.drawImage(im, (n-w)/2, (n-h)/2, w, h); return c.toDataURL('image/png');
      };
      try{ res([{ src:mk(192), sizes:'192x192', type:'image/png', purpose:'any maskable' }, { src:mk(512), sizes:'512x512', type:'image/png', purpose:'any maskable' }]); }catch(e){ res(null); }
    };
    im.onerror = ()=>res(null); im.src = src;
  });
}
async function brandManifest(b){
  try{
    const link = document.querySelector('link[rel="manifest"]'); if(!link) return;
    if(!_brandDefaults.manifest){ const h = link.getAttribute('href'); _brandDefaults.manifest = JSON.parse(decodeURIComponent(h.slice(h.indexOf(',')+1))); }
    const m = JSON.parse(JSON.stringify(_brandDefaults.manifest));
    m.name = b.name; m.short_name = b.name.length>12 ? b.name.slice(0, 12) : b.name;
    if(b.logo){ const ic = await logoIcons(b.logo); if(ic) m.icons = ic; }
    link.setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m)));
  }catch(e){}
}
let _brandSig = '';
function brandSync(){
  const b = brand(), sig = [b.name, b.tagline, b.secs, b.logo].join('\u0001');
  if(sig===_brandSig) return;
  _brandSig = sig;
  try{ localStorage.setItem(BRAND_KEY, JSON.stringify(b)); }catch(e){}
  try{ document.title = b.name; }catch(e){}
  const dn = document.getElementById('desk-name'); if(dn) dn.textContent = b.name;
  const dl = document.querySelector('.ds-logo img');
  if(dl){ if(!dl.dataset.def) dl.dataset.def = dl.getAttribute('src'); dl.setAttribute('src', b.logo || dl.dataset.def); }
  document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(l=>{
    if(!l.dataset.def){ l.dataset.def = l.getAttribute('href'); l.dataset.ty = l.getAttribute('type') || ''; }
    l.setAttribute('href', b.logo || l.dataset.def);
    if(b.logo) l.removeAttribute('type'); else if(l.dataset.ty) l.setAttribute('type', l.dataset.ty);
  });
  brandManifest(b);
  splashRefresh();
}

function logoToDataUrl(file){
  return new Promise((res, rej)=>{
    if(!/^image\//.test(file.type)) return rej(new Error('Please choose an image file'));
    const fr = new FileReader();
    fr.onload = ()=>{
      const im = new Image();
      im.onload = ()=>{
        const W = im.naturalWidth || im.width || 384, H = im.naturalHeight || im.height || 384;
        const k = Math.min(1, 384 / Math.max(W, H));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(W*k)); c.height = Math.max(1, Math.round(H*k));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        let out = c.toDataURL('image/png');
        if(out.length > 140000) out = c.toDataURL('image/webp', 0.88);
        if(out.length > 140000) out = c.toDataURL('image/webp', 0.7);
        if(out.length > 300000) return rej(new Error('That image is too detailed — try a simpler logo'));
        res(out);
      };
      im.onerror = ()=>rej(new Error('That file could not be used as an image'));
      im.src = fr.result;
    };
    fr.onerror = ()=>rej(new Error('Could not read the file'));
    fr.readAsDataURL(file);
  });
}
async function onBrandLogoPick(ev){

  try{ DATA.settings.logo = await logoToDataUrl(f); saveBrand('Logo updated'); }
  catch(e){ showToast(e.message || 'Could not use that image'); }
  ev.target.value = '';
}

/* ---- motion: ambient glow on Home, sliding nav pill, scroll-reveal ---- */
let _pillPrev = null, _lastTab = null, _revealIO = null;
function ambientHtml(){
  const dots = Array.from({length:9}, (_, i)=>`<u style="--x:${(8 + i*10.5 + (i%2?3:-2)).toFixed(1)}%;--d:${(8+ (i*1.7)%5).toFixed(1)}s;--dl:${(-(i*1.3)).toFixed(1)}s"></u>`).join('');
  return `<div class="ambient" aria-hidden="true"><i></i><i></i><i></i>${dots}</div>`;
}
function motionAfterRender(){
  const root = document.getElementById('screen-root'); if(!root) return;
  const sc = root.querySelector('.scroll');
  if(appScreen.name==='home' && sc && !sc.querySelector(':scope > .ambient')) sc.insertAdjacentHTML('afterbegin', ambientHtml());
  // nav pill slides from its previous spot instead of jumping
  const pill = root.querySelector('.bottomnav .nav-pill');
  if(pill){
    const prop = LANG==='ur' ? 'right' : 'left', target = pill.style[prop];
    if(_pillPrev && _pillPrev.prop===prop && _pillPrev.val!==target){ pill.style[prop] = _pillPrev.val; void pill.offsetWidth; pill.style[prop] = target; }
    _pillPrev = { prop, val: target };
  }
  if(_lastTab!==null && _lastTab!==appTab){ const a = root.querySelector('.navbtn.active'); if(a) a.classList.add('pop'); }
  _lastTab = appTab;
  // items below the fold animate in as you scroll to them
  try{
    if(_revealIO){ _revealIO.disconnect(); _revealIO = null; }
    if(!sc || !('IntersectionObserver' in window)) return;
    const edge = sc.getBoundingClientRect().bottom - 20, pending = [];
    sc.querySelectorAll('.anim-item, .card-in').forEach(el=>{ if(el.getBoundingClientRect().top > edge){ el.style.animationPlayState = 'paused'; pending.push(el); } });
    if(!pending.length) return;
    _revealIO = new IntersectionObserver(es=>{
      es.forEach(en=>{ if(en.isIntersecting){ const el = en.target; el.style.animationDelay = '0s'; el.style.animationPlayState = ''; _revealIO.unobserve(el); } });
    }, { root: sc, threshold: 0.08 });
    pending.forEach(el=>_revealIO.observe(el));
  }catch(e){}
}

function hijriMonthTr(name){
  const k = String(name).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[`'’ʻʿʾ]/g,'').replace(/-/g,' ').replace(/\s+/g,' ').trim();

  if(/muharram/.test(k)) i=0; else if(/safar/.test(k)) i=1;
  else if(/rabi/.test(k)) i = /(thani|ii\b)/.test(k) ? 3 : 2;
  else if(/jumad/.test(k)) i = /(akhir|thani|ii\b)/.test(k) ? 5 : 4;
  else if(/rajab/.test(k)) i=6; else if(/shaban/.test(k)) i=7; else if(/ramadan/.test(k)) i=8; else if(/shawwal/.test(k)) i=9;
  else if(/(qidah|qadah|qada)/.test(k)) i=10; else if(/hijjah|hijja/.test(k)) i=11;
  if(i<0) return null;
  const HI = ['मुहर्रम','सफ़र','रबीउल अव्वल','रबीउल आख़िर','जमादिउल ऊला','जमादिउस्सानी','रजब','शाबान','रमज़ान','शव्वाल','ज़ीक़ादा','ज़िलहिज्जा'];
  const UR = ['محرم','صفر','ربیع الاول','ربیع الثانی','جمادی الاولیٰ','جمادی الثانی','رجب','شعبان','رمضان','شوال','ذوالقعدہ','ذوالحجہ'];
  return LANG==='hi' ? HI[i] : UR[i];
}
function _gdate(str, opts){

/* ---- core translate helpers ---- */
function trStr(s){
  if(LANG==='en' || s==null) return s;
  const str = String(s), core = str.trim();
  if(!core) return str;
  const at = str.indexOf(core);
  const lead = str.slice(0, at), tail = str.slice(at + core.length);
  const key = core.replace(/\s+/g,' ');
  if(Object.prototype.hasOwnProperty.call(I18N, key)) return lead + I18N[key][LANG] + tail;
  for(let i=0;i<I18N_PATTERNS.length;i++){
    const m = key.match(I18N_PATTERNS[i][0]);
    if(m) return lead + I18N_PATTERNS[i][1](m, LANG) + tail;
  }
  return str;
}
/* template with {placeholders}; works in every language */
function tf(key, vars){
  let s = (LANG!=='en' && Object.prototype.hasOwnProperty.call(I18N,key)) ? I18N[key][LANG] : key;
  if(vars) Object.keys(vars).forEach(k=>{ s = s.split('{'+k+'}').join(vars[k]); });
  return s;
}
function langLocale(){ return LANG==='hi' ? 'hi-IN' : (LANG==='ur' ? 'ur-PK' : undefined); }

/* ---- DOM translator (text nodes + placeholder/title/aria-label) ---- */
const TR_SKIP = { SCRIPT:1, STYLE:1, TEXTAREA:1, NOSCRIPT:1 };
const TR_ATTRS = ['placeholder','title','aria-label'];
function trTextNode(n){
  if(n.__en===undefined || (n.nodeValue!==n.__tr)) n.__en = n.nodeValue;
  const out = LANG==='en' ? n.__en : trStr(n.__en);
  if(out!==n.nodeValue) n.nodeValue = out;
  n.__tr = out;
  if(LANG==='ur' && n.parentElement && /^\s*\d{1,2}:\d{2}(\s?(AM|PM))?\s*$/.test(out)) n.parentElement.setAttribute('dir','ltr');
}
function trAttrs(el){
  if(!el.getAttribute) return;
  TR_ATTRS.forEach(a=>{
    if(!el.hasAttribute(a)) return;
    el.__enA = el.__enA || {}; el.__trA = el.__trA || {};
    const cur = el.getAttribute(a);
    if(el.__enA[a]===undefined || cur!==el.__trA[a]) el.__enA[a] = cur;
    const out = LANG==='en' ? el.__enA[a] : trStr(el.__enA[a]);
    if(out!==cur) el.setAttribute(a, out);
    el.__trA[a] = out;
  });
}
function translateNode(root){
  if(!root) return;
  if(root.nodeType===3){ if(root.parentNode && !TR_SKIP[root.parentNode.tagName]) trTextNode(root); return; }
  if(root.nodeType!==1) return;
  trAttrs(root);
  if(TR_SKIP[root.tagName]) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
  let n;
  while((n = w.nextNode())){
    if(n.nodeType===3){ if(n.parentNode && !TR_SKIP[n.parentNode.tagName]) trTextNode(n); }
    else trAttrs(n);
  }
}
let trObserver = null, trBusy = false;
function startLangObserver(){
  const phone = document.getElementById('phone');
  if(!phone || trObserver) return;
  trObserver = new MutationObserver(muts=>{
    if(trBusy || LANG==='en') return;
    trBusy = true;
    try{
      muts.forEach(m=>{
        if(m.type==='childList') m.addedNodes.forEach(translateNode);
        else if(m.type==='characterData') translateNode(m.target);
        else if(m.type==='attributes') trAttrs(m.target);
      });
    } finally { trBusy = false; trObserver.takeRecords(); }
  });
  trObserver.observe(phone, { childList:true, subtree:true, characterData:true });
}
function applyLangAttrs(){
  const phone = document.getElementById('phone');
  if(phone){
    phone.setAttribute('data-lang', LANG);
    phone.setAttribute('dir', LANG==='ur' ? 'rtl' : 'ltr');
    phone.setAttribute('lang', LANG==='ur' ? 'ur' : (LANG==='hi' ? 'hi' : 'en'));
  }
  document.documentElement.setAttribute('lang', LANG==='ur' ? 'ur' : (LANG==='hi' ? 'hi' : 'en'));
  document.querySelectorAll('[data-setlang]').forEach(b=> b.classList.toggle('on', b.getAttribute('data-setlang')===LANG));
}
function translateApp(){
  applyLangAttrs();
  const phone = document.getElementById('phone');
  if(phone){ trBusy = true; try{ translateNode(phone); } finally { trBusy = false; if(trObserver) trObserver.takeRecords(); } }
}
function setLang(l){
  if(!LANGS.some(x=>x.id===l)) return;
  LANG = l;
  try{ storageAPI.set('app-lang', l, false); }catch(e){}
  renderApp();
  applyLangAttrs();
  try{ renderAdmin(); }catch(e){}
  try{ welcomeRender(); }catch(e){}
}

function p2pLs(k, v){
  try{
    if(v===undefined) return localStorage.getItem(k);

  }catch(e){}
  return null;
}
async function p2pIdentity(){
  let id = null;

const FB_RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function adminExists() { return exists(/databases/$(database)/documents/config/admin); }
    function isAdmin() { return signedIn() && adminExists() && get(/databases/$(database)/documents/config/admin).data.uid == request.auth.uid; }
    function isStaff() { return isAdmin() || (signedIn() && exists(/databases/$(database)/documents/staff/$(request.auth.uid))); }
    function myScholarId() { return get(/databases/$(database)/documents/staff/$(request.auth.uid)).data.get('scholarId', ''); }

    match /config/admin {
      allow read: if signedIn();
      allow create: if signedIn() && request.resource.data.uid == request.auth.uid && !adminExists();
      allow update, delete: if isAdmin();
    }
    match /config/app {
      allow read: if signedIn();
      allow write: if isAdmin();
    }
    match /staff/{id} {
      allow read: if signedIn();
      allow write: if isAdmin();
    }

      allow create: if isAdmin()

        || (signedIn() && request.resource.data.type == 'qa' && request.resource.data.askerUid == request.auth.uid && request.resource.data.answered == false);
      allow update: if isAdmin()
        || (isStaff() && resource.data.type in ['articles', 'qa'] && request.resource.data.type in ['articles', 'qa'])
        || (isStaff() && resource.data.type == 'scholars' && myScholarId() == resource.data.id);
      allow delete: if isAdmin() || (isStaff() && resource.data.type in ['articles', 'qa']);
    }
    match /live/current {
      allow read: if signedIn();
      allow write: if isStaff();
      match /rtc/{rid} {
        allow read: if signedIn();
        allow create: if signedIn() && request.resource.data.uid == request.auth.uid;
        allow update, delete: if isStaff() || (signedIn() && resource.data.uid == request.auth.uid);
      }
    }
    match /live_chat/{id} {
      allow read: if signedIn();

      allow read, delete: if isAdmin();
    }
  }
}`;
function fbCfgGet(){
  try{ const raw = p2pLs('dc:fb-config'); if(raw){ const o = JSON.parse(raw); if(o && o.apiKey) return o; } }catch(e){}
  return (FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) ? FIREBASE_CONFIG : null;
}
function fbParseConfig(txt){
  const m = /\{[\s\S]*\}/.exec(String(txt||''));
  if(!m) throw new Error('Paste the whole firebaseConfig block from Firebase');
  let s = m[0].replace(/(^|\s)\/\/.*$/gm, '$1');
  let obj;
  try{ obj = JSON.parse(s); }
  catch(e){
    s = s.replace(/'/g, '"').replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":').replace(/,(\s*\})/g, '$1');
    try{ obj = JSON.parse(s); }catch(e2){ throw new Error('Could not read that — copy the block exactly as Firebase shows it'); }
  }
  if(!obj || typeof obj.apiKey!=='string' || typeof obj.projectId!=='string') throw new Error('apiKey and projectId are missing in what you pasted');
  const keep = {};
  ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'].forEach(k=>{ if(typeof obj[k]==='string') keep[k] = obj[k]; });
  return keep;
}
function fbLoadScript(src){
  return new Promise((res, rej)=>{
    const el = document.createElement('script'); el.src = src; el.onload = res;
    el.onerror = ()=>rej(new Error('Could not load Firebase — check the internet connection'));
    document.head.appendChild(el);
  });
}

    await fbLoadSdk();

    const auth = firebase.auth(), db = firebase.firestore();

    await new Promise(r=>{ const un = auth.onAuthStateChanged(()=>{ un(); r(); }); });
    if(!auth.currentUser) await auth.signInAnonymously();
    const identity = await p2pIdentity();
    const n = { fire:true, uid:auth.currentUser.uid, me:identity, netPub:'', _admin:null, _staff:null, _role:null,
      roleOf(){ return this._role; }, peerCount(){ return 0; }, exportOps(){ return '{"ops":[]}'; }, async importOps(){ return 0; } };
    const recompute = ()=>{
      const a = n._admin, st = n._staff;

      else if(st && (st.role==='admin' || st.role==='scholar')) r = Object.assign({}, st, { master:false });

    }catch(e){ FB.err = fbFriendlyError(e); }
    recompute();
    FB.net = n; FB.db = db; FB.auth = auth; FB.fire = true; FB.cfg = { projectId:cfg.projectId }; FB.on = true;
    DATA.live.isLive = false; DATA.live.viewers = 0; DATA.live.mode = 'link';
    _liveRemoteSig = liveSig(DATA.live);
    _liveRemoteObj = JSON.parse(JSON.stringify(LIVE_FIELDS.reduce((o,k2)=>{ o[k2] = DATA.live[k2]===undefined ? null : DATA.live[k2]; return o; }, {})));
    liveChatMessages = [];
    const name = p2pLs('dc:p2p-name');
    FB.user = name ? p2pMakeUser(name) : null;
    FB._roleSig = JSON.stringify(n.roleOf()||null);
    const changed = ()=>{
      recompute();

      if(sig!==FB._roleSig){ FB._roleSig = sig; FB.staffList = undefined; if(FB.ready) fbOnAuth(); }
      else{ try{ if(_staffView==='admin' && adminSection==='firebase') renderAdmin(); }catch(e){} }
    };
    aRef.onSnapshot(sn=>{ n._admin = sn.exists ? sn.data() : null; changed(); }, ()=>{});
    sRef.onSnapshot(sn=>{ n._staff = sn.exists ? sn.data() : null; changed(); }, ()=>{});
    db.collection('config').doc('app').onSnapshot(sn=>{ FB.appCfg = sn.exists ? sn.data() : null; updateCheck(); }, ()=>{});
    await fbOnAuth();
    FB.ready = true;
    setTimeout(()=>{
      const r = FB.net && FB.net.roleOf();
      if(r && r.master && !p2pLs('dc:p2p-backed') && confirm('You are the admin. Copy your backup key now? If you lose this phone without it, you can no longer open the sealed vault or private questions.')) p2pBackup();
    }, 2500);
    return true;
  }catch(e){ FB.err = e.message || String(e); FB.on = false; FB.fire = false; return false; }
}

async function fbDownloadBuild(){
  try{
    const c = fbCfgGet(); if(!c) throw new Error('Save your Firebase config first');
    const r = await fetch(location.href.split('#')[0]);
    if(!r.ok) throw new Error('Could not read the app file');
    let t = await r.text();
    const re = /const FIREBASE_CONFIG = (null|\{[^\n]*\});/;
    if(!re.test(t)) throw new Error('This file cannot be prepared automatically');
    t = t.replace(re, ()=>'const FIREBASE_CONFIG = '+JSON.stringify(c)+';');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([t], { type:'text/html' })); a.download = 'index.html';
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    showToast('Done — upload this index.html to your hosting');
  }catch(e){
    showToast(location.protocol==='file:' ? 'Open the app from your website once (not as a file), or use “Copy config line”' : (e.message||'Could not prepare the file'));
  }
}

const LIVE_FIELDS = ['isLive','title','streamUrl','hostScholarId','hostName','schedule','mode','chatOn','viewers','sessionId','startedAt','engine','agoraAppId','channel','audioOnly','hostRtcUid'];
let _liveRemoteSig = '', _liveRemoteObj = null, _liveSyncTimer = null;
function liveSig(o){ return JSON.stringify(LIVE_FIELDS.map(k=>o[k]===undefined ? null : o[k])); }
function fbApplyLive(d){
  const L = DATA.live;
  const before = [L.isLive, L.mode, L.streamUrl, L.sessionId, L.title, L.chatOn, L.engine, L.channel, L.audioOnly].join('|');
  LIVE_FIELDS.forEach(k=>{ if(d[k]!==undefined) L[k] = d[k]; });
  if(L.isLive && L.mode!=='camera') L.isLive = false;
  if(!Array.isArray(L.schedule)) L.schedule = [];
  if(typeof L.viewers!=='number') L.viewers = 0;
  _liveRemoteSig = liveSig(L);
  _liveRemoteObj = JSON.parse(JSON.stringify(LIVE_FIELDS.reduce((o,k)=>{ o[k] = L[k]===undefined ? null : L[k]; return o; }, {})));
  const after = [L.isLive, L.mode, L.streamUrl, L.sessionId, L.title, L.chatOn, L.engine, L.channel, L.audioOnly].join('|');
  if(!L.isLive && isHosting()) rtcHostStop(false);
  if(before!==after){
    rtcViewerStop();
    refreshAllUi();
  }else{
    liveRefreshViewers();
    if(appScreen.name==='live' || appScreen.name==='home'){ /* schedule may have changed */ if(appScreen.name==='home') renderApp(); }
    try{ if(adminSection==='live') renderAdmin(); }catch(e){}
  }
}
function fbSyncLive(){
  if(!FB.on) return;
  const L = DATA.live;
  if(L.isLive && !L.startedAt) L.startedAt = Date.now();
  if(!L.isLive){ L.startedAt = null; L.viewers = 0; }
  const sig = liveSig(L);
  if(sig===_liveRemoteSig) return;
  if(!FB.staff){
    // a non-staff person cannot publish live changes — roll back and tell them
    if(_liveRemoteObj) LIVE_FIELDS.forEach(k=>{ L[k] = _liveRemoteObj[k]; });
    showToast('Not published — only staff can change the live status');
    refreshAllUi();
    return;
  }
  if(!L.isLive && isHosting()) rtcHostStop(false);
  clearTimeout(_liveSyncTimer);
  _liveSyncTimer = setTimeout(()=>{
    const o = {};
    LIVE_FIELDS.forEach(k=>{ if(L[k]!==undefined) o[k] = L[k]; });
    o.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
    _liveRemoteSig = liveSig(L);
    FB.db.collection('live').doc('current').set(o, { merge:true }).catch(e=>{ showToast('Could not update the live status: '+fbFriendlyError(e)); });
  }, 120);
}
